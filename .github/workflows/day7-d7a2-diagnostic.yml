name: Day 7 D7A2 Release Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/day7-commercial-entry.js
      - worker/domain/day7-commercial-care-service.js
      - worker/domain/day7-lifecycle-service.js
      - worker/day8-commercial-entry.js
      - day7-commercial-browser.js
      - clinician-portal/day7-prefounder-queue.js
      - migrations/day1/0710_day7_commercial_return_foundershot.sql
      - tests/day7-release-critical.test.mjs
      - tests/day7-branchless-release-gate.test.mjs
      - scripts/day5-build-qa-frontend.mjs
      - .github/workflows/day7-d7a2-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Syntax
        run: |
          node --check worker/day7-commercial-entry.js
          node --check worker/domain/day7-commercial-care-service.js
          node --check worker/domain/day7-lifecycle-service.js
          node --check worker/day8-commercial-entry.js
          node --check day7-commercial-browser.js
          node --check clinician-portal/day7-prefounder-queue.js
      - name: Day 5 gate
        run: npm run day5:gate 2>&1 | tee day7-d7a2-day5.txt
      - name: Day 7D gate
        run: npm run day7d:gate 2>&1 | tee day7-d7a2-day7d.txt
      - name: Branchless release tests
        run: node --test tests/day7-branchless-release-gate.test.mjs 2>&1 | tee day7-d7a2-branchless.txt
      - name: Day 7 release tests
        run: node --test tests/day7-release-critical.test.mjs 2>&1 | tee day7-d7a2-release.txt
      - name: Day 6 Studio regression
        run: node --test tests/day6-studio.test.mjs 2>&1 | tee day7-d7a2-day6.txt
      - name: QA frontend build
        run: |
          node scripts/day7b-build-qa-frontend.mjs
          node scripts/day4-build-qa-frontend.mjs
          node scripts/day5-build-qa-frontend.mjs 2>&1 | tee day7-d7a2-frontend.txt
          grep -Fq 'GalviCare Day 7 provider-verified commercial return v1' dist-qa/index.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day7-d7a2-diagnostic-${{ github.sha }}
          if-no-files-found: warn
          path: day7-d7a2-*.txt
