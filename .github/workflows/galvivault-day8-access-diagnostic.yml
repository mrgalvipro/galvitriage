name: GalviVault Day 8 Access Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - '.github/workflows/galvivault-day8-access-diagnostic.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Capture sanitized Access API result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/day8
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          code="$(curl -sS -o /tmp/access-org.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$api/access/organizations" || true)"
          success="$(jq -r '.success // false' /tmp/access-org.json 2>/dev/null || echo false)"
          auth_domain="$(jq -r '.result.auth_domain // empty' /tmp/access-org.json 2>/dev/null || true)"
          errors="$(jq -c '[.errors[]? | {code,message}]' /tmp/access-org.json 2>/dev/null || echo '[]')"
          jq -nc --arg sha "$GITHUB_SHA" --arg code "$code" --arg success "$success" --arg auth_domain "$auth_domain" --argjson errors "$errors" '{source_sha:$sha,http_status:$code,success:($success=="true"),auth_domain:$auth_domain,errors:$errors}' > release-evidence/day8/access-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-evidence/day8/access-diagnostic.json
          git commit -m "Day 8 QA: record Access API diagnostic ${GITHUB_SHA} [skip ci]" || exit 0
          git push origin HEAD:qa-revamped-galvicare-0-5
