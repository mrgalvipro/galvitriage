name: GalviCare QA Stabilization

on:
  pull_request:
    branches:
      - qa-revamped-galvicare-0-5
  push:
    branches:
      - qa-revamped-galvicare-0-5

permissions:
  contents: write

jobs:
  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply approved final Day 7A presentation corrections
        run: node scripts/day7a-final-presentation-patch.mjs index.html

      - name: Commit corrected authoritative source before testing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Day 7A: finalize customer-facing clinical presentation"
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi

      - name: Run Worker syntax and complete QA stabilization
        run: npm run stabilization:gate

      - name: Reject committed secret files
        shell: bash
        run: |
          if find . -type f \
            \( -name ".env" -o -name ".dev.vars" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "./node_modules/*" | grep -q .; then
            echo "Sensitive configuration file detected."
            exit 1
          fi
