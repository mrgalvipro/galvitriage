name: QA Stabilization Gate

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
  pull_request:
    branches:
      - qa-revamped-galvicare-0-5

jobs:
  stabilization-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run QA stabilization gate
        run: npm run stabilization:gate
