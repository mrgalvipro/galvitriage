name: GalviCare QA Stabilization

on:
  pull_request:
    branches:
      - qa-revamped-galvicare-0-5
    paths-ignore:
      - "worker/day1.js"
      - "worker/day2.js"
      - "migrations/day1/**"
      - "tests/day1-foundation.test.mjs"
      - "tests/galvivault-day2-identity-continuity.test.mjs"
      - "scripts/galvivault-day2-e2e.mjs"
      - "scripts/verify-galvivault-day2-files.mjs"
      - "wrangler.json"
      - "wrangler.day2.json"
      - ".github/workflows/day1-qa-foundation.yml"
      - ".github/workflows/day2-qa-identity-continuity.yml"
      - "release-evidence/day1/**"
      - "release-evidence/day2/**"
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths-ignore:
      - "worker/day1.js"
      - "worker/day2.js"
      - "migrations/day1/**"
      - "tests/day1-foundation.test.mjs"
      - "tests/galvivault-day2-identity-continuity.test.mjs"
      - "scripts/galvivault-day2-e2e.mjs"
      - "scripts/verify-galvivault-day2-files.mjs"
      - "wrangler.json"
      - "wrangler.day2.json"
      - ".github/workflows/day1-qa-foundation.yml"
      - ".github/workflows/day2-qa-identity-continuity.yml"
      - "release-evidence/day1/**"
      - "release-evidence/day2/**"

permissions:
  contents: read

jobs:
  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Worker syntax and QA tests
        # GalviCare regression gate. GalviVault has independent authoritative workflows.
        run: npm run stabilization:gate

      - name: Reject committed secret files
        shell: bash
        run: |
          if find . -type f \
            \( -name ".env" -o -name ".dev.vars" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "./node_modules/*" | grep -q .; then
            echo "Sensitive configuration file detected."
            exit 1
          fi
