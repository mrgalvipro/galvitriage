name: GalviStudio GalviCare Day 7 QA Release Gate

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/**
      - migrations/**
      - tests/**
      - scripts/**
      - clinician-portal/**
      - docs/GalviStudio_1_0_GalviCare_1_0_Day_4_Builder_Guide_CODEX_Implementation_Engineer_Edition_v1_0.md
      - docs/GalviStudio_1_0_GalviCare_1_0_Day_7_Builder_Guide_CODEX_Implementation_Engineer_Edition_v1_0.md
      - docs/GalviStudio_1_0_GalviCare_1_0_Seven_Day_Implementation_Guide_AUTHORITATIVE_v1_0.md
      - release-evidence/day7/**
      - release-evidence/day8/qa-deployment-current.json
      - package.json
      - wrangler.day6.json
      - wrangler.day7.json
      - wrangler.day8.json
      - wrangler.qa-frontend.jsonc
      - qa-frontend-worker.js
      - index.html
      - day1-prefounder-customer.js
      - day1-prefounder-qa.js
      - day3-governed-ai-customer-bridge.mjs
      - day4-galvichart-browser.js
      - day4-customer-experience-hardening.js
      - day4-single-current-governed-product.js
      - day5-score-metadata.js
      - day5-customer-care-routing.js
      - day5-customer-active-care.js
      - .github/workflows/galvistudio-day7-qa.yml
      - .github/workflows/galvivault-day8-qa.yml

permissions:
  contents: read

concurrency:
  group: galvivault-qa-exclusive-mutator
  cancel-in-progress: false

env:
  DAY6_RUNTIME_CANDIDATE: a197197217939f6301ca96c6ff0310bb8724d778
  DAY7_QA_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  DAY6_QA_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev
  DAY8_CLINICIAN_BASELINE_SHA: acf8b84c5ef83a9069f8fda9d180e42fd6e3b757

jobs:
  day7-qa-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: qa
    steps:
      - name: Checkout exact existing QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: P0 existing-QA-only and Day 6 ancestry proof
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF" = "refs/heads/qa-revamped-galvicare-0-5"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$DAY6_RUNTIME_CANDIDATE^{commit}"
          git merge-base --is-ancestor "$DAY6_RUNTIME_CANDIDATE" "$GITHUB_SHA"
          git cat-file -e "$DAY8_CLINICIAN_BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$DAY8_CLINICIAN_BASELINE_SHA" "$GITHUB_SHA"
          git diff --name-only "$DAY6_RUNTIME_CANDIDATE..$GITHUB_SHA" | tee day7-entry-delta.txt
          unexpected=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              docs/*|release-evidence/day7/*|release-evidence/day8/qa-deployment-current.json|clinician-portal/day7-prefounder-queue.js|clinician-portal/day7-membership.js|clinician-portal/day7-customer-access.js|clinician-portal/index.html|scripts/day7-codex-bootstrap.sh|scripts/day7-deployed-release-e2e.mjs|tests/day7-branchless-release-gate.test.mjs|tests/day7-release-critical.test.mjs|tests/day7-customer-access.test.mjs|tests/day8-clinician-workspace.test.mjs|tests/day1-prefounder-customer.test.mjs|day1-prefounder-customer.js|day5-customer-care-routing.js|qa-frontend-worker.js|worker/day7-entry.js|worker/day7-customer-entry.js|worker/day8-day6-entry.js|worker/day8-day7-entry.js|worker/routes/day7-release.js|worker/routes/operator-workspace.js|worker/domain/day7-membership-service.js|worker/domain/day7-customer-access-service.js|migrations/day1/0700_day7_release_membership.sql|wrangler.day7.json|wrangler.day8.json|.github/workflows/galvistudio-day7-qa.yml|.github/workflows/galvivault-day8-qa.yml)
                ;;
              *) echo "STOP: unapproved Day 7 delta: $path"; unexpected=1 ;;
            esac
          done < day7-entry-delta.txt
          test "$unexpected" = 0
          test -z "$(git status --porcelain --untracked-files=no)"
          git branch -r | sed 's/^[[:space:]]*//' | tee day7-remote-branches.txt
          ! grep -Eq '^origin/(work|Day7|day7|release|hotfix)(/|$)' day7-remote-branches.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Day 7 release-control syntax and branchless gates
        shell: bash
        run: |
          set -euo pipefail
          node --check day1-prefounder-customer.js
          node --check qa-frontend-worker.js
          node --check clinician-portal/day7-prefounder-queue.js
          node --check clinician-portal/day7-membership.js
          node --check clinician-portal/day7-customer-access.js
          node --check worker/day7-entry.js
          node --check worker/day7-customer-entry.js
          node --check worker/day8-day6-entry.js
          node --check worker/day8-day7-entry.js
          node --check worker/domain/day7-membership-service.js
          node --check worker/domain/day7-customer-access-service.js
          node --check worker/routes/day7-release.js
          node --check worker/routes/operator-workspace.js
          node --check scripts/day7-deployed-release-e2e.mjs
          node --test tests/day1-prefounder-customer.test.mjs
          node --test tests/day8-clinician-workspace.test.mjs
          node --test tests/day7-customer-access.test.mjs
          node --test tests/day7-branchless-release-gate.test.mjs
          node --test tests/day7-release-critical.test.mjs | tee day7-t01-t60-control-map.txt
          grep -Eq '# fail 0|fail 0' day7-t01-t60-control-map.txt
          grep -Eq '# skipped 0|skipped 0' day7-t01-t60-control-map.txt

      - name: Full inherited Day 1-6 repository regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test | tee day7-inherited-regression.txt
          grep -Eq '# fail 0|fail 0' day7-inherited-regression.txt
          grep -Eq '# skipped 0|skipped 0' day7-inherited-regression.txt
          npm run day5:gate
          npm run day7d:gate

      - name: Re-prove Day 6 release contract on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day6-entry.js
          node --check worker/domain/day6-catalog.js
          node --check worker/domain/day6-studio-service.js
          node --check worker/routes/day6-studio.js
          node --check scripts/day6-deployed-e2e.mjs
          node --test tests/day6-studio.test.mjs | tee day7-day6-contract.txt
          grep -Eq '# tests 50|tests 50' day7-day6-contract.txt
          grep -Eq '# fail 0|fail 0' day7-day6-contract.txt
          grep -Eq '# skipped 0|skipped 0' day7-day6-contract.txt

      - name: Generate cumulative QA frontend and prove release-contract markers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/day7b-build-qa-frontend.mjs
          node scripts/day4-build-qa-frontend.mjs
          node scripts/day5-build-qa-frontend.mjs
          test -s dist-qa/index.html
          grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' dist-qa/index.html
          grep -Fq 'GalviScore™ | Founder Readiness' dist-qa/index.html
          grep -Fq 'SPUR™ Pre-Founder Route' dist-qa/index.html
          grep -Fq 'PRE-FOUNDER CLOSED LOOP' dist-qa/index.html
          grep -Fq 'Returning Patient? Log in to GalviCare' qa-frontend-worker.js
          ! grep -Fq 'https://galvicare-0-5-production.mrgalvipro.workers.dev' dist-qa/index.html
          ! grep -RniE 'api\.openai\.com|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{16,}' day1-prefounder-customer.js qa-frontend-worker.js day4-galvichart-browser.js day4-customer-experience-hardening.js day4-single-current-governed-product.js day5-score-metadata.js day5-customer-care-routing.js day5-customer-active-care.js clinician-portal/day7-prefounder-queue.js clinician-portal/day7-membership.js clinician-portal/day7-customer-access.js worker/day7-entry.js worker/day7-customer-entry.js worker/day8-day6-entry.js worker/day8-day7-entry.js worker/routes/day7-release.js worker/routes/operator-workspace.js worker/domain/day7-membership-service.js worker/domain/day7-customer-access-service.js

      - name: Prove exact QA Worker and canonical D1 binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const w=JSON.parse(fs.readFileSync('wrangler.day7.json','utf8')),db=w.d1_databases?.[0];
          if(w.name!=='galvivault-p0-day1-qa'||w.main!=='worker/day7-customer-entry.js'||w.vars?.ENVIRONMENT!=='qa'||w.vars?.MIN_SCHEMA_VERSION!=='D7A1') throw new Error('Day7 QA runtime mismatch.');
          if(w.vars?.DAY7_BUSINESS_HEALTH_MEMBERSHIP!=='server_governed_beta_v1'||w.vars?.DAY7_CUSTOMER_ACCESS!=='business_physician_queue_only_v1') throw new Error('Day7 Membership/customer-access contract missing.');
          if(db?.binding!=='DB'||db?.database_name!=='galvivault-0-5-qa'||db?.database_id!=='cdf9042b-ab09-498a-ac66-010b6cce47d4') throw new Error('Day7 must reuse canonical QA D1.');
          NODE

      - name: Verify/apply exact additive Day 6 and Day 7 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sha256sum migrations/day1/*.sql | sort > day7-migration-manifest.txt
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --command "SELECT migration_id,name FROM gv1_schema_migrations WHERE name IN ('day6_studio_vdm_v1','day7_business_health_membership_beta_v1') ORDER BY migration_id;" | tee day7-migration-before.txt
          if ! grep -q 'day6_studio_vdm_v1' day7-migration-before.txt; then npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0600_day6_studio_vdm.sql; fi
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0700_day7_release_membership.sql
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --command "SELECT migration_id,name,checksum FROM gv1_schema_migrations WHERE name IN ('day6_studio_vdm_v1','day7_business_health_membership_beta_v1') ORDER BY migration_id; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('gv1_memberships','gv1_membership_events','gv1_membership_checkins','gv1_membership_reassessment_queue','gv1_prefounder_sessions','gv1_prefounder_care_events','gv1_customer_accounts','gv1_customer_login_invites','gv1_customer_login_sessions') ORDER BY name;" | tee day7-schema.txt
          grep -q 'D6A1' day7-schema.txt
          grep -q 'D7A1' day7-schema.txt
          grep -q 'gv1-d7a1-membership-prefounder-customer-access-v3' day7-schema.txt
          for t in gv1_memberships gv1_membership_events gv1_membership_checkins gv1_membership_reassessment_queue gv1_prefounder_sessions gv1_prefounder_care_events gv1_customer_accounts gv1_customer_login_invites gv1_customer_login_sessions; do grep -q "$t" day7-schema.txt; done

      - name: Deploy exact Day 7 candidate to existing QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 deploy --config wrangler.day7.json --var COMMIT_SHA:$GITHUB_SHA | tee day7-worker-deploy.txt
          sleep 12
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/health?day7=$GITHUB_SHA" | tee day7-health.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day5/readiness?day7=$GITHUB_SHA" | tee day7-day5-readiness.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day6/readiness?day7=$GITHUB_SHA" | tee day7-day6-readiness.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day7/readiness?day7=$GITHUB_SHA" | tee day7-readiness.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day7/customer-access/readiness?day7=$GITHUB_SHA" | tee day7-customer-access-readiness.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('day7-health.json','utf8')),d5=JSON.parse(fs.readFileSync('day7-day5-readiness.json','utf8')),d6=JSON.parse(fs.readFileSync('day7-day6-readiness.json','utf8')),d7=JSON.parse(fs.readFileSync('day7-readiness.json','utf8')),ca=JSON.parse(fs.readFileSync('day7-customer-access-readiness.json','utf8'));
          if(h?.success!==true||h?.data?.commit_sha!==process.env.GITHUB_SHA) throw new Error('Exact deployed SHA mismatch.');
          if(d5?.success!==true||d5?.data?.ready!==true) throw new Error('Day5 readiness failed.');
          if(d6?.success!==true||d6?.data?.ready!==true) throw new Error('Day6 readiness failed.');
          if(d7?.success!==true||d7?.data?.ready!==true||d7?.data?.current_schema_version!=='D7A1') throw new Error('Day7 readiness failed.');
          if(d7?.data?.prefounder_closed_loop?.normal_email!==true||d7?.data?.prefounder_closed_loop?.manual_repair!=='NO') throw new Error('Pre-Founder closed-loop readiness failed.');
          if(ca?.success!==true||ca?.data?.ready!==true||ca?.data?.manual_repair!=='NO') throw new Error('Returning customer access readiness failed.');
          NODE
          node scripts/day6-deployed-e2e.mjs | tee day7-day6-deployed-e2e.json
          node scripts/day7-deployed-release-e2e.mjs | tee day7-release-deployed-e2e.json

      - name: Rehearse non-destructive prior-runtime rollback
        id: rollback
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          R=/tmp/galvicare-day7-rollback-$GITHUB_RUN_ID
          rm -rf "$R"
          git worktree add --detach "$R" "$DAY6_RUNTIME_CANDIDATE"
          (cd "$R"; test "$(git rev-parse HEAD)" = "$DAY6_RUNTIME_CANDIDATE"; npx --yes wrangler@4.120.0 deploy --config wrangler.day6.json --var COMMIT_SHA:$DAY6_RUNTIME_CANDIDATE | tee "$GITHUB_WORKSPACE/day7-rollback-deploy.txt")
          sleep 12
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/health?rollback=$GITHUB_SHA" | tee day7-rollback-health.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day6/readiness?rollback=$GITHUB_SHA" | tee day7-rollback-day6-readiness.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('day7-rollback-health.json','utf8')),d=JSON.parse(fs.readFileSync('day7-rollback-day6-readiness.json','utf8'));
          if(h?.success!==true||h?.data?.commit_sha!==process.env.DAY6_RUNTIME_CANDIDATE) throw new Error('Rollback identity failed.');
          if(d?.success!==true||d?.data?.ready!==true) throw new Error('Prior runtime incompatible with additive schema.');
          NODE
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --command "SELECT migration_id,name FROM gv1_schema_migrations WHERE name='day7_business_health_membership_beta_v1'; SELECT COUNT(*) AS memberships FROM gv1_memberships; SELECT COUNT(*) AS prefounder_events FROM gv1_prefounder_care_events; SELECT COUNT(*) AS customer_accounts FROM gv1_customer_accounts;" | tee day7-rollback-d1.txt
          grep -q 'day7_business_health_membership_beta_v1' day7-rollback-d1.txt
          git worktree remove --force "$R"

      - name: Restore exact Day 7 candidate after rollback rehearsal
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx --yes wrangler@4.120.0 deploy --config wrangler.day7.json --var COMMIT_SHA:$GITHUB_SHA | tee day7-restore-deploy.txt
          ready=0
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            if curl -fsS "$DAY7_QA_URL/health?restore=$GITHUB_SHA&attempt=$attempt" -o /tmp/day7-restore-health.json && curl -fsS "$DAY7_QA_URL/api/v1/day7/readiness?restore=$GITHUB_SHA&attempt=$attempt" -o /tmp/day7-restore.json; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('/tmp/day7-restore-health.json','utf8')),d=JSON.parse(fs.readFileSync('/tmp/day7-restore.json','utf8')); process.exit(h?.success===true&&h?.data?.commit_sha===process.env.GITHUB_SHA&&d?.success===true&&d?.data?.ready===true?0:1);
          NODE
              then ready=1; cp /tmp/day7-restore-health.json day7-restore-health.json; cp /tmp/day7-restore.json day7-restore-readiness.json; break; fi
            fi
          done
          test "$ready" = 1

      - name: Deploy cumulative existing QA frontend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.qa-frontend.jsonc
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS "$QA_FRONTEND_URL/health?day7=$GITHUB_SHA-$attempt" -o day7-frontend-health.json || true
            curl -fsS "$QA_FRONTEND_URL/?day7=$GITHUB_SHA-$attempt" -o day7-runtime.html || true
            if grep -Fq '"environment":"qa"' day7-frontend-health.json 2>/dev/null && grep -Fq '"stripe_mode":"test"' day7-frontend-health.json 2>/dev/null && grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' day7-runtime.html 2>/dev/null && grep -Fq 'PRE-FOUNDER CLOSED LOOP' day7-runtime.html 2>/dev/null && grep -Fq 'Returning Patient? Log in to GalviCare' day7-runtime.html 2>/dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1

      - name: Re-run inherited gates after deployed E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run day5:gate
          node --test tests/day1-prefounder-customer.test.mjs
          node --test tests/day8-clinician-workspace.test.mjs
          node --test tests/day7-customer-access.test.mjs
          node --test tests/day7-release-critical.test.mjs

      - name: Archive Day 7 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvistudio-galvicare-day7-qa-${{ github.sha }}
          if-no-files-found: warn
          path: |
            day7-*.txt
            day7-*.json
            day7-runtime.html

      - name: Day 7 QA release summary
        if: always()
        shell: bash
        run: |
          echo '## GalviStudio 1.0 | GalviCare 1.0 Day 7 QA' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact existing QA candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- New branch created: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Work ref pushed: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing QA Worker/D1/frontend reused: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Push-triggered QA validation keeps the shared Day 7 runtime stable; rollback runtime swap is manual-release-only: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 8 clinician navigator baseline is an ancestor; current exact Day 8 run must also be green before sign-off: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full inherited Day 1-6 regression + Day7D integration gate: executed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Returning-patient login restores the same entitled BHR only when Business Physician care is queued: enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Customer credentials are PBKDF2-hashed in GalviVault; raw passwords/invite/session tokens are not persisted: enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- HubSpot GalviChart-update email remains non-blocking and requires transactional-email configuration: enforced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Business Health Membership clinical decision -> customer offer -> server-verified paid activation remains authoritative' >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback rehearsal: ${{ steps.rollback.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Production/main modified: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Next mandatory gate: comprehensive Golden A-I + P0-01..P0-16, security/accessibility + three formal release gates' >> "$GITHUB_STEP_SUMMARY"
