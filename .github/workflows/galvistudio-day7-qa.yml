name: GalviStudio GalviCare Day 7 QA Release Gate

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/**
      - migrations/**
      - tests/**
      - scripts/**
      - docs/GalviStudio_1_0_GalviCare_1_0_Day_7_Builder_Guide_CODEX_Implementation_Engineer_Edition_v1_0.md
      - docs/GalviStudio_1_0_GalviCare_1_0_Seven_Day_Implementation_Guide_AUTHORITATIVE_v1_0.md
      - release-evidence/day7/**
      - package.json
      - wrangler.day6.json
      - wrangler.qa-frontend.jsonc
      - qa-frontend-worker.js
      - index.html
      - day1-prefounder-customer.js
      - day1-prefounder-qa.js
      - day3-governed-ai-customer-bridge.mjs
      - day4-galvichart-browser.js
      - day4-customer-experience-hardening.js
      - day4-single-current-governed-product.js
      - day5-score-metadata.js
      - day5-customer-care-routing.js
      - day5-customer-active-care.js
      - .github/workflows/galvistudio-day7-qa.yml

permissions:
  contents: read

concurrency:
  group: galvivault-qa-exclusive-mutator
  cancel-in-progress: false

env:
  DAY6_RUNTIME_CANDIDATE: a197197217939f6301ca96c6ff0310bb8724d778
  DAY6_QA_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev

jobs:
  day7-qa-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: qa
    steps:
      - name: Checkout exact existing QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: P0 existing-QA-only and Day 6 ancestry proof
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$DAY6_RUNTIME_CANDIDATE" "$GITHUB_SHA"
          changed="$(git diff --name-only "$DAY6_RUNTIME_CANDIDATE..$GITHUB_SHA")"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|release-evidence/day7/|scripts/day7-codex-bootstrap\.sh|tests/day7-branchless-release-gate\.test\.mjs|\.github/workflows/galvistudio-day7-qa\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "STOP: unapproved application/runtime delta after Day 6 runtime candidate:"
            printf '%s\n' "$unexpected"
            exit 71
          fi
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Day 7 branchless/source-of-truth guard
        run: node --test tests/day7-branchless-release-gate.test.mjs

      - name: Full inherited repository regression
        run: |
          npm run check
          npm test
          npm run day5:gate

      - name: Re-prove Day 6 release contract on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day6-entry.js
          node --check worker/domain/day6-catalog.js
          node --check worker/domain/day6-studio-service.js
          node --check worker/routes/day6-studio.js
          node --check scripts/day6-deployed-e2e.mjs
          node --test tests/day6-studio.test.mjs | tee day7-day6-contract.txt
          grep -Eq '# tests 50|tests 50' day7-day6-contract.txt
          grep -Eq '# fail 0|fail 0' day7-day6-contract.txt
          grep -Eq '# skipped 0|skipped 0' day7-day6-contract.txt

      - name: Generate cumulative QA frontend and prove release-contract markers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/day7b-build-qa-frontend.mjs
          node scripts/day4-build-qa-frontend.mjs
          node scripts/day5-build-qa-frontend.mjs
          test -s dist-qa/index.html
          grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' dist-qa/index.html
          ! grep -Fq 'https://galvicare-0-5-production.mrgalvipro.workers.dev' dist-qa/index.html
          ! grep -RniE 'api\.openai\.com|OPENAI_API_KEY' \
            day4-galvichart-browser.js day4-customer-experience-hardening.js \
            day4-single-current-governed-product.js day5-score-metadata.js \
            day5-customer-care-routing.js day5-customer-active-care.js

      - name: Prove exact QA Worker and D1 binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const w=JSON.parse(fs.readFileSync('wrangler.day6.json','utf8')),db=w.d1_databases?.[0];
          if(w.name!=='galvivault-p0-day1-qa'||w.main!=='worker/day6-entry.js'||w.vars?.ENVIRONMENT!=='qa'||w.vars?.MIN_SCHEMA_VERSION!=='D6A1') throw new Error('Day 7 must reuse exact Day 6 QA Worker contract.');
          if(db?.binding!=='DB'||db?.database_name!=='galvivault-0-5-qa'||db?.database_id!=='cdf9042b-ab09-498a-ac66-010b6cce47d4') throw new Error('Day 7 must reuse canonical QA D1.');
          NODE

      - name: Verify/apply additive Day 6 schema only if missing
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day6.json --command \
            "SELECT migration_id,name,environment,checksum FROM gv1_schema_migrations WHERE name='day6_studio_vdm_v1';" | tee day7-migration-before.txt
          if ! grep -q 'day6_studio_vdm_v1' day7-migration-before.txt; then
            npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day6.json --file migrations/day1/0600_day6_studio_vdm.sql
          fi

      - name: Deploy exact candidate to existing QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 deploy --config wrangler.day6.json --var COMMIT_SHA:$GITHUB_SHA | tee day7-worker-deploy.txt
          sleep 12
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$DAY6_QA_URL/health?day7=$GITHUB_SHA" | tee day7-health.json
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$DAY6_QA_URL/api/v1/day5/readiness?day7=$GITHUB_SHA" | tee day7-day5-readiness.json
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$DAY6_QA_URL/api/v1/day6/readiness?day7=$GITHUB_SHA" | tee day7-day6-readiness.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('day7-health.json','utf8'));
          const d5=JSON.parse(fs.readFileSync('day7-day5-readiness.json','utf8'));
          const d6=JSON.parse(fs.readFileSync('day7-day6-readiness.json','utf8'));
          if(h?.success!==true||h?.data?.commit_sha!==process.env.GITHUB_SHA) throw new Error('Exact deployed SHA mismatch.');
          if(d5?.success!==true||d5?.data?.ready!==true) throw new Error('Day 5 inherited readiness failed.');
          if(d6?.success!==true||d6?.data?.ready!==true||d6?.data?.current_schema_version!=='D6A1') throw new Error('Day 6 readiness failed.');
          NODE
          node scripts/day6-deployed-e2e.mjs | tee day7-day6-deployed-e2e.json

      - name: Deploy cumulative existing QA frontend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.qa-frontend.jsonc
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS "$QA_FRONTEND_URL/health?day7=$GITHUB_SHA-$attempt" -o day7-frontend-health.json || true
            curl -fsS "$QA_FRONTEND_URL/?day7=$GITHUB_SHA-$attempt" -o day7-runtime.html || true
            if grep -Fq '"environment":"qa"' day7-frontend-health.json 2>/dev/null \
              && grep -Fq '"stripe_mode":"test"' day7-frontend-health.json 2>/dev/null \
              && grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' day7-runtime.html 2>/dev/null; then
              ready=1; break
            fi
            sleep 3
          done
          test "$ready" = 1

      - name: Re-run inherited gate after deployed E2E
        run: npm run day5:gate

      - name: Archive Day 7 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvistudio-galvicare-day7-qa-${{ github.sha }}
          if-no-files-found: warn
          path: |
            day7-*.txt
            day7-*.json
            day7-runtime.html

      - name: Day 7 QA release summary
        if: always()
        shell: bash
        run: |
          echo '## GalviStudio 1.0 | GalviCare 1.0 Day 7 QA' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact existing QA candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- New branch created: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Work ref pushed: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing QA Worker/D1/frontend reused: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full inherited automated regression: executed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 6 contract/deployed E2E: re-proven against exact candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production/main modified: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Next gate after workflow PASS: Day 7 Golden Cases + P0-01..P0-16 Human E2E + formal release gates' >> "$GITHUB_STEP_SUMMARY"
