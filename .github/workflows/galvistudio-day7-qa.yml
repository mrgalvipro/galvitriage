name: GalviStudio GalviCare Day 7 QA Release Gate

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/**
      - migrations/**
      - tests/**
      - scripts/**
      - clinician-portal/**
      - docs/**
      - release-evidence/day7/**
      - release-evidence/day8/qa-deployment-current.json
      - package.json
      - wrangler.day6.json
      - wrangler.day7.json
      - wrangler.day8.json
      - wrangler.qa-frontend.jsonc
      - qa-frontend-worker.js
      - index.html
      - day1-prefounder-customer.js
      - day1-prefounder-qa.js
      - day3-governed-ai-customer-bridge.mjs
      - day4-galvichart-browser.js
      - day4-customer-experience-hardening.js
      - day4-single-current-governed-product.js
      - day5-score-metadata.js
      - day5-customer-care-routing.js
      - day5-customer-active-care.js
      - day7-commercial-browser.js
      - .github/workflows/galvistudio-day7-qa.yml
      - .github/workflows/galvivault-day8-qa.yml

permissions:
  contents: read

concurrency:
  group: galvivault-qa-exclusive-mutator
  cancel-in-progress: false

env:
  DAY6_RUNTIME_CANDIDATE: a197197217939f6301ca96c6ff0310bb8724d778
  DAY7_QA_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  DAY6_QA_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev
  DAY8_CLINICIAN_BASELINE_SHA: acf8b84c5ef83a9069f8fda9d180e42fd6e3b757

jobs:
  day7-qa-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: qa
    steps:
      - name: Checkout exact existing QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: P0 existing-QA-only ancestry and branch proof
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF" = "refs/heads/qa-revamped-galvicare-0-5"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$DAY6_RUNTIME_CANDIDATE^{commit}"
          git merge-base --is-ancestor "$DAY6_RUNTIME_CANDIDATE" "$GITHUB_SHA"
          git cat-file -e "$DAY8_CLINICIAN_BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$DAY8_CLINICIAN_BASELINE_SHA" "$GITHUB_SHA"
          git branch -r | sed 's/^[[:space:]]*//' | tee day7-remote-branches.txt
          ! grep -Eq '^origin/(work|Day7|day7|release|hotfix)(/|$)' day7-remote-branches.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --name-only "$DAY6_RUNTIME_CANDIDATE..$GITHUB_SHA" | tee day7-entry-delta.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Day 7 D7A3 syntax and authority gate
        shell: bash
        run: |
          set -euo pipefail
          node --check day1-prefounder-customer.js
          node --check day3-governed-ai-customer-bridge.mjs
          node --check qa-frontend-worker.js
          node --check worker/day7-entry.js
          node --check worker/day7-customer-entry.js
          node --check worker/day7-commercial-entry.js
          node --check worker/domain/day7-commercial-care-service.js
          node --check worker/domain/day7-stripe-systeme-service.js
          node --check worker/domain/day7-lifecycle-service.js
          node --check worker/day8-day6-entry.js
          node --check worker/day8-day7-entry.js
          node --check worker/day8-commercial-entry.js
          node --check worker/domain/day7-membership-service.js
          node --check worker/domain/day7-customer-access-service.js
          node --check worker/routes/day7-release.js
          node --check worker/routes/operator-workspace.js
          node --check clinician-portal/day7-prefounder-queue.js
          node --check clinician-portal/day7-membership.js
          node --check clinician-portal/day7-customer-access.js
          if [ -f day7-commercial-browser.js ]; then node --check day7-commercial-browser.js; fi
          grep -Fq "D7A2" migrations/day1/0710_day7_commercial_return_foundershot.sql
          grep -Fq "D7A3" migrations/day1/0720_day7_stripe_systeme_treatment_delivery.sql
          grep -Fq "gv1_commercial_care_orders" migrations/day1/0710_day7_commercial_return_foundershot.sql
          grep -Fq "gv1_treatment_payment_events" migrations/day1/0720_day7_stripe_systeme_treatment_delivery.sql
          grep -Fq '"DAY7_COMMERCIAL_SCHEMA": "D7A3"' wrangler.day7.json
          grep -Fq '"DAY7_COMMERCIAL_PAYMENT_AUTHORITY": "stripe_test_v1"' wrangler.day7.json
          grep -Fq '"DAY7_TREATMENT_FULFILLMENT_AUTHORITY": "systeme_v1"' wrangler.day7.json
          ! grep -RniE 'sk-[A-Za-z0-9_-]{16,}|SYSTEME_WEBHOOK_TOKEN[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}|STRIPE_TREATMENT_WEBHOOK_SECRET[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}' worker wrangler.day7.json wrangler.day8.json

      - name: Full inherited Day 1-6 and Day 7 regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test | tee day7-inherited-regression.txt
          grep -Eq '# fail 0|fail 0' day7-inherited-regression.txt
          npm run day5:gate
          npm run day7d:gate
          node --test tests/day1-prefounder-customer.test.mjs
          node --test tests/day8-clinician-workspace.test.mjs
          node --test tests/day7-customer-access.test.mjs
          node --test tests/day7-branchless-release-gate.test.mjs
          node --test tests/day7-release-critical.test.mjs
          node --test tests/day6-studio.test.mjs | tee day7-day6-contract.txt
          grep -Eq '# fail 0|fail 0' day7-day6-contract.txt

      - name: Generate cumulative QA frontend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/day7b-build-qa-frontend.mjs
          node scripts/day4-build-qa-frontend.mjs
          node scripts/day5-build-qa-frontend.mjs
          test -s dist-qa/index.html
          grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' dist-qa/index.html
          grep -Fq 'PRE-FOUNDER CLOSED LOOP' dist-qa/index.html
          grep -Fq 'Returning Patient? Log in to GalviCare' qa-frontend-worker.js
          grep -Fq 'GalviCare Day 7 Stripe-authoritative commercial return v2' dist-qa/index.html

      - name: Prove exact QA Worker and canonical D1 binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const w=JSON.parse(fs.readFileSync('wrangler.day7.json','utf8')),db=w.d1_databases?.[0];
          if(w.name!=='galvivault-p0-day1-qa'||w.main!=='worker/day7-commercial-entry.js'||w.vars?.ENVIRONMENT!=='qa') throw new Error('Day7 QA runtime mismatch.');
          if(w.vars?.DAY7_COMMERCIAL_SCHEMA!=='D7A3'||w.vars?.DAY7_COMMERCIAL_PAYMENT_AUTHORITY!=='stripe_test_v1'||w.vars?.DAY7_TREATMENT_FULFILLMENT_AUTHORITY!=='systeme_v1'||w.vars?.DAY7_FOUNDER_SHOT!=='governed_founder_mri_v1') throw new Error('D7A3 commercial/FounderShot contract missing.');
          if(db?.binding!=='DB'||db?.database_name!=='galvivault-0-5-qa'||db?.database_id!=='cdf9042b-ab09-498a-ac66-010b6cce47d4') throw new Error('Day7 must reuse canonical QA D1.');
          NODE

      - name: Verify and apply exact additive Day 6, D7A1, D7A2 and D7A3 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sha256sum migrations/day1/*.sql | sort > day7-migration-manifest.txt
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0600_day6_studio_vdm.sql
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0700_day7_release_membership.sql
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0710_day7_commercial_return_foundershot.sql
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --file migrations/day1/0720_day7_stripe_systeme_treatment_delivery.sql
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day7.json --command "SELECT migration_id,name,checksum FROM gv1_schema_migrations WHERE migration_id IN ('D6A1','D7A1','D7A2','D7A3') ORDER BY migration_id; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('gv1_commercial_care_orders','gv1_systeme_integration_events','gv1_treatment_payment_events','gv1_care_reassessment_queue','gv1_founder_snapshots','gv1_lifecycle_transition_reviews') ORDER BY name;" | tee day7-schema.txt
          grep -q 'D6A1' day7-schema.txt
          grep -q 'D7A1' day7-schema.txt
          grep -q 'D7A2' day7-schema.txt
          grep -q 'D7A3' day7-schema.txt
          for t in gv1_commercial_care_orders gv1_systeme_integration_events gv1_treatment_payment_events gv1_care_reassessment_queue gv1_founder_snapshots gv1_lifecycle_transition_reviews; do grep -q "$t" day7-schema.txt; done

      - name: Deploy exact Day 7 candidate to existing QA Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEME_WEBHOOK_TOKEN: ${{ secrets.SYSTEME_WEBHOOK_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SYSTEME_WEBHOOK_TOKEN:-}"
          printf '%s' "$SYSTEME_WEBHOOK_TOKEN" | npx --yes wrangler@4.120.0 secret put SYSTEME_WEBHOOK_TOKEN --config wrangler.day7.json
          npx --yes wrangler@4.120.0 deploy --config wrangler.day7.json --var COMMIT_SHA:$GITHUB_SHA | tee day7-worker-deploy.txt
          sleep 12
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/health?day7=$GITHUB_SHA" | tee day7-health.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day6/readiness?day7=$GITHUB_SHA" | tee day7-day6-readiness.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day7/readiness?day7=$GITHUB_SHA" | tee day7-readiness.json
          curl -fsS -H 'Cache-Control: no-cache' "$DAY7_QA_URL/api/v1/day7/commercial/catalog?day7=$GITHUB_SHA" | tee day7-commercial-catalog.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('day7-health.json','utf8')),d6=JSON.parse(fs.readFileSync('day7-day6-readiness.json','utf8')),d7=JSON.parse(fs.readFileSync('day7-readiness.json','utf8')),cat=JSON.parse(fs.readFileSync('day7-commercial-catalog.json','utf8'));
          if(h?.success!==true||h?.data?.commit_sha!==process.env.GITHUB_SHA) throw new Error('Exact deployed SHA mismatch.');
          if(d6?.success!==true||d6?.data?.ready!==true) throw new Error('Day6 readiness failed.');
          if(d7?.success!==true||d7?.data?.ready!==true) throw new Error('Day7 readiness failed.');
          if(cat?.success!==true||cat?.data?.commercial_schema!=='D7A3'||cat?.data?.payment_authority!=='stripe'||cat?.data?.fulfillment_authority!=='systeme'||!cat?.data?.catalog?.founder_readiness_sprint) throw new Error('D7A3 commercial catalog failed.');
          NODE
          node scripts/day6-deployed-e2e.mjs | tee day7-day6-deployed-e2e.json
          node scripts/day7-deployed-release-e2e.mjs | tee day7-release-deployed-e2e.json

      - name: Deploy cumulative existing QA frontend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.qa-frontend.jsonc
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS "$QA_FRONTEND_URL/health?day7=$GITHUB_SHA-$attempt" -o day7-frontend-health.json || true
            curl -fsS "$QA_FRONTEND_URL/?day7=$GITHUB_SHA-$attempt" -o day7-runtime.html || true
            if grep -Fq '"environment":"qa"' day7-frontend-health.json 2>/dev/null && grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' day7-runtime.html 2>/dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1

      - name: Archive Day 7 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvistudio-galvicare-day7-qa-${{ github.sha }}
          if-no-files-found: warn
          path: |
            day7-*.txt
            day7-*.json
            day7-runtime.html

      - name: Day 7 QA release summary
        if: always()
        shell: bash
        run: |
          echo '## GalviStudio 1.0 | GalviCare 1.0 Day 7 QA' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact existing QA candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- New branch created: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Work ref pushed: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical QA D1 reused: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- D7A1/D7A2 preserved; D7A3 Stripe/Systeme split is additive: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stripe is payment authority; Systeme.io is treatment-delivery/completion authority: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- FounderShot AI is proposal-only; Business Physician governs lifecycle transition: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production/main modified: NO' >> "$GITHUB_STEP_SUMMARY"
