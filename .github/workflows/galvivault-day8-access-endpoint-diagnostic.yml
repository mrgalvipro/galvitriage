name: GalviVault Day 8 Access Endpoint Diagnostic

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths: ['.github/workflows/galvivault-day8-access-endpoint-diagnostic.yml']

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Probe only the Access endpoints used by Day 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/day8
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          verify_code="$(curl -sS -o /tmp/verify.json -w '%{http_code}' "${auth[@]}" "$api/tokens/verify" || true)"
          org_code="$(curl -sS -o /tmp/org.json -w '%{http_code}' "${auth[@]}" "$api/access/organizations" || true)"
          apps_code="$(curl -sS -o /tmp/apps.json -w '%{http_code}' "${auth[@]}" "$api/access/apps?per_page=100" || true)"
          verify_errors="$(jq -c '[.errors[]? | {code,message}]' /tmp/verify.json 2>/dev/null || echo '[]')"
          org_errors="$(jq -c '[.errors[]? | {code,message}]' /tmp/org.json 2>/dev/null || echo '[]')"
          apps_errors="$(jq -c '[.errors[]? | {code,message}]' /tmp/apps.json 2>/dev/null || echo '[]')"
          org_success="$(jq -r '.success // false' /tmp/org.json 2>/dev/null || echo false)"
          apps_success="$(jq -r '.success // false' /tmp/apps.json 2>/dev/null || echo false)"
          jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg verify_http "$verify_code" \
            --arg org_http "$org_code" \
            --arg apps_http "$apps_code" \
            --arg org_success "$org_success" \
            --arg apps_success "$apps_success" \
            --argjson verify_errors "$verify_errors" \
            --argjson org_errors "$org_errors" \
            --argjson apps_errors "$apps_errors" \
            '{source_sha:$sha,token_verify_http:$verify_http,organization_http:$org_http,organization_success:($org_success=="true"),applications_list_http:$apps_http,applications_list_success:($apps_success=="true"),token_verify_errors:$verify_errors,organization_errors:$org_errors,applications_list_errors:$apps_errors}' \
            > release-evidence/day8/access-endpoint-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-evidence/day8/access-endpoint-diagnostic.json
          git commit -m "Day 8 QA: record exact Access endpoint diagnostic ${GITHUB_SHA} [skip ci]" || exit 0
          git push origin HEAD:qa-revamped-galvicare-0-5
