name: Critical Path Stripe Navigation Fix

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - .github/workflows/critical-path-stripe-nav-fix.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Apply only the two approved Stripe navigation changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "window.location.href=stripeCheckoutUrl(GALVISCORE_STRIPE_PAYMENT_LINK,sessionId);",
                  "window.top.location.href=stripeCheckoutUrl(GALVISCORE_STRIPE_PAYMENT_LINK,sessionId);",
              ),
              (
                  "window.location.href=stripeCheckoutUrl(GSHOT.PAYMENT_LINK,sessionId());",
                  "window.top.location.href=stripeCheckoutUrl(GSHOT.PAYMENT_LINK,sessionId());",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"ABORT: expected exactly one occurrence of {old!r}; found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify no other tracked file changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "index.html" || { echo "ABORT: unexpected changed files: $changed"; exit 1; }
          git diff --check
          git diff -- index.html

      - name: Commit directly to existing QA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Stripe checkout top-level navigation on QA"
          git push origin HEAD:qa-revamped-galvicare-0-5
