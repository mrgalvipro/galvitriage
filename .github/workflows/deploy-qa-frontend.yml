name: Deploy GalviCare QA Browser E2E

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - index.html
      - qa-frontend-worker.js
      - wrangler.qa-frontend.jsonc
      - scripts/day7b-build-qa-frontend.mjs
      - .github/workflows/deploy-qa-frontend.yml

permissions:
  contents: read

concurrency:
  group: galvicare-qa-browser-e2e
  cancel-in-progress: false

jobs:
  deploy-qa-browser:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate isolated QA frontend
        run: node scripts/day7b-build-qa-frontend.mjs

      - name: QA isolation gate
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-qa/index.html
          grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' dist-qa/index.html
          grep -Fq 'https://galvicare-triage-intake.mrgalvipro.workers.dev' dist-qa/index.html
          grep -Fq 'https://galvicare-0-5-qa.mrgalvipro.workers.dev/#galvitriage' dist-qa/index.html
          grep -Fq 'https://buy.stripe.com/test_' dist-qa/index.html
          ! grep -Fq 'https://galvicare-0-5-production.mrgalvipro.workers.dev' dist-qa/index.html
          ! grep -Fq 'https://buy.stripe.com/14A00kbivcypgoGfBY53000' dist-qa/index.html
          ! grep -Fq 'https://buy.stripe.com/bJe7sM5Ze9jdc8qgG253001' dist-qa/index.html
          ! grep -Fq 'https://buy.stripe.com/00w14odrG1QLdcu9dA53002' dist-qa/index.html
          ! grep -Fq 'https://buy.stripe.com/eVq3cw3R63YT6O6ahE53003' dist-qa/index.html

      - name: Deploy dedicated QA frontend Worker
        run: npx --yes wrangler@4 deploy --config wrangler.qa-frontend.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify QA frontend runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://galvicare-0-5-qa.mrgalvipro.workers.dev'
          for attempt in 1 2 3 4 5; do
            curl -fsS "$BASE/health" -o qa-health.json && break
            sleep 3
          done
          grep -Fq '"environment":"qa"' qa-health.json
          grep -Fq '"stripe_mode":"test"' qa-health.json
          curl -fsS "$BASE/" -o qa-runtime.html
          grep -Fq 'GALVICARE QA / TEST ENVIRONMENT' qa-runtime.html
          grep -Fq 'https://galvicare-triage-intake.mrgalvipro.workers.dev' qa-runtime.html
          grep -Fq 'https://buy.stripe.com/test_' qa-runtime.html
          ! grep -Fq 'https://galvicare-0-5-production.mrgalvipro.workers.dev' qa-runtime.html

      - name: Verify QA backend health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://galvicare-triage-intake.mrgalvipro.workers.dev/health' -o qa-api-health.json
          cat qa-api-health.json

      - name: QA browser E2E readiness summary
        run: |
          echo '## GalviCare 0.5 QA Browser E2E' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR HUMAN QA E2E**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser: https://galvicare-0-5-qa.mrgalvipro.workers.dev/#galvitriage' >> "$GITHUB_STEP_SUMMARY"
          echo '- API: https://galvicare-triage-intake.mrgalvipro.workers.dev/api' >> "$GITHUB_STEP_SUMMARY"
          echo '- Database: QA D1 binding owned by galvicare-triage-intake' >> "$GITHUB_STEP_SUMMARY"
          echo '- Payments: Stripe TEST only' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production analytics: disabled in QA artifact' >> "$GITHUB_STEP_SUMMARY"
