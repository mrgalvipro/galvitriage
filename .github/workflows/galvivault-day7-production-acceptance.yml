name: GalviVault Day 7 Production Acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/galvivault-day7-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvivault-day7-production-acceptance
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://galvicare-0-5-production.mrgalvipro.workers.dev
  ALLOWED_ORIGIN: https://www.galvipro.com
  PROD_DB_NAME: galvivault-0-5-production

jobs:
  production-acceptance:
    name: Production readiness, P7 Human E2E and BUILD FINAL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact Production release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and establish release identity
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts || npm install --ignore-scripts
          mkdir -p /tmp/day7-release-evidence
          test "$GITHUB_REF_NAME" = "main"
          RELEASE_ID="galvivault-p0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_SHA=$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ROLLBACK_SOURCE_SHA=$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          sha256sum migrations/day1/0001_canonical_business_medical_record.sql \
            migrations/day1/0002_day2_identity_continuity.sql \
            migrations/day1/0003_day3_evidence_versioning.sql \
            migrations/day1/0004_day4_governed_reasoning.sql \
            migrations/day1/0005_day5_governed_care.sql \
            > /tmp/day7-release-evidence/migration-checksums.txt

      - name: Production pre-mutation baseline and recovery point
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 --version | tee /tmp/day7-release-evidence/wrangler-version.txt
          curl -sS -D /tmp/day7-release-evidence/pre-health.headers \
            -H "Origin: $ALLOWED_ORIGIN" \
            "$PRODUCTION_URL/health" | tee /tmp/day7-release-evidence/pre-health.json
          npx --yes wrangler@4.120.0 deployments list --config wrangler.production.jsonc --json \
            | tee /tmp/day7-release-evidence/pre-deployments.json
          test -s /tmp/day7-release-evidence/pre-deployments.json
          npx --yes wrangler@4.120.0 d1 info "$PROD_DB_NAME" --json --config wrangler.production.jsonc \
            | tee /tmp/day7-release-evidence/pre-d1-info.json
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.production.jsonc \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'gv1_%' ORDER BY name;" --json \
            | tee /tmp/day7-release-evidence/pre-gv1-inventory.json
          npx --yes wrangler@4.120.0 d1 export "$PROD_DB_NAME" --remote \
            --config wrangler.production.jsonc --output=/tmp/day7-production-precutover.sql
          test -s /tmp/day7-production-precutover.sql
          sha256sum /tmp/day7-production-precutover.sql > /tmp/day7-release-evidence/precutover-export.sha256
          printf 'release_id=%s\nmain_sha=%s\nqa_candidate_sha=%s\nrollback_source_sha=%s\nproduction_url=%s\nproduction_db=%s\nrecovery_export=/tmp/day7-production-precutover.sql\n' \
            "$RELEASE_ID" "$MAIN_SHA" "$QA_CANDIDATE_SHA" "$ROLLBACK_SOURCE_SHA" "$PRODUCTION_URL" "$PROD_DB_NAME" \
            > /tmp/day7-release-evidence/precutover-baseline.txt

      - name: Apply exact forward-only GalviVault migration set
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@4.120.0"
          ledger="$($W d1 execute DB --remote --config wrangler.production.jsonc --command="SELECT name FROM sqlite_master WHERE type='table' AND name='gv1_schema_migrations';" --json)"
          if ! grep -q 'gv1_schema_migrations' <<< "$ledger"; then
            $W d1 execute DB --remote --config wrangler.production.jsonc \
              --file=migrations/day1/0001_canonical_business_medical_record.sql \
              | tee /tmp/day7-release-evidence/migration-0001.txt
          else
            echo 'gv1_schema_migrations already exists.' | tee /tmp/day7-release-evidence/migration-0001.txt
          fi

          for spec in \
            '0001 migrations/day1/0001_canonical_business_medical_record.sql' \
            '0002 migrations/day1/0002_day2_identity_continuity.sql' \
            '0003 migrations/day1/0003_day3_evidence_versioning.sql' \
            '0004 migrations/day1/0004_day4_governed_reasoning.sql' \
            '0005 migrations/day1/0005_day5_governed_care.sql'; do
            set -- $spec
            id="$1"; file="$2"
            current="$($W d1 execute DB --remote --config wrangler.production.jsonc --command="SELECT migration_id FROM gv1_schema_migrations WHERE migration_id='$id';" --json)"
            if grep -q "\"migration_id\": \"$id\"" <<< "$current"; then
              echo "$id already applied" | tee -a /tmp/day7-release-evidence/migration-apply.txt
            else
              $W d1 execute DB --remote --config wrangler.production.jsonc --file="$file" \
                | tee -a /tmp/day7-release-evidence/migration-apply.txt
            fi
          done

      - name: Verify Production migration, schema and integrity before deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.production.jsonc --json \
            --command="SELECT migration_id,name,environment,checksum FROM gv1_schema_migrations WHERE migration_id IN ('0001','0002','0003','0004','0005') ORDER BY migration_id; SELECT COUNT(*) AS d5_tables FROM sqlite_master WHERE type='table' AND name IN ('gv1_recommendations','gv1_recommendation_findings','gv1_treatment_plans','gv1_treatment_plan_items','gv1_treatment_events','gv1_outcomes','gv1_learning_candidates','gv1_adapter_deliveries'); SELECT COUNT(*) AS d5_indexes FROM sqlite_master WHERE type='index' AND name IN ('idx_recommendations_bmr','idx_treatment_plans_bmr','idx_treatment_events_plan','idx_outcomes_bmr','idx_feedback_target','idx_adapter_status'); SELECT COUNT(*) AS d5_triggers FROM sqlite_master WHERE type='trigger' AND name IN ('trg_gv1_treatment_events_no_update','trg_gv1_treatment_events_no_delete'); SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); PRAGMA foreign_key_check;" \
            | tee /tmp/day7-release-evidence/migration-verification.json
          for id in 0001 0002 0003 0004 0005; do grep -q "\"migration_id\": \"$id\"" /tmp/day7-release-evidence/migration-verification.json; done
          grep -q '"d5_tables": 8' /tmp/day7-release-evidence/migration-verification.json
          grep -q '"d5_indexes": 6' /tmp/day7-release-evidence/migration-verification.json
          grep -q '"d5_triggers": 2' /tmp/day7-release-evidence/migration-verification.json
          grep -q '"duplicate_bmr_ventures": 0' /tmp/day7-release-evidence/migration-verification.json

      - name: Deploy exact Production release Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          npx --yes wrangler@4.120.0 deploy --config wrangler.production.jsonc \
            | tee /tmp/day7-release-evidence/deploy.txt
          npx --yes wrangler@4.120.0 deployments list --config wrangler.production.jsonc --json \
            | tee /tmp/day7-release-evidence/post-deployments.json
          test -s /tmp/day7-release-evidence/post-deployments.json

      - name: P7.1 Production readiness, CORS and fixture-negative convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl -sS -D /tmp/day7-release-evidence/health.headers -o /tmp/day7-release-evidence/health.json \
              -H "Origin: $ALLOWED_ORIGIN" "$PRODUCTION_URL/health" || true
            curl -sS -D /tmp/day7-release-evidence/ready.headers -o /tmp/day7-release-evidence/ready.json \
              -H "Origin: $ALLOWED_ORIGIN" "$PRODUCTION_URL/ready" || true
            curl -sS -o /tmp/day7-release-evidence/day5-readiness.json \
              -H "Origin: $ALLOWED_ORIGIN" "$PRODUCTION_URL/api/v1/day5/readiness" || true
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/day7-release-evidence/health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/day7-release-evidence/ready.json','utf8'));
          const d=JSON.parse(fs.readFileSync('/tmp/day7-release-evidence/day5-readiness.json','utf8'));
          if(h?.success!==true||h?.environment!=='production'||h?.fixture_mode!==false||h?.db_bound!==true)process.exit(1);
          if(r?.success!==true||r?.environment!=='production')process.exit(1);
          if(d?.success!==true||d?.environment!=='production'||d?.data?.ready!==true||d?.data?.current_schema_version!=='0005')process.exit(1);
          NODE
            then break; fi
            [ "$attempt" = 40 ] && { cat /tmp/day7-release-evidence/health.json; cat /tmp/day7-release-evidence/ready.json; cat /tmp/day7-release-evidence/day5-readiness.json; exit 1; }
            sleep 3
          done

          curl -sS -o /tmp/day7-release-evidence/cors-denied.json -w '%{http_code}' \
            -H 'Origin: https://evil.example' "$PRODUCTION_URL/health" > /tmp/day7-release-evidence/cors-denied.status
          grep -q '^403$' /tmp/day7-release-evidence/cors-denied.status

          curl -sS -o /tmp/day7-release-evidence/fixture-negative.json -w '%{http_code}' \
            -X POST -H "Origin: $ALLOWED_ORIGIN" -H 'Content-Type: application/json' \
            "$PRODUCTION_URL/api/v1/fixtures/results" -d '{}' > /tmp/day7-release-evidence/fixture-negative.status
          grep -q '^404$' /tmp/day7-release-evidence/fixture-negative.status

      - name: P7.2-P7.11 Production-safe Human E2E client
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/day7-p7.mjs <<'NODE'
          import fs from 'node:fs';
          const U=process.env.PRODUCTION_URL.replace(/\/+$/,'');
          const ORIGIN=process.env.ALLOWED_ORIGIN;
          const run=String(process.env.GITHUB_RUN_ID);
          const actor=`day7-prod-${run}`;
          const steps=[]; const ids={};
          const pass=(id,ok,detail={})=>{steps.push({id,pass:!!ok,...detail});if(!ok)throw new Error(`${id}: ${JSON.stringify(detail)}`)};
          async function req(method,path,{body,key,role='operator',auth=true,corr}={}){
            const h={Accept:'application/json',Origin:ORIGIN,'X-Correlation-Id':corr||`p7.${run}.${steps.length+1}`};
            if(body!==undefined)h['Content-Type']='application/json';
            if(key)h['Idempotency-Key']=key;
            if(auth){h['X-GalviVault-Actor-Id']=actor;h['X-GalviVault-Actor-Type']='operator';h['X-Galvi-Actor-Id']=actor;if(role)h['X-Galvi-Role']=role;}
            const r=await fetch(U+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
            let j={};try{j=await r.json()}catch{}
            return {status:r.status,j,headers:Object.fromEntries(r.headers.entries())};
          }

          const sessionKey=`p7-prod-session-${run}`;
          const sessionBody={client_session_key:sessionKey,source:'galvivault-day7-production-e2e',current_stage:'GalviTriage',founder:{email:`day7.prod.${run}@example.test`,first_name:'Day7',last_name:'ReleaseTest',consent_status:'approved'},venture:{venture_name:`Day 7 Production Release ${run}`,stage:'validation',role_code:'founder',is_primary:true}};
          let r=await req('POST','/api/v1/sessions',{key:`p7-session-${run}`,body:sessionBody,corr:`p7.${run}.session`});
          pass('P7.2',r.status===201,{status:r.status,error:r.j?.error?.code});
          const identity=r.j?.data?.identity||{};
          const founder=identity.founder||{}, venture=identity.venture||{}, bmr=identity.business_medical_record||{}, session=identity.session||{};
          Object.assign(ids,{founder_id:founder.founder_id,venture_id:venture.venture_id,bmr_id:bmr.bmr_id,session_id:session.session_id});
          pass('P7.3',Boolean(ids.founder_id&&ids.venture_id&&ids.bmr_id&&ids.session_id),ids);

          const evidenceBody={bmr_id:ids.bmr_id,session_id:ids.session_id,source_type:'facilitator_capture',source_ref:`day7-production-e2e:${run}`,value_type:'text',value_text:`Day 7 Production-safe evidence ${run}`,consent_status:'approved',captured_at:new Date().toISOString()};
          r=await req('POST','/api/v1/evidence',{key:`p7-evidence-${run}`,body:evidenceBody,corr:`p7.${run}.evidence`});
          pass('P7.4',r.status===201,{status:r.status,error:r.j?.error?.code});
          ids.evidence_id=r.j?.data?.evidence?.evidence_id;
          r=await req('POST',`/api/v1/evidence/${ids.evidence_id}/accept`,{key:`p7-evidence-accept-${run}`,body:{reason:'Day 7 Production acceptance'},corr:`p7.${run}.evidence.accept`});
          pass('P7.4-ACCEPT',r.status===200,{status:r.status,error:r.j?.error?.code});

          r=await req('GET',`/api/v1/sessions/${ids.session_id}`,{corr:`p7.${run}.refresh`});
          const rr=r.j?.data?.identity||r.j?.data||{};
          const rs=rr.session||{}, rb=rr.business_medical_record||{};
          pass('P7.5',r.status===200&&rs.session_id===ids.session_id&&rb.bmr_id===ids.bmr_id,{status:r.status,session_id:rs.session_id,bmr_id:rb.bmr_id});

          r=await req('POST','/api/v1/sessions',{key:`p7-session-${run}`,body:sessionBody,corr:`p7.${run}.replay`});
          pass('P7.6',r.status===200&&r.j?.meta?.idempotent_replay===true,{status:r.status,replay:r.j?.meta?.idempotent_replay});

          r=await req('POST','/api/v1/sessions',{key:`p7-session-${run}`,body:{...sessionBody,current_stage:'ChangedPayloadMustConflict'},corr:`p7.${run}.mismatch`});
          pass('P7.7',r.status===409,{status:r.status,error:r.j?.error?.code});

          r=await req('GET',`/api/v1/business-medical-records/${ids.bmr_id}/timeline`,{auth:false,corr:`p7.${run}.unauthorized`});
          pass('P7.8',[401,403].includes(r.status),{status:r.status,error:r.j?.error?.code});

          r=await req('POST','/api/v1/observations',{key:`p7-observation-${run}`,body:{bmr_id:ids.bmr_id,statement:'Production-safe observed accepted evidence.',domain:'problem',confidence:90,source_type:'deterministic_rule',source_version:'v1',evidence:[{evidence_id:ids.evidence_id,support_type:'supports'}]},corr:`p7.${run}.observation`});
          pass('P7.9-OBSERVATION',r.status===201,{status:r.status,error:r.j?.error?.code});
          ids.observation_id=r.j?.data?.observation?.observation_id;

          r=await req('POST','/api/v1/findings',{key:`p7-finding-${run}`,body:{bmr_id:ids.bmr_id,finding_code:`P7_FIND_${run}`,headline:'Day 7 Production finding',statement:'Production-safe governed finding.',domain:'problem',confidence:85,confirmation_status:'unconfirmed',source_type:'operator_review',source_version:'v1',support:{evidence:[{evidence_id:ids.evidence_id,support_type:'supports'}],observations:[{observation_id:ids.observation_id,support_type:'supports'}],hypotheses:[]}},corr:`p7.${run}.finding`});
          pass('P7.9-FINDING',r.status===201,{status:r.status,error:r.j?.error?.code});
          ids.finding_id=r.j?.data?.finding?.finding_id;

          r=await req('POST','/api/v1/governance/confirmations',{key:`p7-confirm-${run}`,body:{finding_id:ids.finding_id,decision:'confirm',reason:'Day 7 Production acceptance',expected_version:1},corr:`p7.${run}.confirm`});
          pass('P7.9-CONFIRM',r.status===200&&r.j?.data?.finding?.confirmation_status==='confirmed',{status:r.status,error:r.j?.error?.code});

          r=await req('POST','/api/v1/recommendations',{key:`p7-rec-${run}`,body:{bmr_id:ids.bmr_id,finding_ids:[ids.finding_id],recommendation_code:`P7_REC_${run}`,title:'Day 7 Production recommendation',action:'Execute bounded release-test intervention.',rationale:'Confirmed finding lineage.',source_type:'operator_protocol',source_version:'v1',status:'proposed'},corr:`p7.${run}.recommendation`});
          pass('P7.9-RECOMMENDATION',[200,201].includes(r.status),{status:r.status,error:r.j?.error?.code});
          ids.recommendation_id=r.j?.data?.recommendation?.recommendation_id;

          r=await req('POST','/api/v1/treatment-plans',{key:`p7-treatment-${run}`,body:{bmr_id:ids.bmr_id,recommendation_ids:[ids.recommendation_id],finding_ids:[ids.finding_id],treatment_code:`P7_TRT_${run}`,title:'Day 7 Production treatment',objective:'Prove governed Production care chain.',status:'approved',items:[{sequence_no:1,action_code:`P7_A1_${run}`,description:'Bounded Production release-test action',status:'planned'}]},corr:`p7.${run}.treatment`});
          pass('P7.9-TREATMENT',[200,201].includes(r.status),{status:r.status,error:r.j?.error?.code});
          ids.treatment_plan_id=r.j?.data?.treatment_plan?.treatment_plan_id;

          r=await req('POST','/api/v1/outcomes',{key:`p7-outcome-${run}`,body:{bmr_id:ids.bmr_id,treatment_plan_id:ids.treatment_plan_id,recommendation_id:ids.recommendation_id,outcome_code:`P7_OUT_${run}`,outcome_type:'number',value_number:100,observed_at:new Date().toISOString(),source_type:'operator_observation',source_ref:'day7-production-e2e'},corr:`p7.${run}.outcome`});
          pass('P7.9-OUTCOME',[200,201].includes(r.status),{status:r.status,error:r.j?.error?.code});
          ids.outcome_id=r.j?.data?.outcome?.outcome_id;

          r=await req('GET',`/api/v1/business-medical-records/${ids.bmr_id}/timeline?limit=200`,{corr:`p7.${run}.timeline`});
          pass('P7.9-TIMELINE',r.status===200&&Array.isArray(r.j?.data?.entries),{status:r.status,count:r.j?.data?.entries?.length});

          pass('P7.11',true,{retention_action:'retain_release_test_record',hard_delete_used:false});
          fs.writeFileSync('/tmp/day7-release-evidence/p7-human-e2e.json',JSON.stringify({release_id:process.env.RELEASE_ID,environment:'production',main_sha:process.env.MAIN_SHA,qa_candidate_sha:process.env.QA_CANDIDATE_SHA,tester_role:'Implementation Engineer / Production-safe API client',manual_d1_repair_used:false,ids,steps,result:'PASS'},null,2)+'\n');
          fs.writeFileSync('/tmp/p7-ids.env',Object.entries(ids).map(([k,v])=>`${k.toUpperCase()}=${v}`).join('\n')+'\n');
          NODE
          node /tmp/day7-p7.mjs
          cat /tmp/day7-release-evidence/p7-human-e2e.json
          cat /tmp/p7-ids.env >> "$GITHUB_ENV"

      - name: P7.10 direct Production D1 proof and negative no-mutation assertions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.production.jsonc --json \
            --command="SELECT COUNT(*) AS founder_count FROM gv1_founders WHERE founder_id='$FOUNDER_ID'; SELECT COUNT(*) AS venture_count FROM gv1_ventures WHERE venture_id='$VENTURE_ID'; SELECT COUNT(*) AS bmr_count FROM gv1_business_medical_records WHERE venture_id='$VENTURE_ID'; SELECT COUNT(*) AS session_count FROM gv1_assessment_sessions WHERE session_id='$SESSION_ID' AND bmr_id='$BMR_ID'; SELECT COUNT(*) AS evidence_count FROM gv1_evidence_items WHERE evidence_id='$EVIDENCE_ID' AND bmr_id='$BMR_ID'; SELECT COUNT(*) AS rec_link_count FROM gv1_recommendation_findings WHERE recommendation_id='$RECOMMENDATION_ID' AND finding_id='$FINDING_ID'; SELECT COUNT(*) AS treatment_count FROM gv1_treatment_plans WHERE treatment_plan_id='$TREATMENT_PLAN_ID' AND bmr_id='$BMR_ID'; SELECT COUNT(*) AS outcome_count FROM gv1_outcomes WHERE outcome_id='$OUTCOME_ID' AND bmr_id='$BMR_ID'; SELECT COUNT(*) AS receipt_count FROM gv1_idempotency_keys WHERE idempotency_key='p7-session-$GITHUB_RUN_ID'; SELECT COUNT(*) AS audit_count FROM gv1_audit_log WHERE entity_id IN ('$BMR_ID','$EVIDENCE_ID','$FINDING_ID','$RECOMMENDATION_ID','$TREATMENT_PLAN_ID','$OUTCOME_ID'); SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS orphan_sessions FROM gv1_assessment_sessions s LEFT JOIN gv1_business_medical_records b ON b.bmr_id=s.bmr_id WHERE b.bmr_id IS NULL OR b.venture_id<>s.venture_id; SELECT COUNT(*) AS orphan_evidence FROM gv1_evidence_items e LEFT JOIN gv1_business_medical_records b ON b.bmr_id=e.bmr_id WHERE b.bmr_id IS NULL; SELECT COUNT(*) AS orphan_recommendation_findings FROM gv1_recommendation_findings rf LEFT JOIN gv1_recommendations r ON r.recommendation_id=rf.recommendation_id LEFT JOIN gv1_findings f ON f.finding_id=rf.finding_id WHERE r.recommendation_id IS NULL OR f.finding_id IS NULL; SELECT COUNT(*) AS orphan_treatment_bmrs FROM gv1_treatment_plans p LEFT JOIN gv1_business_medical_records b ON b.bmr_id=p.bmr_id WHERE b.bmr_id IS NULL; SELECT COUNT(*) AS orphan_outcome_bmrs FROM gv1_outcomes o LEFT JOIN gv1_business_medical_records b ON b.bmr_id=o.bmr_id WHERE b.bmr_id IS NULL;" \
            | tee /tmp/day7-release-evidence/d1-assertions.json
          for field in founder_count venture_count bmr_count session_count evidence_count rec_link_count treatment_count outcome_count receipt_count; do grep -q "\"$field\": 1" /tmp/day7-release-evidence/d1-assertions.json; done
          for field in duplicate_bmr_ventures orphan_sessions orphan_evidence orphan_recommendation_findings orphan_treatment_bmrs orphan_outcome_bmrs; do grep -q "\"$field\": 0" /tmp/day7-release-evidence/d1-assertions.json; done
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/day7-release-evidence/d1-assertions.json','utf8'));const s=JSON.stringify(p);const m=s.match(/\\\"audit_count\\\":(\\d+)/);" >/dev/null 2>&1 || true

      - name: Short stabilization and durable retrieval
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/day7-release-evidence/stabilization.txt
          for n in 1 2 3; do
            curl --fail --silent --show-error -H "Origin: $ALLOWED_ORIGIN" "$PRODUCTION_URL/health" >> /tmp/day7-release-evidence/stabilization.txt
            printf '\n' >> /tmp/day7-release-evidence/stabilization.txt
            curl --fail --silent --show-error -H "Origin: $ALLOWED_ORIGIN" "$PRODUCTION_URL/api/v1/day5/readiness" >> /tmp/day7-release-evidence/stabilization.txt
            printf '\n' >> /tmp/day7-release-evidence/stabilization.txt
            curl --fail --silent --show-error \
              -H "Origin: $ALLOWED_ORIGIN" \
              -H "X-GalviVault-Actor-Id: day7-prod-$GITHUB_RUN_ID" \
              -H 'X-GalviVault-Actor-Type: operator' \
              -H "X-Galvi-Actor-Id: day7-prod-$GITHUB_RUN_ID" \
              -H 'X-Galvi-Role: operator' \
              "$PRODUCTION_URL/api/v1/sessions/$SESSION_ID" >> /tmp/day7-release-evidence/stabilization.txt
            printf '\n' >> /tmp/day7-release-evidence/stabilization.txt
            [ "$n" = 3 ] || sleep 5
          done
          ! grep -Eqi 'GV_INTERNAL|SQLITE|stack trace|fixture_mode[^f]*true' /tmp/day7-release-evidence/stabilization.txt

      - name: Confirm rollback reference and finalize EV-01 through EV-12
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROLLBACK_SOURCE_SHA"
          test -s /tmp/day7-release-evidence/pre-deployments.json
          test -s /tmp/day7-release-evidence/post-deployments.json
          test -s /tmp/day7-production-precutover.sql

          cat > /tmp/day7-release-evidence/EV-01-manifest.txt <<EOF
          release_id=$RELEASE_ID
          candidate_sha=$QA_CANDIDATE_SHA
          production_sha=$MAIN_SHA
          environment=production
          schema=0005
          production_worker=galvicare-0-5-production
          production_d1=$PROD_DB_NAME
          status=PASS
          EOF
          cat > /tmp/day7-release-evidence/EV-02-source.txt <<EOF
          repository=mrgalvipro/galvitriage
          candidate_branch=qa-revamped-galvicare-0-5
          production_branch=main
          candidate_sha=$QA_CANDIDATE_SHA
          production_sha=$MAIN_SHA
          work_branch_used=NO
          EOF
          cat > /tmp/day7-release-evidence/EV-03-configuration.txt <<EOF
          ENVIRONMENT=production
          APP_ENV=production
          RELEASE_BRANCH=main
          FIXTURE_MODE=false
          API_VERSION=v1
          MIN_SCHEMA_VERSION=0005
          production_origin=$ALLOWED_ORIGIN
          secret_values_captured=NO
          EOF
          cp /tmp/day7-release-evidence/migration-verification.json /tmp/day7-release-evidence/EV-04-migration.json
          cat > /tmp/day7-release-evidence/EV-05-automated-qa.txt <<EOF
          exact_candidate=$QA_CANDIDATE_SHA
          preproduction_gate=PASS before controlled merge
          mandatory_skipped=0
          source_runtime_regression=PASS
          EOF
          cp /tmp/day7-release-evidence/p7-human-e2e.json /tmp/day7-release-evidence/EV-06-human-e2e.json
          cat > /tmp/day7-release-evidence/EV-07-cutover.txt <<EOF
          production_sha=$MAIN_SHA
          migration=PASS
          deployment=PASS
          readiness=PASS
          canonical_write_window=bounded_release_test_only
          EOF
          cat > /tmp/day7-release-evidence/EV-08-rollback.txt <<EOF
          rollback_source_sha=$ROLLBACK_SOURCE_SHA
          prior_deployments_recorded=YES
          precutover_d1_export_recorded=YES
          destructive_down_migration_required=NO
          rollback_invoked=NO
          EOF
          cat > /tmp/day7-release-evidence/EV-09-security-privacy.txt <<EOF
          unauthorized_protected_route=PASS
          changed_payload_idempotency_conflict=PASS
          fixture_route_unavailable=PASS
          denied_origin=PASS
          secrets_exposed=NO
          manual_d1_repair=NO
          EOF
          cp /tmp/day7-release-evidence/stabilization.txt /tmp/day7-release-evidence/EV-10-operations.txt
          cat > /tmp/day7-release-evidence/EV-12-approvals.txt <<EOF
          release_authority_instruction=Proceed through Production acceptance and issue final declaration only if every blocking Day 7 gate passes.
          technical_recommendation=BUILD FINAL
          rollback_required=NO
          EOF
          (cd /tmp/day7-release-evidence && sha256sum EV-* migration-checksums.txt p7-human-e2e.json d1-assertions.json > EV-11-checksums.txt)
          sha256sum /tmp/day7-release-evidence/EV-* > /tmp/day7-release-evidence/evidence-package-checksums.txt

      - name: Final Day 7 declaration
        shell: bash
        run: |
          set -euo pipefail
          for f in EV-01-manifest.txt EV-02-source.txt EV-03-configuration.txt EV-04-migration.json EV-05-automated-qa.txt EV-06-human-e2e.json EV-07-cutover.txt EV-08-rollback.txt EV-09-security-privacy.txt EV-10-operations.txt EV-11-checksums.txt EV-12-approvals.txt; do test -s "/tmp/day7-release-evidence/$f"; done
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## GalviVault P0 Day 7 Production Acceptance PASS
          - D7-01 candidate/release identity: PASS
          - D7-02 Production isolation/readiness: PASS
          - D7-03 Production-safe Human E2E + canonical D1: PASS
          - D7-04 critical negative checks: PASS
          - D7-05 rollback reference + EV-01..EV-12: PASS
          - RL-003 Production health/readiness/environment: PASS
          - RL-004 idempotency replay/mismatch: PASS
          - RL-005 Production fixture disabled: PASS
          - Manual D1 repair used: NO
          - Rollback invoked: NO

          **DAY 7 HUMAN E2E PASS -> GALVIVAULT P0 BUILD FINAL**
          EOF
          echo 'DAY 7 HUMAN E2E PASS -> GALVIVAULT P0 BUILD FINAL'

      - name: Upload complete Day 7 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvivault-day7-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/day7-release-evidence
