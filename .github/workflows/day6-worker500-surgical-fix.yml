name: Day 6 Worker 500 Surgical Fix

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - .github/workflows/day6-worker500-surgical-fix.yml

permissions:
  contents: write

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Apply only the proven Worker 500 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('worker/worker.js')
          worker = worker_path.read_text()

          old_payment = """  await dbRun(db, `INSERT INTO payments(payment_id,session_id,product,stripe_session_id,stripe_payment_intent_id,amount_cents,currency,payment_status,paid_at,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?) ON CONFLICT(stripe_session_id) DO UPDATE SET session_id=excluded.session_id,product=excluded.product,stripe_payment_intent_id=excluded.stripe_payment_intent_id,amount_cents=excluded.amount_cents,currency=excluded.currency,payment_status=excluded.payment_status,paid_at=COALESCE(payments.paid_at, excluded.paid_at),updated_at=excluded.updated_at`, `payment_${stripeSessionId || sessionId + '_' + product}`, sessionId, product, stripeSessionId, stripeSession.payment_intent || '', Number(stripeSession.amount_total || 0), stripeSession.currency || 'usd', 'paid', ts, ts, ts);"""
          new_payment = """  await dbRun(db, `INSERT INTO payments(payment_id,session_id,product,stripe_session_id,stripe_payment_intent_id,amount_cents,currency,payment_status,paid_at,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?) ON CONFLICT(payment_id) DO UPDATE SET session_id=excluded.session_id,product=excluded.product,stripe_session_id=excluded.stripe_session_id,stripe_payment_intent_id=excluded.stripe_payment_intent_id,amount_cents=excluded.amount_cents,currency=excluded.currency,payment_status=excluded.payment_status,paid_at=COALESCE(payments.paid_at, excluded.paid_at),updated_at=excluded.updated_at`, `payment_${stripeSessionId || sessionId + '_' + product}`, sessionId, product, stripeSessionId, stripeSession.payment_intent || '', Number(stripeSession.amount_total || 0), stripeSession.currency || 'usd', 'paid', ts, ts, ts);"""

          if old_payment not in worker:
              raise SystemExit('Expected payments ON CONFLICT(stripe_session_id) statement not found; refusing broad edit.')
          worker = worker.replace(old_payment, new_payment, 1)

          old_resolver = """async function resolvePaymentReturn(env, payload) {
            const db = requireDb(env);
            const stripeSessionId = String(safe(payload, 'payload.stripe_session_id') || safe(payload, 'stripe_session_id') || '').trim();
            const expectedProduct = paymentProductName(safe(payload, 'payload.expected_product') || safe(payload, 'expected_product'));
            if (!required(stripeSessionId) || !stripeSessionId.startsWith('cs_')) return jsonResponse({ success:false, action:'resolve_payment_return', status:'error', message:'A valid Stripe Checkout Session ID is required.' }, 400, env);
            if (!expectedProduct) return jsonResponse({ success:false, action:'resolve_payment_return', status:'error', message:'A valid expected GalviCare product is required.' }, 400, env);"""
          new_resolver = """async function resolvePaymentReturn(env, payload) {
            const stripeSessionId = String(safe(payload, 'payload.stripe_session_id') || safe(payload, 'stripe_session_id') || '').trim();
            const expectedProduct = paymentProductName(safe(payload, 'payload.expected_product') || safe(payload, 'expected_product'));
            if (!required(stripeSessionId) || !stripeSessionId.startsWith('cs_')) return jsonResponse({ success:false, action:'resolve_payment_return', status:'error', message:'A valid Stripe Checkout Session ID is required.' }, 400, env);
            if (!expectedProduct) return jsonResponse({ success:false, action:'resolve_payment_return', status:'error', message:'A valid expected GalviCare product is required.' }, 400, env);
            const db = requireDb(env);"""

          if old_resolver not in worker:
              raise SystemExit('Expected resolvePaymentReturn guard ordering not found; refusing broad edit.')
          worker = worker.replace(old_resolver, new_resolver, 1)
          worker_path.write_text(worker)

          test_path = Path('tests/payment-return.test.mjs')
          tests = test_path.read_text()
          marker = "test('Day 6 Worker payment persistence uses a schema-valid conflict target and validates Stripe IDs before D1 access'"
          if marker not in tests:
              tests += """

          test('Day 6 Worker payment persistence uses a schema-valid conflict target and validates Stripe IDs before D1 access',async()=>{
            const source=readFileSync(new URL('../worker/worker.js',import.meta.url),'utf8');
            assert.match(source,/INSERT INTO payments[\\s\\S]*ON CONFLICT\\(payment_id\\) DO UPDATE/);
            assert.doesNotMatch(source,/INSERT INTO payments[\\s\\S]{0,800}ON CONFLICT\\(stripe_session_id\\)/);
            for(const invalid of ['', '   ', 'null', 'undefined', 'pi_not_checkout']){
              const r=await worker.fetch(req({action:'resolve_payment_return',payload:{stripe_session_id:invalid,expected_product:'galviscore'}}),{});
              assert.equal(r.status,400,`invalid Stripe session ${JSON.stringify(invalid)} must be rejected before D1 access`);
              const body=await json(r);
              assert.match(body.message,/valid Stripe Checkout Session ID/i);
            }
          });
          """
              test_path.write_text(tests)
          PY

      - name: Validate critical path
        run: npm run check && npm test

      - name: Commit directly to existing QA branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/worker.js tests/payment-return.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix Day 6 Stripe payment persistence 500"
          git push origin HEAD:qa-revamped-galvicare-0-5
