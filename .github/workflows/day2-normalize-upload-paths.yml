name: "GalviVault Day 2 Normalize and Execute"

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - ".github/workflows/day2-normalize-upload-paths.yml"

permissions:
  contents: write

concurrency:
  group: galvivault-day2-normalize-and-execute
  cancel-in-progress: false

env:
  DAY2_ALLOWED_ORIGIN: https://galvipro.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  normalize-build-deploy-prove:
    name: Normalize, build, deploy, and prove Day 2
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout approved QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert branch and uploaded source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "qa-revamped-galvicare-0-5"
          for file in \
            .github/workflows/github_workflows_day2-qa-identity.yml.txt \
            worker/worker_day2.js.txt \
            migrations/day1/migrations_day1_0002_day2_identity_continuity.sql.txt \
            tests/tests_galvivault-day2-identity-continuity.test.mjs.txt \
            scripts/scripts_galvivault-day2-e2e.mjs.txt \
            scripts/scripts_verify-galvivault-day2-files.mjs.txt \
            wrangler.day2.json.txt \
            package.json.txt; do
            test -f "$file" || { echo "Missing uploaded source: $file"; exit 1; }
          done

      - name: Normalize exact executable repository paths
        shell: bash
        run: |
          set -euo pipefail
          cp worker/worker_day2.js.txt worker/day2.js
          cp migrations/day1/migrations_day1_0002_day2_identity_continuity.sql.txt migrations/day1/0002_day2_identity_continuity.sql
          cp tests/tests_galvivault-day2-identity-continuity.test.mjs.txt tests/galvivault-day2-identity-continuity.test.mjs
          cp scripts/scripts_galvivault-day2-e2e.mjs.txt scripts/galvivault-day2-e2e.mjs
          cp scripts/scripts_verify-galvivault-day2-files.mjs.txt scripts/verify-galvivault-day2-files.mjs
          cp wrangler.day2.json.txt wrangler.day2.json
          cp package.json.txt package.json
          cp .github/workflows/github_workflows_day2-qa-identity.yml.txt .github/workflows/day2-qa-identity.yml
          python -c 'from pathlib import Path; p=Path(".github/workflows/day2-qa-identity.yml"); t=p.read_text(encoding="utf-8"); old="on:\n  workflow_dispatch:\n"; new="on:\n  workflow_dispatch:\n  push:\n    branches:\n      - qa-revamped-galvicare-0-5\n    paths:\n      - \\".github/workflows/day2-qa-identity.yml\\"\n      - \\"worker/day2.js\\"\n      - \\"migrations/day1/0002_day2_identity_continuity.sql\\"\n      - \\"tests/galvivault-day2-identity-continuity.test.mjs\\"\n      - \\"scripts/galvivault-day2-e2e.mjs\\"\n      - \\"scripts/verify-galvivault-day2-files.mjs\\"\n      - \\"wrangler.day2.json\\"\n      - \\"package.json\\"\n"; assert old in t; p.write_text(t.replace(old,new,1),encoding="utf-8")'

      - name: Validate normalized files
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day2.js
          node --check tests/galvivault-day2-identity-continuity.test.mjs
          node --check scripts/galvivault-day2-e2e.mjs
          node --check scripts/verify-galvivault-day2-files.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('wrangler.day2.json','utf8'));"
          grep -q '^name: GalviVault Day 2 QA Identity Continuity$' .github/workflows/day2-qa-identity.yml
          grep -q 'qa-revamped-galvicare-0-5' .github/workflows/day2-qa-identity.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Verify Day 2 critical-path files
        run: npm run verify:galvivault:day2

      - name: Run Day 1 regression
        run: npm run test:day1

      - name: Run GalviVault Day 2 blocking suite
        run: npm run test:galvivault:day2

      - name: Prove Production and Day 7D source boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/production-entry.js
          node --check worker/day7d-engine.js
          node --test tests/day7b-environment-isolation.test.mjs

      - name: Commit normalized executable candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/github_workflows_day2-qa-identity.yml.txt \
            worker/worker_day2.js.txt \
            migrations/day1/migrations_day1_0002_day2_identity_continuity.sql.txt \
            tests/tests_galvivault-day2-identity-continuity.test.mjs.txt \
            scripts/scripts_galvivault-day2-e2e.mjs.txt \
            scripts/scripts_verify-galvivault-day2-files.mjs.txt \
            wrangler.day2.json.txt \
            package.json.txt \
            .github/workflows/day2-normalize-upload-paths.yml
          git add \
            .github/workflows/day2-qa-identity.yml \
            worker/day2.js \
            migrations/day1/0002_day2_identity_continuity.sql \
            tests/galvivault-day2-identity-continuity.test.mjs \
            scripts/galvivault-day2-e2e.mjs \
            scripts/verify-galvivault-day2-files.mjs \
            wrangler.day2.json \
            package.json
          git diff --cached --check
          git commit -m "GalviVault Day 2: normalize and finalize executable critical path"
          git push origin HEAD:qa-revamped-galvicare-0-5
          echo "DAY2_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert QA authority and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const day1=JSON.parse(fs.readFileSync('wrangler.json','utf8'));
          const day2=JSON.parse(fs.readFileSync('wrangler.day2.json','utf8'));
          const production=fs.readFileSync('wrangler.production.jsonc','utf8');
          if(day1.main!=='worker/day1.js') throw new Error('Day 1 entry is not preserved.');
          if(day2.name!==day1.name||day2.main!=='worker/day2.js') throw new Error('Day 2 is not extending the isolated GalviVault QA Worker.');
          if(day2.vars?.ENVIRONMENT!=='qa'||day2.vars?.MIN_SCHEMA_VERSION!=='0002') throw new Error('Day 2 QA variables are invalid.');
          const db=day2.d1_databases?.find(item=>item.binding==='DB');
          if(db?.database_name!=='galvivault-0-5-qa'||db?.migrations_dir!=='migrations/day1') throw new Error('Day 2 QA D1 target is invalid.');
          if(!production.includes('worker/production-entry.js')||production.includes('worker/day2.js')) throw new Error('Production entry separation failed.');
          if(production.includes('galvivault-0-5-qa')||production.includes('cdf9042b-ab09-498a-ac66-010b6cce47d4')) throw new Error('Production configuration contains QA D1 authority.');
          console.log('PASS: QA authority and Production isolation are valid.');
          NODE

      - name: Apply additive migrations to isolated QA D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply galvivault-0-5-qa \
            --remote \
            --config wrangler.day2.json

      - name: Verify remote Day 2 schema
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT migration_id,name,environment FROM gv1_schema_migrations WHERE migration_id IN ('0001','0002') ORDER BY migration_id; SELECT COUNT(*) AS day2_unique_indexes FROM sqlite_master WHERE type='index' AND name IN ('ux_gv1_founders_normalized_email','ux_gv1_bmr_one_per_venture','ux_gv1_roles_one_active_primary'); SELECT COUNT(*) AS normalized_email_column FROM pragma_table_info('gv1_founders') WHERE name='normalized_email'; SELECT COUNT(*) AS response_json_column FROM pragma_table_info('gv1_idempotency_keys') WHERE name='response_json';"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.day2.json \
            --json > /tmp/day2-schema.json
          cat /tmp/day2-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/day2-schema.json','utf8'));
          const objects=[];
          const walk=(value)=>{ if(Array.isArray(value)) for(const item of value) walk(item); else if(value&&typeof value==='object'){ objects.push(value); for(const item of Object.values(value)) walk(item); } };
          walk(payload);
          const value=(key)=>objects.find(item=>Object.hasOwn(item,key))?.[key];
          if(!objects.find(item=>item.migration_id==='0001')) throw new Error('Migration 0001 ledger evidence is missing.');
          if(!objects.find(item=>item.migration_id==='0002')) throw new Error('Migration 0002 ledger evidence is missing.');
          if(Number(value('day2_unique_indexes'))!==3) throw new Error('Expected all three Day 2 unique indexes.');
          if(Number(value('normalized_email_column'))!==1) throw new Error('normalized_email column is missing.');
          if(Number(value('response_json_column'))!==1) throw new Error('response_json column is missing.');
          NODE

      - name: Deploy exact Day 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.day2.json 2>&1 | tee /tmp/day2-deploy.log
          DAY2_BASE_URL="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' /tmp/day2-deploy.log | tail -n 1 || true)"
          if [ -z "$DAY2_BASE_URL" ]; then
            cat /tmp/day2-deploy.log
            exit 1
          fi
          echo "DAY2_BASE_URL=$DAY2_BASE_URL" >> "$GITHUB_ENV"

      - name: Wait for Day 2 runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS="$(curl --silent --show-error --location \
              --output /tmp/day2-ready-body \
              --dump-header /tmp/day2-ready-headers \
              --write-out '%{http_code}' \
              -H "Origin: ${DAY2_ALLOWED_ORIGIN}" \
              "${DAY2_BASE_URL}/api/v1/day2/readiness?candidate=${DAY2_CANDIDATE_SHA}&attempt=${attempt}" || true)"
            if [ "$STATUS" = "200" ] && node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day2-ready-body','utf8')); if(p?.success!==true||p?.environment!=='qa'||p?.data?.ready!==true||p?.data?.current_schema_version!=='0002') process.exit(1);"; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/day2-ready-headers || true
          head -c 2000 /tmp/day2-ready-body || true
          exit 1

      - name: Run deployed Day 1 regression smoke
        env:
          DAY1_BASE_URL: ${{ env.DAY2_BASE_URL }}
          DAY1_RUN_SUFFIX: day2-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run qa:smoke

      - name: Run remote E2E H2.1 through H2.9
        env:
          DAY2_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
          DAY2_EVIDENCE_PATH: /tmp/day2-e2e.json
        run: npm run smoke:galvivault:day2:qa

      - name: Verify remote identity integrity
        shell: bash
        run: |
          set -euo pipefail
          RUN_SUFFIX="${{ github.run_id }}-${{ github.run_attempt }}"
          EMAIL="founder.day2.${RUN_SUFFIX}@example.test"
          SQL="SELECT COUNT(*) AS founder_count FROM gv1_founders WHERE normalized_email=lower(trim('${EMAIL}')); SELECT venture_id,COUNT(*) AS bmr_count FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)<>1; SELECT COUNT(*) AS orphan_roles FROM gv1_founder_venture_roles r LEFT JOIN gv1_founders f ON f.founder_id=r.founder_id LEFT JOIN gv1_ventures v ON v.venture_id=r.venture_id WHERE f.founder_id IS NULL OR v.venture_id IS NULL; SELECT COUNT(*) AS mismatched_sessions FROM gv1_assessment_sessions s LEFT JOIN gv1_business_medical_records b ON b.bmr_id=s.bmr_id WHERE b.bmr_id IS NULL OR b.venture_id<>s.venture_id; SELECT COUNT(*) AS duplicate_founder_emails FROM (SELECT normalized_email FROM gv1_founders WHERE normalized_email IS NOT NULL GROUP BY normalized_email HAVING COUNT(*)>1);"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.day2.json \
            --json > /tmp/day2-d1-assertions.json
          cat /tmp/day2-d1-assertions.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/day2-d1-assertions.json','utf8'));
          const objects=[];
          const walk=(value)=>{ if(Array.isArray(value)) for(const item of value) walk(item); else if(value&&typeof value==='object'){ objects.push(value); for(const item of Object.values(value)) walk(item); } };
          walk(payload);
          const value=(key)=>objects.find(item=>Object.hasOwn(item,key))?.[key];
          if(Number(value('founder_count'))!==1) throw new Error(`founder_count must equal 1; found ${value('founder_count')}.`);
          for(const key of ['orphan_roles','mismatched_sessions','duplicate_founder_emails']) if(Number(value(key))!==0) throw new Error(`${key} must equal 0; found ${value(key)}.`);
          if(objects.find(item=>Object.hasOwn(item,'bmr_count'))) throw new Error('A Venture does not have exactly one BMR.');
          NODE

      - name: Capture evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/day2-evidence
          cp /tmp/day2-deploy.log /tmp/day2-evidence/ 2>/dev/null || true
          cp /tmp/day2-schema.json /tmp/day2-evidence/ 2>/dev/null || true
          cp /tmp/day2-e2e.json /tmp/day2-evidence/ 2>/dev/null || true
          cp /tmp/day2-d1-assertions.json /tmp/day2-evidence/ 2>/dev/null || true
          printf '%s\n' \
            "repository=mrgalvipro/galvitriage" \
            "branch=qa-revamped-galvicare-0-5" \
            "candidate_sha=${DAY2_CANDIDATE_SHA:-unavailable}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            "workflow_attempt=${GITHUB_RUN_ATTEMPT}" \
            "qa_worker_url=${DAY2_BASE_URL:-unavailable}" \
            "qa_d1=galvivault-0-5-qa" \
            "schema=0002" > /tmp/day2-evidence/candidate.txt

      - name: Upload Day 2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvivault-day2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish final automated gate summary
        if: success()
        run: |
          echo '## GALVIVAULT DAY 2 AUTOMATED + REMOTE E2E: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: $DAY2_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- QA Worker URL: $DAY2_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '- Migration 0002: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 1 regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 2 blocking suite: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- H2.1-H2.9: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Remote D1 integrity assertions: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production source/config changed: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '**NEXT REQUIRED HUMAN EVIDENCE: download the artifact and perform H2.10 Production regression.**' >> "$GITHUB_STEP_SUMMARY"
