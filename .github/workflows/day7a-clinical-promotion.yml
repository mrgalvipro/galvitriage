name: Day 7A Clinical Promotion
on:
  pull_request:
    branches: [qa-revamped-galvicare-0-5]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 1
          show-progress: false
      - run: cat docs/day7a-promotion/promo-part-01.txt docs/day7a-promotion/promo-part-02.txt docs/day7a-promotion/promo-part-03.txt docs/day7a-promotion/promo-part-03b.txt docs/day7a-promotion/promo-part-04.txt > scripts/promote-day7a-clinical-enhancements.mjs
      - name: Promote
        id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          { node --check scripts/promote-day7a-clinical-enhancements.mjs && node scripts/promote-day7a-clinical-enhancements.mjs; } 2>&1 | tee docs/day7a-promotion/LAST_ERROR.txt
      - name: Persist promotion failure
        if: steps.promote.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/day7a-promotion/LAST_ERROR.txt
          git commit -m "Day 7A: capture promotion failure"
          git push origin HEAD:qa-revamped-galvicare-0-5
          exit 1
      - name: Gate
        if: steps.promote.outcome == 'success'
        run: |
          node --check worker/worker.js
          node --test tests/day7a-clinical-experience.test.mjs
          git diff --check
      - name: Commit
        if: steps.promote.outcome == 'success'
        run: |
          rm -rf docs/day7a-promotion scripts/promote-day7a-clinical-enhancements.mjs .github/workflows/day7a-clinical-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Day 7A: promote validated clinical experience enhancements"
          git push origin HEAD:qa-revamped-galvicare-0-5
