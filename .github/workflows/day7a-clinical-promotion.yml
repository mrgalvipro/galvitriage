name: Day 7A Clinical Promotion

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "scripts/day7a-final-presentation-patch.mjs"

permissions:
  contents: write

concurrency:
  group: galvicare-day7a-clinical-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply approved final Day 7A presentation corrections
        run: node scripts/day7a-final-presentation-patch.mjs index.html

      - name: Run gate and persist exact evidence
        shell: bash
        run: |
          set +e
          npm run stabilization:gate > DAY7A_GATE_EVIDENCE.txt 2>&1
          code=$?
          cat DAY7A_GATE_EVIDENCE.txt
          printf '\nEXIT_CODE=%s\nSOURCE_SHA=%s\n' "$code" "$(git rev-parse HEAD)" >> DAY7A_GATE_EVIDENCE.txt
          if [ "$code" -eq 0 ]; then
            printf 'DAY7A_AUTOMATED_GATE=PASS\nSOURCE_SHA=%s\nTEST_COMMAND=npm run stabilization:gate\n' "$(git rev-parse HEAD)" > DAY7A_AUTOMATED_GATE_PASS.txt
          else
            rm -f DAY7A_AUTOMATED_GATE_PASS.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html DAY7A_GATE_EVIDENCE.txt
          if [ -f DAY7A_AUTOMATED_GATE_PASS.txt ]; then git add DAY7A_AUTOMATED_GATE_PASS.txt; else git add -u DAY7A_AUTOMATED_GATE_PASS.txt 2>/dev/null || true; fi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Day 7A: persist authoritative gate evidence"
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi
          exit "$code"
