name: Day 7A Clinical Promotion

on:
  pull_request:
    branches: [qa-revamped-galvicare-0-5]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 1
          show-progress: false
      - name: Reassemble
        run: cat docs/day7a-promotion/promo-part-{01,02,03,04}.txt > scripts/promote-day7a-clinical-enhancements.mjs
      - name: Promote
        run: |
          node --check scripts/promote-day7a-clinical-enhancements.mjs
          node scripts/promote-day7a-clinical-enhancements.mjs
      - name: Gate
        run: |
          node --check worker/worker.js
          node --test tests/day7a-clinical-experience.test.mjs
          git diff --check
      - name: Commit
        run: |
          rm -rf docs/day7a-promotion scripts/promote-day7a-clinical-enhancements.mjs .github/workflows/day7a-clinical-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Day 7A: promote validated clinical experience enhancements"
          git push origin HEAD:qa-revamped-galvicare-0-5
