name: Day 7C QA Deploy + Runtime Preflight

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - '.github/workflows/day7c-qa-deploy.yml'
      - 'day7c-browser-observability.js'
      - 'migrations/0005_day7c_integration_trace.sql'
      - 'tests/day7c-integration.test.mjs'
      - 'scripts/day7b-build-qa-frontend.mjs'
      - 'wrangler.json'
      - 'wrangler.qa-frontend.jsonc'
      - 'qa-frontend-worker.js'
      - 'worker/worker.js'
      - 'worker/day7c-entry.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-qa-backend-authoritative
  cancel-in-progress: false

env:
  QA_BACKEND_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev

jobs:
  verify-deploy-preflight:
    name: Verify, deploy authoritative QA backend, runtime preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Critical-path source checks
        run: |
          node --check worker/worker.js
          node --check worker/day7c-entry.js
          grep -q '"main": "worker/day7c-entry.js"' wrangler.json
          grep -q '"ENVIRONMENT": "qa"' wrangler.json
          grep -q '"HUBSPOT_ENABLED": "true"' wrangler.json
          grep -q 'G-V5ZPM5L19T' wrangler.json
          grep -q 'xswd8m446z' wrangler.json
          grep -q 'galvivault-0-5-qa' wrangler.json
          npm run day7c:gate
          git diff --check

      - name: Apply Day 7C QA migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --file migrations/0005_day7c_integration_trace.sql --config wrangler.json

      - name: Deploy authoritative QA backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Deploy QA frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.qa-frontend.jsonc

      - name: Reassert authoritative QA backend last
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Hard runtime gate - HubSpot adapter
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$QA_BACKEND_URL/health" -o /tmp/backend.json
          cat /tmp/backend.json
          grep -q '"day7c_hubspot_adapter":"day7c-hubspot-upsert-v2"' /tmp/backend.json
          grep -q '"hubspot_enabled":true' /tmp/backend.json
          grep -q '"hubspot_credential_present":true' /tmp/backend.json
          grep -q '"day7c_environment":"qa"' /tmp/backend.json

      - name: Hard runtime gate - GA4 and Clarity QA instrumentation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$QA_FRONTEND_URL" -o /tmp/frontend.html
          grep -q 'G-V5ZPM5L19T' /tmp/frontend.html
          grep -q 'xswd8m446z' /tmp/frontend.html
          ! grep -q 'G-KXJFKN7RTS' /tmp/frontend.html
          ! grep -q 'xjsdmprr4z' /tmp/frontend.html

      - name: Certification summary
        run: |
          echo '## Day 7C Critical-Path Runtime PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authoritative QA backend: worker/day7c-entry.js' >> "$GITHUB_STEP_SUMMARY"
          echo '- HubSpot adapter marker: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- HubSpot credential present: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GA4 QA configuration: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Clarity QA configuration: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR HUBSPOT → GA4 → CLARITY HUMAN EVIDENCE**' >> "$GITHUB_STEP_SUMMARY"
