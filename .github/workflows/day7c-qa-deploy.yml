name: Day 7C QA Deploy + Runtime Preflight

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - '.github/workflows/day7c-qa-deploy.yml'
      - 'worker/worker.js'
      - 'wrangler.json'
      - 'wrangler.qa-frontend.jsonc'
      - 'qa-frontend-worker.js'
      - 'scripts/day7b-build-qa-frontend.mjs'
      - 'day7c-browser-observability.js'
      - 'migrations/0005_day7c_integration_trace.sql'
      - 'tests/day7c-integration.test.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galvicare-qa-backend-authoritative
  cancel-in-progress: false

env:
  QA_BACKEND_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev

jobs:
  verify-deploy-preflight:
    name: Repair authoritative Worker, deploy QA, certify HubSpot GA4 Clarity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Apply one authoritative worker.js correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          worker_path = Path('worker/worker.js')
          wrangler_path = Path('wrangler.json')
          worker = worker_path.read_text()

          if "const DAY7C_HUBSPOT_ADAPTER_VERSION" not in worker:
              marker = "const DAY7A_RUNTIME_MARKER = 'day7a-payment-products-v1';"
              if marker not in worker:
                  raise SystemExit('DAY7A runtime marker not found')
              worker = worker.replace(
                  marker,
                  marker + "\nconst DAY7C_HUBSPOT_ADAPTER_VERSION = 'day7c-hubspot-direct-v1';\nconst DAY7C_HUBSPOT_TIMEOUT_MS = 5000;",
                  1
              )

          properties_pattern = re.compile(
              r"function buildHubSpotContactProperties\(\s*payload\s*\) \{.*?\n\}",
              re.S
          )
          properties_replacement = '''function buildHubSpotContactProperties(payload) {
            const properties = {
              email: normalizeFounderEmail(safe(payload, 'founder.email')),
              firstname: safe(payload, 'founder.first_name'),
              lastname: safe(payload, 'founder.last_name'),
              phone: safe(payload, 'founder.phone'),
              company: safe(payload, 'venture.venture_name'),
              website: safe(payload, 'venture.website'),
              galvicare_environment: 'qa',
              galvicare_test_record: 'true'
            };
            return Object.fromEntries(
              Object.entries(properties).filter(([, value]) => String(value || '').trim() !== '')
            );
          }'''
          worker, count = properties_pattern.subn(properties_replacement, worker, count=1)
          if count != 1:
              raise SystemExit('buildHubSpotContactProperties replacement failed')

          hubspot_pattern = re.compile(
              r"async function hubspotRequest\(.*?\n\}\n\nasync function upsertHubSpotContact\(.*?\n\}",
              re.S
          )
          hubspot_replacement = '''async function hubspotRequest(env, path, method = 'POST', body = null) {
            if (env.HUBSPOT_ENABLED !== 'true' || !env.HUBSPOT_PRIVATE_APP_TOKEN) {
              return { skipped: true, reason: 'HubSpot disabled or HUBSPOT_PRIVATE_APP_TOKEN missing' };
            }

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), DAY7C_HUBSPOT_TIMEOUT_MS);
            try {
              const response = await fetch(`https://api.hubapi.com${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${env.HUBSPOT_PRIVATE_APP_TOKEN}`,
                  'Content-Type': 'application/json'
                },
                body: body !== null ? JSON.stringify(body) : undefined,
                signal: controller.signal
              });

              let data = {};
              try { data = await response.json(); } catch { data = {}; }

              if (!response.ok) {
                const error = new Error(
                  `HubSpot ${method} ${path} failed (${response.status}): ${String(data.message || data.category || 'unknown error').slice(0, 500)}`
                );
                error.httpStatus = response.status;
                throw error;
              }
              return data;
            } finally {
              clearTimeout(timer);
            }
          }

          async function recordDay7CIntegrationTrace(env, sessionId, status, externalId = null) {
            if (!env.DB || !sessionId) return;
            try {
              await env.DB.prepare(
                `INSERT INTO integration_trace(session_id,integration,event_name,status,environment,external_id,created_at)
                 VALUES(?,?,?,?,?,?,CURRENT_TIMESTAMP)`
              ).bind(sessionId, 'hubspot', 'contact_upsert', status, 'qa', externalId).run();
            } catch (error) {
              console.error('Day 7C integration trace write failed', error?.message || error);
            }
          }

          async function upsertHubSpotContact(env, payload, sessionId = getPayloadSessionId(payload)) {
            if (env.HUBSPOT_ENABLED !== 'true' || !env.HUBSPOT_PRIVATE_APP_TOKEN) {
              await recordDay7CIntegrationTrace(env, sessionId, 'skipped');
              return { attempted: false, success: false, status: 'skipped' };
            }

            const properties = buildHubSpotContactProperties(payload);
            const email = normalizeFounderEmail(properties.email);
            if (!email) {
              await recordDay7CIntegrationTrace(env, sessionId, 'missing_email');
              return { attempted: false, success: false, status: 'missing_email' };
            }

            try {
              let existing = null;
              try {
                existing = await hubspotRequest(
                  env,
                  `/crm/v3/objects/contacts/${encodeURIComponent(email)}?idProperty=email&properties=email`,
                  'GET'
                );
              } catch (lookupError) {
                if (lookupError.httpStatus !== 404) throw lookupError;
              }

              let response;
              let operation;
              if (existing?.id) {
                operation = 'update';
                response = await hubspotRequest(
                  env,
                  `/crm/v3/objects/contacts/${encodeURIComponent(existing.id)}`,
                  'PATCH',
                  { properties }
                );
              } else {
                operation = 'create';
                response = await hubspotRequest(
                  env,
                  '/crm/v3/objects/contacts',
                  'POST',
                  { properties }
                );
              }

              const externalId = String(response?.id || existing?.id || '');
              await recordDay7CIntegrationTrace(env, sessionId, 'delivered', externalId || null);
              return {
                attempted: true,
                success: true,
                status: 'delivered',
                operation,
                contact_id: externalId
              };
            } catch (error) {
              const status = error?.name === 'AbortError' ? 'timeout' : 'failed';
              await recordDay7CIntegrationTrace(env, sessionId, status);
              console.error('Day 7C HubSpot sync failed', error?.message || error);
              return {
                attempted: true,
                success: false,
                status,
                error: String(error?.message || error).slice(0, 500)
              };
            }
          }'''
          worker, count = hubspot_pattern.subn(hubspot_replacement, worker, count=1)
          if count != 1:
              raise SystemExit('HubSpot request/upsert replacement failed')

          day2_pattern = re.compile(
              r"async function handleDay2Action\(env, payload, action\) \{.*?\n\}\n\nconst GALVISHOT_ACTIONS",
              re.S
          )
          day2_replacement = '''async function handleDay2Action(env, payload, action) {
            const db = requireDb(env); const sid = getPayloadSessionId(payload);
            if (action === 'triage_completeness') return jsonResponse({ success: true, action, session_id: sid, ...calculateCompleteness(payload) }, 200, env);
            if (action === 'submit_triage') {
              const completeness = calculateCompleteness(payload);
              if (!completeness.complete) return jsonResponse({ success: false, action, message: 'GalviTriage intake is incomplete or invalid.', ...completeness }, 422, env);
              const session_id = await persistTriage(db, payload);
              const vitals = await writeProductResult(db, session_id, 'GalviVitals', buildVitalsResult(payload));
              const score = await writeProductResult(db, session_id, 'GalviScore', calculateDeterministicScore(payload));
              const hubspot = await upsertHubSpotContact(env, payload, session_id);
              return jsonResponse({
                success: true,
                action,
                session_id,
                next_screen: 'GalviVitals',
                triage: { session_id, question_contract_version: DAY2_QUESTION_CONTRACT_VERSION },
                vitals,
                score,
                day7c: { adapter: DAY7C_HUBSPOT_ADAPTER_VERSION, hubspot }
              }, 200, env, { 'X-GalviCare-Day7C-Adapter': DAY7C_HUBSPOT_ADAPTER_VERSION });
            }
            if (!required(sid)) return jsonResponse({ success: false, action, message: 'Missing session_id' }, 400, env);
            if (action === 'get_triage') { const triage = await getStoredTriage(db, sid); if (!triage) return jsonResponse({ success: false, action, message: 'GalviTriage session not found', session_id: sid }, 404, env); return jsonResponse({ success: true, action, session_id: sid, triage }, 200, env); }
            const product = action === 'get_or_create_vitals' ? 'GalviVitals' : 'GalviScore';
            const stored = await storedProductResult(db, sid, product); if (stored) return jsonResponse({ success: true, action, session_id: sid, product, stored: true, result: JSON.parse(stored.result_json) }, 200, env);
            const triage = await getStoredTriage(db, sid); if (!triage) return jsonResponse({ success: false, action, message: 'GalviTriage session not found', session_id: sid }, 404, env);
            const resultPayload = { session: { session_id: sid }, founder: {}, venture: {}, scored_answers: triage.answers };
            const result = product === 'GalviVitals' ? buildVitalsResult(resultPayload) : calculateDeterministicScore(resultPayload);
            await writeProductResult(db, sid, product, result);
            return jsonResponse({ success: true, action, session_id: sid, product, stored: false, result }, 200, env);
          }

          const GALVISHOT_ACTIONS'''
          worker, count = day2_pattern.subn(day2_replacement, worker, count=1)
          if count != 1:
              raise SystemExit('handleDay2Action replacement failed')

          required = [
              "DAY7C_HUBSPOT_ADAPTER_VERSION = 'day7c-hubspot-direct-v1'",
              "await upsertHubSpotContact(env, payload, session_id)",
              "galvicare_test_record: 'true'",
              "recordDay7CIntegrationTrace"
          ]
          for marker in required:
              if marker not in worker:
                  raise SystemExit(f'Missing corrected Worker marker: {marker}')

          worker_path.write_text(worker)

          wrangler = wrangler_path.read_text()
          wrangler = wrangler.replace('"main": "worker/day7c-entry.js"', '"main": "worker/worker.js"')
          if '"main": "worker/worker.js"' not in wrangler:
              raise SystemExit('wrangler.json did not become worker.js authoritative')
          wrangler_path.write_text(wrangler)
          PY

      - name: Persist corrected authoritative Worker on existing QA branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- worker/worker.js wrangler.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add worker/worker.js wrangler.json
            git commit -m 'Day 7C: wire HubSpot directly into authoritative D1 submit_triage'
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi

      - name: Critical-path source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/worker.js
          grep -q '"main": "worker/worker.js"' wrangler.json
          grep -q 'day7c-hubspot-direct-v1' worker/worker.js
          grep -q 'await upsertHubSpotContact(env, payload, session_id)' worker/worker.js
          grep -q 'galvicare_test_record' worker/worker.js
          grep -q 'recordDay7CIntegrationTrace' worker/worker.js
          grep -q '"ENVIRONMENT": "qa"' wrangler.json
          grep -q '"HUBSPOT_ENABLED": "true"' wrangler.json
          grep -q 'G-V5ZPM5L19T' wrangler.json
          grep -q 'xswd8m446z' wrangler.json
          grep -q 'galvivault-0-5-qa' wrangler.json
          npm run day7c:gate
          git diff --check

      - name: Apply Day 7C QA migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --file migrations/0005_day7c_integration_trace.sql --config wrangler.json

      - name: Deploy authoritative QA Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Deploy QA frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.qa-frontend.jsonc

      - name: Reassert authoritative QA Worker last
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Automated HubSpot preflight through real submit_triage
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          cat > /tmp/day7c-preflight.json <<'JSON'
          {
            "action":"submit_triage",
            "session":{"session_id":"day7c_hubspot_preflight","source":"day7c_ci"},
            "founder":{"first_name":"Day7C","last_name":"Preflight","email":"day7c-ci@galvipro.com","phone":"","consent":true},
            "venture":{"venture_name":"Day 7C QA Preflight","organization_type":"Business","organization_stage":"Testing","industry":"Technology","revenue_range":"Testing","website":""},
            "priority":{"highest_impact_area":"Testing"},
            "open_text":{"biggest_challenge":"QA synthetic preflight"},
            "scored_answers":{
              "q01_business_clarity":4,"q02_stage_signal":4,"q03_real_problem":4,"q04_ideal_customer":4,"q05_attract_customers":4,
              "q06_customer_conversations":4,"q07_predictable_revenue":4,"q08_revenue_growth_confidence":4,"q09_revenue_driver_clarity":4,"q10_customer_satisfaction":4,
              "q11_feedback_improvement":4,"q12_organized_operations":4,"q13_founder_dependency":4,"q14_systems_support_growth":4,"q15_technology_effectiveness":4,
              "q16_ai_readiness":4,"q17_leadership_confidence":4,"q18_vision_clarity":4,"q19_decision_information":4,"q20_execution_action":4
            }
          }
          JSON
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/day7c-preflight.json \
            "$QA_BACKEND_URL/api" -o /tmp/hubspot-preflight.json
          cat /tmp/hubspot-preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/hubspot-preflight.json','utf8'));
          if (body.success !== true) throw new Error('submit_triage preflight failed');
          if (body.day7c?.adapter !== 'day7c-hubspot-direct-v1') throw new Error('direct Worker adapter marker missing');
          if (body.day7c?.hubspot?.success !== true) throw new Error(`HubSpot delivery failed: ${JSON.stringify(body.day7c?.hubspot || {})}`);
          if (body.day7c?.hubspot?.status !== 'delivered') throw new Error('HubSpot status not delivered');
          if (!body.day7c?.hubspot?.contact_id) throw new Error('HubSpot contact_id missing');
          console.log('HUBSPOT PREFLIGHT PASS', body.day7c.hubspot);
          NODE

      - name: GA4 and Clarity QA preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 3 "$QA_FRONTEND_URL" -o /tmp/frontend.html
          grep -q 'G-V5ZPM5L19T' /tmp/frontend.html
          grep -q 'xswd8m446z' /tmp/frontend.html
          grep -q 'gtag' /tmp/frontend.html
          grep -q 'clarity' /tmp/frontend.html
          ! grep -q 'G-KXJFKN7RTS' /tmp/frontend.html
          ! grep -q 'xjsdmprr4z' /tmp/frontend.html

      - name: Certification summary
        run: |
          echo '## Day 7C Automated Preflight PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authoritative backend: worker/worker.js' >> "$GITHUB_STEP_SUMMARY"
          echo '- Real submit_triage -> HubSpot delivery: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- QA GA4 instrumentation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- QA Clarity instrumentation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR ONE FINAL HUMAN GALVITRIAGE → HUBSPOT → GA4 → CLARITY RUN**' >> "$GITHUB_STEP_SUMMARY"
