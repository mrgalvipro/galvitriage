name: GalviStudio GalviCare 1.0 Day 1 QA Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/day1.js"
      - "worker/day1-p0-legacy.js"
      - "worker/day1-galvicare-1-0.js"
      - "worker/day1-human-e2e.js"
      - "migrations/day1/0001_canonical_business_medical_record.sql"
      - "migrations/day1/0100_galvicare_1_0_day1_foundation.sql"
      - "migrations/day1/0101_day1_principal_session_continuity.sql"
      - "tests/day1-foundation.test.mjs"
      - "tests/day1-galvicare-1-0.test.mjs"
      - "tests/day1-human-e2e-surface.test.mjs"
      - "wrangler.json"
      - ".github/workflows/day1-qa-foundation.yml"

permissions:
  contents: read

concurrency:
  group: galvicare-1-0-day1-qa
  cancel-in-progress: true

env:
  DAY1_ALLOWED_ORIGIN: https://galvipro.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  day1-foundation:
    name: Build, migrate, deploy, and prove Day 1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert mandated branch and exact repository state
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "qa-revamped-galvicare-0-5"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          if git branch --show-current | grep -qx 'work'; then
            echo 'FAIL: forbidden work branch is active.'
            exit 1
          fi
          echo "PASS: exact QA candidate ${GITHUB_SHA} checked out on ${GITHUB_REF_NAME}."

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert runtime and Production separation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const day1=JSON.parse(fs.readFileSync('wrangler.json','utf8'));
          const day7d=JSON.parse(fs.readFileSync('wrangler.day7d.json','utf8'));
          const production=fs.readFileSync('wrangler.production.jsonc','utf8');
          if(day1.name!=='galvivault-p0-day1-qa'||day1.main!=='worker/day1.js') throw new Error('Day 1 target is invalid.');
          if(day7d.name!=='galvicare-triage-intake'||day7d.main!=='worker/day7d-engine.js') throw new Error('Day 7D target is invalid.');
          if(!production.includes('worker/production-entry.js')||production.includes('worker/day1.js')) throw new Error('Production entry separation failed.');
          if(production.includes('galvivault-0-5-qa')||production.includes('cdf9042b-ab09-498a-ac66-010b6cce47d4')) throw new Error('Production config contains QA D1 authority.');
          const day1Db=day1.d1_databases?.find(item=>item.binding==='DB');
          const day7dDb=day7d.d1_databases?.find(item=>item.binding==='DB');
          if(day1Db?.database_name!=='galvivault-0-5-qa'||day7dDb?.database_name!=='galvivault-0-5-qa') throw new Error('QA D1 target mismatch.');
          if(day1Db?.migrations_dir!=='migrations/day1') throw new Error('Day 1 migration directory mismatch.');
          if(!String(day1.vars?.ALLOWED_ORIGINS||'').includes('https://galvicare-0-5-qa.mrgalvipro.workers.dev')) throw new Error('QA customer surface is not authorized for Day 1 Human E2E.');
          console.log('PASS: Day 1, Day 7D, QA customer surface, and Production runtime boundaries remain isolated.');
          NODE

      - name: Install existing dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Syntax-check exact Day 1 candidate
        run: |
          node --check worker/day1.js
          node --check worker/day1-p0-legacy.js
          node --check worker/day1-galvicare-1-0.js
          node --check worker/day1-human-e2e.js
          node --check day1-prefounder-qa.js

      - name: Run legacy and GalviCare 1.0 Day 1 blocking suites
        run: node --test tests/day1-foundation.test.mjs tests/day1-galvicare-1-0.test.mjs tests/day1-human-e2e-surface.test.mjs

      - name: Run preserved GalviCare full regression gate
        run: npm run stabilization:gate

      - name: Run preserved clinician and Founder History regression slices
        run: |
          npm run test:day8
          npm run test:day9

      - name: Prove preserved Day 7D and Production boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day7d-engine.js
          node --check worker/production-entry.js
          node --test tests/day7b-environment-isolation.test.mjs
          node scripts/day7d-preflight.mjs
          echo 'PASS: Existing Day 7D QA and Production boundaries remain valid.'

      - name: Apply collision-safe inherited Day 1 schema to QA D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --file=migrations/day1/0001_canonical_business_medical_record.sql \
            --config wrangler.json

      - name: Apply GalviCare 1.0 Day 1 additive schema to QA D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --file=migrations/day1/0100_galvicare_1_0_day1_foundation.sql \
            --config wrangler.json

      - name: Apply Pre-Founder principal-session continuity schema to QA D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --file=migrations/day1/0101_day1_principal_session_continuity.sql \
            --config wrangler.json

      - name: Verify QA D1 Day 1 schema and one-BMR invariant
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT migration_id,name,environment FROM gv1_schema_migrations WHERE migration_id IN ('0001','0100','0101') ORDER BY migration_id; SELECT COUNT(*) AS day1_table_count FROM sqlite_master WHERE type='table' AND name IN ('gv1_principal_contexts','gv1_consent_events','gv1_principal_evidence_items','gv1_evidence_lineage_links','gv1_day1_request_receipts','gv1_principal_sessions'); SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS invalid_principal_sessions FROM gv1_principal_sessions s JOIN gv1_principal_contexts c ON c.context_id=s.context_id WHERE c.record_mode<>'principal_only' OR c.venture_id IS NOT NULL OR c.bmr_id IS NOT NULL;"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.json \
            --json > /tmp/day1-schema.json
          cat /tmp/day1-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/day1-schema.json','utf8'));
          const objects=[];
          const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){objects.push(v);Object.values(v).forEach(walk)}};
          walk(payload);
          for(const id of ['0100','0101']){const migration=objects.find(x=>x.migration_id===id);if(!migration||migration.environment!=='qa')throw new Error(`Migration ${id} evidence is missing.`);}
          const tableCount=objects.find(x=>Object.hasOwn(x,'day1_table_count'))?.day1_table_count;
          const duplicate=objects.find(x=>Object.hasOwn(x,'duplicate_bmr_ventures'))?.duplicate_bmr_ventures;
          const invalidSessions=objects.find(x=>Object.hasOwn(x,'invalid_principal_sessions'))?.invalid_principal_sessions;
          if(Number(tableCount)!==6) throw new Error(`Expected 6 Day 1 1.0 tables; found ${tableCount ?? 'none'}.`);
          if(Number(duplicate)!==0) throw new Error(`Duplicate BMR-per-venture invariant failed: ${duplicate}.`);
          if(Number(invalidSessions)!==0) throw new Error(`Principal-session scope invariant failed: ${invalidSessions}.`);
          console.log('PASS: GalviCare 1.0 Day 1 schema, principal-session continuity, and one-BMR invariant are clean.');
          NODE

      - name: Deploy isolated Day 1 QA Worker and capture actual URL
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.json 2>&1 | tee /tmp/day1-deploy.log
          DAY1_BASE_URL="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' /tmp/day1-deploy.log | tail -n 1 || true)"
          if [ -z "$DAY1_BASE_URL" ]; then
            echo 'FAIL: Wrangler deployment completed without emitting a workers.dev URL.'
            cat /tmp/day1-deploy.log
            exit 1
          fi
          echo "DAY1_BASE_URL=$DAY1_BASE_URL" >> "$GITHUB_ENV"
          echo "Authoritative Day 1 deployment URL: $DAY1_BASE_URL"

      - name: Wait for deployed JSON runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS="$(curl --silent --show-error --location \
              --output /tmp/day1-health-body \
              --dump-header /tmp/day1-health-headers \
              --write-out '%{http_code}' \
              "${DAY1_BASE_URL}/health?candidate=${GITHUB_SHA}&attempt=${attempt}" || true)"
            CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $0}' /tmp/day1-health-headers | tail -n 1 | tr -d '\r' || true)"
            if [ "$STATUS" = "200" ] && echo "$CONTENT_TYPE" | grep -qi 'application/json'; then
              if node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day1-health-body','utf8')); if(p?.success!==true||p?.environment!=='qa'||p?.data?.service!=='galvivault-p0'||p?.data?.schema_namespace!=='gv1_'||p?.data?.release_version!=='galvicare_1_0_day1'||p?.data?.galvicare_schema_version!=='0100'||p?.data?.capabilities?.ai_enabled!==false) process.exit(1);"; then
                echo "PASS: Day 1 1.0 JSON runtime converged on attempt ${attempt}."
                exit 0
              fi
            fi
            echo "Waiting for Day 1 runtime convergence: attempt=${attempt}, status=${STATUS}, content_type=${CONTENT_TYPE:-missing}"
            sleep 3
          done
          echo 'FAIL: Day 1 endpoint never converged to the expected 1.0 JSON health contract.'
          cat /tmp/day1-health-headers || true
          head -c 1200 /tmp/day1-health-body || true
          exit 1

      - name: Run deployed inherited Day 1 API smoke
        env:
          DAY1_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run qa:smoke

      - name: Run deployed GalviCare 1.0 Day 1 smoke
        env:
          DAY1_V10_REMOTE_SMOKE: "1"
          DAY1_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node --test tests/day1-galvicare-1-0.test.mjs

      - name: Prove deployed Pre-Founder principal session create, resume, and replay
        shell: bash
        env:
          DAY1_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=process.env.DAY1_BASE_URL;
          const run=String(process.env.DAY1_RUN_SUFFIX).replace(/[^A-Za-z0-9._-]/g,'_').toLowerCase();
          const suffix=`human_${run}`,email=`day1.${suffix}@example.invalid`,actor=`principal:${suffix}`,idem=`ctx-human-${run}`,clientSession=`human-prefounder:${run}`;
          const body={email,first_name:'Human',last_name:'PreFounder',lifecycle_state:'pre_founder',record_mode:'principal_only',care_protocol:'founder_smb',payer_type:'self',client_session_key:clientSession};
          const req=async(path,{method='GET',key,body:payload}={})=>{const headers={Origin:'https://galvicare-0-5-qa.mrgalvipro.workers.dev','X-Galvi-Day1-Actor':actor,'X-Correlation-Id':`human-${run}-${Date.now()}`};if(key)headers['Idempotency-Key']=key;if(payload)headers['Content-Type']='application/json';const r=await fetch(`${base}${path}`,{method,headers,...(payload?{body:JSON.stringify(payload)}:{})});return{r,p:await r.json()}};
          const first=await req('/api/v1/principal-contexts',{method:'POST',key:idem,body});
          if(first.r.status!==201||!first.p?.data?.session?.session_id||first.p?.data?.context?.venture_id!==null||first.p?.data?.context?.bmr_id!==null)throw new Error(`Pre-Founder creation/session failed: ${JSON.stringify(first.p)}`);
          const contextId=first.p.data.context.context_id,sessionId=first.p.data.session.session_id;
          const resumed=await req(`/api/v1/principal-contexts/${encodeURIComponent(contextId)}`);
          if(!resumed.r.ok||resumed.p?.data?.session?.session_id!==sessionId)throw new Error(`Pre-Founder resume failed: ${JSON.stringify(resumed.p)}`);
          const replay=await req('/api/v1/principal-contexts',{method:'POST',key:idem,body});
          if(!replay.r.ok||replay.p?.status!=='replayed'||replay.p?.meta?.idempotent_replay!==true||replay.p?.data?.session?.session_id!==sessionId||replay.p?.data?.context?.context_id!==contextId)throw new Error(`Pre-Founder replay failed: ${JSON.stringify(replay.p)}`);
          console.log(JSON.stringify({status:'PASS',context_id:contextId,session_id:sessionId,venture_id:null,bmr_id:null},null,2));
          NODE

      - name: Verify remote GalviCare 1.0 Human-E2E readiness evidence
        shell: bash
        env:
          DAY1_RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RUN="$(echo "$DAY1_RUN_SUFFIX" | tr '[:upper:]' '[:lower:]')"
          PRE_KEY="ctx-${RUN}-a"
          OP_KEY="ctx-${RUN}-b"
          PRE_CONSENT="cns-${RUN}-a"
          OP_CONSENT="cns-${RUN}-b"
          PRE_EVIDENCE="ev-${RUN}-a"
          OP_EVIDENCE="ev-${RUN}-b"
          HUMAN_SESSION_KEY="human-prefounder:${RUN}"
          SQL="SELECT COUNT(*) AS pre_context_count FROM gv1_principal_contexts WHERE client_request_id='${PRE_KEY}' AND record_mode='principal_only' AND venture_id IS NULL AND bmr_id IS NULL; SELECT COUNT(*) AS op_context_count FROM gv1_principal_contexts WHERE client_request_id='${OP_KEY}' AND record_mode='principal_plus_venture' AND venture_id IS NOT NULL AND bmr_id IS NOT NULL; SELECT COUNT(*) AS pre_consent_count FROM gv1_consent_events WHERE client_request_id='${PRE_CONSENT}' AND status='granted'; SELECT COUNT(*) AS op_consent_count FROM gv1_consent_events WHERE client_request_id='${OP_CONSENT}' AND status='granted'; SELECT COUNT(*) AS principal_evidence_count FROM gv1_principal_evidence_items WHERE client_request_id='${PRE_EVIDENCE}' AND status='accepted'; SELECT COUNT(*) AS bmr_evidence_receipt_count FROM gv1_day1_request_receipts WHERE scope='ev' AND idempotency_key='${OP_EVIDENCE}'; SELECT COUNT(*) AS human_principal_session_count FROM gv1_principal_sessions WHERE client_session_key='${HUMAN_SESSION_KEY}'; SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS invalid_pre_contexts FROM gv1_principal_contexts WHERE record_mode='principal_only' AND (venture_id IS NOT NULL OR bmr_id IS NOT NULL); SELECT COUNT(*) AS orphan_consent FROM gv1_consent_events c LEFT JOIN gv1_founders f ON f.founder_id=c.founder_id WHERE f.founder_id IS NULL; SELECT COUNT(*) AS orphan_principal_evidence FROM gv1_principal_evidence_items e LEFT JOIN gv1_founders f ON f.founder_id=e.founder_id WHERE f.founder_id IS NULL; SELECT COUNT(*) AS orphan_principal_sessions FROM gv1_principal_sessions s LEFT JOIN gv1_principal_contexts c ON c.context_id=s.context_id LEFT JOIN gv1_founders f ON f.founder_id=s.founder_id WHERE c.context_id IS NULL OR f.founder_id IS NULL;"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.json \
            --json > /tmp/day1-v10-evidence.json
          cat /tmp/day1-v10-evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload=JSON.parse(fs.readFileSync('/tmp/day1-v10-evidence.json','utf8'));
          const objects=[];
          const walk=(v)=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){objects.push(v);Object.values(v).forEach(walk)}};
          walk(payload);
          const value=(key)=>objects.find(x=>Object.hasOwn(x,key))?.[key];
          for(const key of ['pre_context_count','op_context_count','pre_consent_count','op_consent_count','principal_evidence_count','bmr_evidence_receipt_count','human_principal_session_count']){
            if(Number(value(key))!==1) throw new Error(`${key} must equal 1; found ${value(key) ?? 'none'}.`);
          }
          for(const key of ['duplicate_bmr_ventures','invalid_pre_contexts','orphan_consent','orphan_principal_evidence','orphan_principal_sessions']){
            if(Number(value(key))!==0) throw new Error(`${key} must equal 0; found ${value(key) ?? 'none'}.`);
          }
          console.log('PASS: remote Day 1 1.0 principal, session, consent, evidence, and integrity assertions are clean.');
          NODE

      - name: Capture Day 1 Human E2E readiness summary
        if: success()
        run: |
          echo '## GALVISTUDIO | GALVICARE 1.0 DAY 1 AUTOMATED QA: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Branch: qa-revamped-galvicare-0-5' >> "$GITHUB_STEP_SUMMARY"
          echo '- Candidate SHA: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo "- QA Worker URL: $DAY1_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '- QA D1: galvivault-0-5-qa' >> "$GITHUB_STEP_SUMMARY"
          echo '- Inherited schema migration 0001: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviCare 1.0 Day 1 migration 0100: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pre-Founder principal-session continuity migration 0101: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pre-Founder principal_only null venture/BMR + session create/resume/replay: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Operating founder one BMR per venture: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Consent fail-closed + ledger: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Principal/BMR evidence scope + cross-record rejection: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Minimum QA server-side RBAC negatives: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- AI enabled: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Legacy Day 1 + GalviCare stabilization + Day 8/Day 9 regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production branch/runtime/database changed: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR DAY 1 HUMAN E2E H1-H18**' >> "$GITHUB_STEP_SUMMARY"
