name: GalviVault Day 6 QA Integration Hardening

# RELEASE ISOLATION — Day 4 owns the shared GalviVault QA Worker/D1 until
# DAY 4 HUMAN E2E PASS / DAY 4 BUILD FINAL. This workflow previously ran on
# broad pushes and could deploy a Day 5 runtime onto the same QA Worker while
# Day 4 Human E2E was in progress. Keep it manual-only until the Day 4 handoff.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvivault-qa-exclusive-mutator
  cancel-in-progress: false

jobs:
  paused-until-day4-final:
    name: Day 6 paused until Day 4 Build Final
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Day 4 release isolation
        run: |
          echo "GalviVault Day 6 is intentionally paused while GalviCare 1.0 Day 4 owns the shared QA Worker/D1."
          echo "Restore the prior Day 6 workflow only after DAY 4 HUMAN E2E PASS / DAY 4 BUILD FINAL is signed."
          exit 1
