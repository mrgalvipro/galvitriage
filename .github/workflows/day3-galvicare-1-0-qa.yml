name: GalviStudio GalviCare 1.0 Day 3 Regression Validator

# Day 5+ cumulative QA runtime ownership:
# - The existing galvivault-p0-day1-qa Worker is deployed by the cumulative Day 5
#   governed-care workflow.
# - This legacy Day 3 workflow is retained only as an on-demand regression validator.
# - It must never automatically replace the cumulative Day 4/Day 5 runtime.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-day3-regression-validator
  cancel-in-progress: true

jobs:
  day3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove approved QA ref and no work/main deployment lane
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          test "$(git branch --show-current)" != "work"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo 'PASS: Day 3 validator is read/test-only; cumulative Day 5 owns QA deployment.'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Verify canonical Day 3 entrypoint contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const w=require('./wrangler.galvicare-day3.json'); if(w.name!=='galvivault-p0-day1-qa'||w.main!=='worker/day3-unified-customer-api.js'||w.vars.ENVIRONMENT!=='qa'||w.vars.AI_ENABLED!=='true') process.exit(1)"
          node --check worker/day3-galvicare-1-0.js
          node --check worker/day3-unified-customer-api.js

      - name: Day 3 governed-AI and clarification regression
        run: |
          node --test tests/day3-galvicare-1-0.test.mjs
          node --test tests/day7d-customer-intelligence.test.mjs tests/day7d-customer-path-contract.test.mjs
          node --test tests/day4-galvicare-1-0.test.mjs

      - name: Confirm validator cannot deploy or mutate D1
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'wrangler(@[^ ]+)?[[:space:]]+(deploy|d1 execute|versions deploy)|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID' .github/workflows/day3-galvicare-1-0-qa.yml | grep -v 'grep -nE'; then
            echo 'FAIL: legacy Day 3 validator contains deploy/D1 mutation capability.' >&2
            exit 1
          fi
          echo 'PASS: no automatic deployment, D1 mutation, rollback, or Worker replacement exists in the legacy Day 3 validator.'

      - name: Validation summary
        run: |
          echo 'DAY 3 REGRESSION VALIDATOR PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- QA deployment owner: cumulative Day 5 workflow' >> "$GITHUB_STEP_SUMMARY"
          echo '- Legacy Day 3 automatic deployer: retired' >> "$GITHUB_STEP_SUMMARY"
          echo '- Clarification/governed-AI regression: validated' >> "$GITHUB_STEP_SUMMARY"
