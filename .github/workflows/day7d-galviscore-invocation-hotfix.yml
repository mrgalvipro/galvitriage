name: Day 7D Progressive Customer Intelligence Final Source Fix

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths: [".github/workflows/day7d-galviscore-invocation-hotfix.yml"]

permissions:
  contents: write

concurrency:
  group: day7d-progressive-customer-intelligence-final-source
  cancel-in-progress: true

jobs:
  finalize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply resilient full-chain orchestration correction
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='index.html';
          let html=fs.readFileSync(path,'utf8');

          function change(label, regex, replacement, alreadyPresent){
            if(alreadyPresent && alreadyPresent.test(html)){
              console.log(`PASS already applied: ${label}`);
              return;
            }
            const before=html;
            html=html.replace(regex,replacement);
            if(html===before) console.log(`SKIP no current match: ${label}`);
            else console.log(`PATCHED: ${label}`);
          }

          change(
            'GalviScore paid return blocks on clarification',
            /const rendered=await renderGalviScoreAfterPayment\(paidSessionId\);\s*if\(rendered===false\) throw new Error\('Verified GalviScore payment did not restore a GalviScore result\.'\);\s*queueMicrotask\(\(\)=>\{ const cached=getCachedGalviScoreResult\(\); if\(cached\) routeByGalviScoreConfidence\(cached\); \}\);\s*cleanPaidReturnCustomerUrl\(\);\s*return true;/,
`const rendered=await renderGalviScoreAfterPayment(paidSessionId);
      if(rendered===false) throw new Error('Verified GalviScore payment did not restore a GalviScore result.');
      const cached=getCachedGalviScoreResult();
      const followupKey='galviscore_followup_completed_'+paidSessionId;
      if(cached&&localStorage.getItem(followupKey)!=='true'){
        routeByGalviScoreConfidence(cached);
        return true;
      }
      cleanPaidReturnCustomerUrl();
      return true;`,
            /const followupKey='galviscore_followup_completed_'\+paidSessionId/
          );

          change(
            'GalviScore submit cleans return only after enriched result',
            /routeByGalviScoreConfidence\(cached\); \} \}\);\s*document\.getElementById\('return-to-triage'\)/,
            `routeByGalviScoreConfidence(cached); cleanPaidReturnCustomerUrl(); } });\ndocument.getElementById('return-to-triage')`,
            /routeByGalviScoreConfidence\(cached\); cleanPaidReturnCustomerUrl\(\); \} \}\);/
          );

          for(const [product,renderer,errorText] of [
            ['GalviShot','window.showIntegratedGalviShotResult','Verified GalviShot payment did not restore a GalviShot result.'],
            ['GalviSight','window.showGalviSight','Verified GalviSight payment did not restore a GalviSight result.'],
            ['GalviPath','window.showGalviPath','Verified GalviPath payment did not restore a GalviPath result.']
          ]){
            const rendererEsc=renderer.replaceAll('.','\\.');
            const re=new RegExp(`const rendered=await ${rendererEsc}\\(\\{paidReturn:true,session_id:paidSessionId\\}\\);\\s*if\\(rendered===false\\) throw new Error\\('${errorText.replaceAll('.','\\.')}\\'\\);\\s*clearGalviCareReturnPending\\(\\);\\s*cleanPaidReturnCustomerUrl\\(\\);`);
            change(
              `${product} paid return preserves pending question`,
              re,
`const rendered=await ${renderer}({paidReturn:true,session_id:paidSessionId});
      if(rendered===false) throw new Error('${errorText}');
      clearGalviCareReturnPending();
      if(window.GalviCareDay7D?.hasPending('${product}')) return true;
      cleanPaidReturnCustomerUrl();`,
              new RegExp(`GalviCareDay7D\\?\\.hasPending\\('${product}'\\)`)
            );
          }

          change(
            'GalviShot follow-up is a successful paid state',
            /if\(status\) status\.textContent='Follow-up is still required before GalviShot can generate the paid result\.';\s*return false;/,
            `if(status) status.textContent='Answer the targeted question below so GalviCare can update GalviShot using your evidence.';\n        return true;`,
            /update GalviShot using your evidence/
          );

          change(
            'eligible paid GalviShot regenerates immediately',
            /if\(evaluation\.status==='eligible'\) el\('galvishot-followup'\)\?\.classList\.add\('hidden'\);/,
`if(evaluation.status==='eligible'){
          el('galvishot-followup')?.classList.add('hidden');
          const params=new URLSearchParams(location.search);
          if((params.get('product')||'').toLowerCase()==='galvishot'&&params.get('paid')==='shot_success'){
            await requestResult({paidReturn:true});
            cleanPaidReturnCustomerUrl();
          }
        }`,
            /await requestResult\(\{paidReturn:true\}\);\s*cleanPaidReturnCustomerUrl\(\);/
          );

          change(
            'GalviSight renders targeted questions directly',
            /\} else if\(resultStatus==='needs_followup'\)\{\s*if\(stateMessage\) stateMessage\.textContent='GalviSight needs additional evidence before interpretation\.';\s*el\('galvisight-followup'\)\?\.classList\.remove\('hidden'\);/,
`} else if(resultStatus==='needs_followup'||responseStatus==='needs_followup'){
          if(stateMessage) stateMessage.textContent='Answer the targeted question below so GalviCare can update GalviSight using your evidence.';
          window.GalviCareDay7D?.renderQuestions('GalviSight',response);
          el('galvisight-followup')?.classList.remove('hidden');`,
            /renderQuestions\('GalviSight',response\)/
          );

          change(
            'GalviPath supports targeted-question state',
            /(if\(responseStatus==='locked'\)\{[\s\S]*?return false;\s*\})\s*const ready=/,
`$1

        if(responseStatus==='needs_followup'||resultStatus==='needs_followup'){
          if(stateMessage) stateMessage.textContent='Answer the targeted question below so GalviCare can update GalviPath using your evidence.';
          window.GalviCareDay7D?.renderQuestions('GalviPath',response);
          el('galvipath-followup')?.classList.remove('hidden');
          window.scrollTo({top:0,behavior:'smooth'});
          return true;
        }

        const ready=`,
            /renderQuestions\('GalviPath',response\)/
          );

          change(
            'downstream answers regenerate before URL cleanup',
            /if\(product==='GalviPath'&&typeof window\.showGalviPath==='function'\) await window\.showGalviPath\(\);\s*\}/,
            `if(product==='GalviPath'&&typeof window.showGalviPath==='function') await window.showGalviPath();\n    cleanPaidReturnCustomerUrl();\n  }`,
            /await window\.showGalviPath\(\);\s*cleanPaidReturnCustomerUrl\(\);/
          );

          change(
            'adapter exposes deterministic pending state and disables fetch race',
            /document\.addEventListener\('DOMContentLoaded',\(\)=>\{Object\.keys\(STAGES\)\.forEach\(bind\);interceptFetch\(\);\}\);\s*window\.GalviCareDay7D=\{renderQuestions,saveAnswers,ensureStageUi\};/,
`function hasPending(product){
    const cfg=STAGES[product],panel=cfg?el(cfg.followup):null,questions=cfg?el(cfg.questions):null;
    return Boolean(panel&&!panel.classList.contains('hidden')&&questions?.querySelector('textarea'));
  }
  document.addEventListener('DOMContentLoaded',()=>{Object.keys(STAGES).forEach(bind);});
  window.GalviCareDay7D={renderQuestions,saveAnswers,ensureStageUi,hasPending};`,
            /window\.GalviCareDay7D=\{renderQuestions,saveAnswers,ensureStageUi,hasPending\}/
          );

          fs.writeFileSync(path,html);
          NODE

      - name: Write permanent full-chain regression guard
        shell: bash
        run: |
          cat > tests/day7d-progressive-customer-intelligence-e2e.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');

          test('full progressive Customer Intelligence orchestration contract is present',()=>{
            const required=[
              "const followupKey='galviscore_followup_completed_'+paidSessionId",
              "GalviCareDay7D?.hasPending('GalviShot')",
              "GalviCareDay7D?.hasPending('GalviSight')",
              "GalviCareDay7D?.hasPending('GalviPath')",
              "renderQuestions('GalviSight',response)",
              "renderQuestions('GalviPath',response)",
              "window.GalviCareDay7D={renderQuestions,saveAnswers,ensureStageUi,hasPending}",
              "await requestResult({paidReturn:true});",
              "routeByGalviScoreConfidence(cached); cleanPaidReturnCustomerUrl();"
            ];
            required.forEach(value=>assert.ok(html.includes(value),`missing contract: ${value}`));
          });

          test('known asynchronous bypasses are absent',()=>{
            assert.ok(!html.includes("queueMicrotask(()=>{ const cached=getCachedGalviScoreResult(); if(cached) routeByGalviScoreConfidence(cached); });\n      cleanPaidReturnCustomerUrl();"));
            assert.ok(!html.includes("Object.keys(STAGES).forEach(bind);interceptFetch();"));
          });
          EOF

      - name: Prove focused full-chain contract
        run: node --test tests/day7d-progressive-customer-intelligence-e2e.test.mjs

      - name: Prove existing Day 7D suite
        run: npm run test:day7d

      - name: Prove preserved Day 1-7C baseline
        run: npm run stabilization:gate

      - name: Commit durable source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'galvicare-day7d-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/day7d-galviscore-invocation-hotfix.yml
          git add index.html tests/day7d-progressive-customer-intelligence-e2e.test.mjs
          git commit -m 'Day 7D: finalize progressive Customer Intelligence source orchestration'
          git push origin HEAD:qa-revamped-galvicare-0-5
