name: GalviVault Day 8 QA Clinician Workspace

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - '.github/workflows/galvivault-day8-qa.yml'
      - 'clinician-portal/**'
      - 'worker/day8-entry.js'
      - 'worker/auth/operator-identity.js'
      - 'worker/routes/operator-auth.js'
      - 'worker/routes/operator-workspace.js'
      - 'worker/domain/care-service.js'
      - 'tests/day8-clinician-workspace.test.mjs'
      - 'migrations/day8/**'
      - 'wrangler.day8.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: galvivault-day8-qa
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  day8:
    name: Deploy and prove Day 8 QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Protect branch and GalviCare baselines
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          git merge-base --is-ancestor eb8630c112ac5557bd374e5f5e1db05e4435bad5 "$GITHUB_SHA"
          git diff --exit-code eb8630c112ac5557bd374e5f5e1db05e4435bad5 -- \
            index.html worker/worker.js worker/production-entry.js \
            worker/day7d-engine.js worker/day7d-runtime.js \
            day7c-browser-observability.js day7d-browser-customer-intelligence.js \
            qa-frontend-worker.js wrangler.production.jsonc wrangler.day7d.json wrangler.qa-frontend.jsonc

      - name: Run Day 8 and inherited regression gates
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run test:day8
          npm test
          npm run day8:gate

      - name: Verify Cloudflare Worker/D1 deployment credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4.120.0 whoami

      - name: Apply additive Day 8 operator-auth migrations to QA D1
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --file=migrations/day8/0006_operator_device_auth.sql | tee /tmp/day8-migration.txt
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --file=migrations/day8/0007_second_galviclinician_invitation.sql | tee -a /tmp/day8-migration.txt

      - name: Deploy exact Day 8 Worker + clinician assets
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 deploy --config wrangler.day8.json | tee /tmp/day8-deploy.txt
          portal_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev/?' /tmp/day8-deploy.txt | tail -1)"
          test -n "$portal_url"
          portal_url="${portal_url%/}/"
          echo "portal_url=$portal_url" >> "$GITHUB_OUTPUT"
          echo "Day 8 deployed URL: $portal_url"

      - name: Prove QA D1 binding and canonical schema
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --command="SELECT migration_id,name,environment,checksum FROM gv1_schema_migrations WHERE migration_id IN ('0001','0002','0003','0004','0005','0006','0007') ORDER BY migration_id; SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS active_operator_credentials FROM gv8_operator_credentials WHERE status='active'; SELECT COUNT(*) AS pending_second_clinician_invites FROM gv8_operator_invitations WHERE operator_id='op_galviclinician_qa_01' AND role='clinician' AND used_at IS NULL;" \
            --json | tee /tmp/day8-d1-proof.json
          grep -q '"migration_id": "0006"' /tmp/day8-d1-proof.json
          grep -q '"migration_id": "0007"' /tmp/day8-d1-proof.json
          grep -q '"duplicate_bmr_ventures": 0' /tmp/day8-d1-proof.json
          grep -q '"pending_second_clinician_invites": 1' /tmp/day8-d1-proof.json

      - name: Prove public login shell and protected API fail-closed
        id: preauth
        shell: bash
        env:
          PORTAL_URL: ${{ steps.deploy.outputs.portal_url }}
        run: |
          set -euo pipefail
          test -n "$PORTAL_URL"
          page_status="$(curl -sS -o /tmp/day8-preauth.html -D /tmp/day8-preauth.headers -w '%{http_code}' "$PORTAL_URL")"
          echo "page_status=$page_status" | tee /tmp/day8-preauth-status.txt
          test "$page_status" = "200"
          grep -q 'Business Physician Workspace' /tmp/day8-preauth.html
          api_status="$(curl -sS -o /tmp/day8-me.json -w '%{http_code}' "${PORTAL_URL}api/v1/operator/me")"
          echo "api_status=$api_status" | tee -a /tmp/day8-preauth-status.txt
          test "$api_status" = "401"
          grep -q 'GV_AUTH_REQUIRED' /tmp/day8-me.json
          ! grep -Eqi 'bmr_id|founder_id|venture_id' /tmp/day8-me.json

      - name: Capture Day 8 deployment evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvivault-day8-qa-evidence-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            /tmp/day8-migration.txt
            /tmp/day8-deploy.txt
            /tmp/day8-d1-proof.json
            /tmp/day8-preauth-status.txt
            /tmp/day8-preauth.headers
            /tmp/day8-preauth.html
            /tmp/day8-me.json

      - name: Persist Day 8 QA run outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          portal_url="${{ steps.deploy.outputs.portal_url }}"
          git fetch origin qa-revamped-galvicare-0-5
          git checkout -B day8-evidence origin/qa-revamped-galvicare-0-5
          mkdir -p release-evidence/day8
          jq -nc \
            --arg source_sha "$source_sha" --arg branch "qa-revamped-galvicare-0-5" \
            --arg worker "galvivault-day8-qa" --arg portal_url "$portal_url" \
            --arg auth_mode "worker_device_ecdsa_session" --arg schema_version "0007" \
            --arg baseline "${{ steps.baseline.outcome }}" --arg tests "${{ steps.tests.outcome }}" \
            --arg credentials "${{ steps.credentials.outcome }}" --arg migration "${{ steps.migration.outcome }}" \
            --arg deploy "${{ steps.deploy.outcome }}" --arg d1 "${{ steps.d1.outcome }}" \
            --arg preauth "${{ steps.preauth.outcome }}" --arg job_status_before_evidence "${{ job.status }}" \
            '{source_sha:$source_sha,branch:$branch,worker:$worker,portal_url:$portal_url,auth_mode:$auth_mode,schema_version:$schema_version,baseline:$baseline,tests:$tests,credentials:$credentials,migration:$migration,deploy:$deploy,d1:$d1,preauth:$preauth,job_status_before_evidence:$job_status_before_evidence}' \
            > release-evidence/day8/qa-deployment-current.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-evidence/day8/qa-deployment-current.json
          git commit -m "Day 8 QA: record Worker-native auth deployment ${source_sha} [skip ci]" || exit 0
          git push origin HEAD:qa-revamped-galvicare-0-5
