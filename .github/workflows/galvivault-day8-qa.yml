name: GalviVault Day 8 QA Clinician Workspace

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - '.github/workflows/galvivault-day8-qa.yml'
      - 'clinician-portal/**'
      - 'worker/day8-entry.js'
      - 'worker/day8-day6-entry.js'
      - 'worker/day8-day7-entry.js'
      - 'worker/day6-entry.js'
      - 'worker/day5-common.js'
      - 'worker/day4-common.js'
      - 'worker/routes/day6-studio.js'
      - 'worker/domain/day6-studio-service.js'
      - 'worker/domain/day6-catalog.js'
      - 'worker/domain/day7-membership-service.js'
      - 'worker/domain/day7-customer-access-service.js'
      - 'worker/auth/operator-identity.js'
      - 'worker/routes/operator-auth.js'
      - 'worker/routes/operator-workspace.js'
      - 'worker/domain/care-service.js'
      - 'worker/domain/day5-projection-service.js'
      - 'tests/day8-clinician-workspace.test.mjs'
      - 'tests/day7-customer-access.test.mjs'
      - 'tests/day6-studio.test.mjs'
      - 'migrations/day8/**'
      - 'wrangler.day8.json'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: galvivault-day8-qa
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SIGNED_DAY5_ACTIVE_CARE_SHA: 70c8cef3211d60afbeec5679f101031d773cc5cb

jobs:
  day8:
    name: Deploy and prove Day 8 QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Protect branch and GalviCare baselines
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          git merge-base --is-ancestor "$SIGNED_DAY5_ACTIVE_CARE_SHA" "$GITHUB_SHA"
          # qa-frontend-worker.js is intentionally excluded here: it is owned by the
          # signed Day 7 GalviCare QA release gate and carries the already-proven
          # Phase-B operating-Founder presentation correction. Day 8 does not deploy it.
          git diff --exit-code "$SIGNED_DAY5_ACTIVE_CARE_SHA" "$GITHUB_SHA" -- \
            index.html worker/worker.js worker/production-entry.js \
            worker/day7d-engine.js worker/day7d-runtime.js \
            day7c-browser-observability.js day7d-browser-customer-intelligence.js \
            wrangler.production.jsonc wrangler.day7d.json wrangler.qa-frontend.jsonc

      - name: Run Day 8, Day 7 shared-care, Day 6 Studio, and inherited regression gates
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check worker/day8-day6-entry.js
          node --check worker/day8-day7-entry.js
          node --check worker/domain/day7-membership-service.js
          node --check worker/domain/day7-customer-access-service.js
          node --check clinician-portal/day6-studio-bridge.js
          node --check worker/routes/day6-studio.js
          node --check worker/domain/day6-studio-service.js
          npm run test:day8
          node --test tests/day7-customer-access.test.mjs
          node --test tests/day6-studio.test.mjs
          npm test
          npm run day8:gate

      - name: Verify Cloudflare Worker/D1 deployment credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@4.120.0 whoami

      - name: Apply additive Day 8 operator-auth migrations to QA D1
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --file=migrations/day8/0006_operator_device_auth.sql | tee /tmp/day8-migration.txt
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --file=migrations/day8/0007_second_galviclinician_invitation.sql | tee -a /tmp/day8-migration.txt

      - name: Deploy exact Day 8 Worker + clinician assets
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 deploy --config wrangler.day8.json | tee /tmp/day8-deploy.txt
          portal_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev/?' /tmp/day8-deploy.txt | tail -1)"
          test -n "$portal_url"
          portal_url="${portal_url%/}/"
          echo "portal_url=$portal_url" >> "$GITHUB_OUTPUT"
          echo "Day 8 deployed URL: $portal_url"

      - name: Prove QA D1 binding and canonical schema
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --command="SELECT migration_id,name,environment,checksum FROM gv1_schema_migrations WHERE migration_id IN ('0001','0002','0003','0004','0005','0006','0007','D6A1') ORDER BY migration_id; SELECT COUNT(*) AS duplicate_bmr_ventures FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS active_operator_credentials FROM gv8_operator_credentials WHERE status='active'; SELECT COUNT(*) AS active_second_clinician_credentials FROM gv8_operator_credentials WHERE operator_id='op_galviclinician_qa_01' AND role='clinician' AND status='active'; SELECT COUNT(*) AS used_second_clinician_invites FROM gv8_operator_invitations WHERE operator_id='op_galviclinician_qa_01' AND role='clinician' AND used_at IS NOT NULL;" \
            --json | tee /tmp/day8-d1-proof.json
          grep -q '"migration_id": "0006"' /tmp/day8-d1-proof.json
          grep -q '"migration_id": "0007"' /tmp/day8-d1-proof.json
          grep -q '"migration_id": "D6A1"' /tmp/day8-d1-proof.json
          grep -q '"duplicate_bmr_ventures": 0' /tmp/day8-d1-proof.json
          grep -q '"active_second_clinician_credentials": 1' /tmp/day8-d1-proof.json
          grep -q '"used_second_clinician_invites": 1' /tmp/day8-d1-proof.json

      - name: Prove public login shell and protected API fail-closed
        id: preauth
        shell: bash
        env:
          PORTAL_URL: ${{ steps.deploy.outputs.portal_url }}
        run: |
          set -euo pipefail
          test -n "$PORTAL_URL"
          page_status="$(curl -sS -o /tmp/day8-preauth.html -D /tmp/day8-preauth.headers -w '%{http_code}' "$PORTAL_URL")"
          echo "page_status=$page_status" | tee /tmp/day8-preauth-status.txt
          test "$page_status" = "200"
          grep -q 'Business Physician Workspace' /tmp/day8-preauth.html
          api_status="$(curl -sS -o /tmp/day8-me.json -w '%{http_code}' "${PORTAL_URL}api/v1/operator/me")"
          echo "api_status=$api_status" | tee -a /tmp/day8-preauth-status.txt
          test "$api_status" = "401"
          grep -q 'GV_AUTH_REQUIRED' /tmp/day8-me.json
          ! grep -Eqi 'bmr_id|founder_id|venture_id' /tmp/day8-me.json

      - name: E2E-18 final read-only D1 assertion catalog
        id: d1final
        shell: bash
        env:
          BMR_ID: bmr_0d72e878cc634917ae2ac8430a73331f
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 d1 execute DB --remote --config wrangler.day8.json \
            --command="SELECT COUNT(*) AS fixture_bmr_count FROM gv1_business_medical_records WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_evidence_count FROM gv1_evidence_items WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_findings_count FROM gv1_findings WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_recommendations_count FROM gv1_recommendations WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_treatment_plans_count FROM gv1_treatment_plans WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_treatment_events_count FROM gv1_treatment_events WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS fixture_outcomes_count FROM gv1_outcomes WHERE bmr_id='${BMR_ID}'; SELECT COUNT(*) AS e2e14_outcome_count FROM gv1_outcomes WHERE bmr_id='${BMR_ID}' AND outcome_code='D8_FOLLOW_UP_STATUS'; SELECT COUNT(*) AS orphan_recommendation_findings FROM gv1_recommendation_findings rf LEFT JOIN gv1_recommendations r ON r.recommendation_id=rf.recommendation_id LEFT JOIN gv1_findings f ON f.finding_id=rf.finding_id WHERE r.recommendation_id IS NULL OR f.finding_id IS NULL; SELECT COUNT(*) AS orphan_treatment_items FROM gv1_treatment_plan_items i LEFT JOIN gv1_treatment_plans p ON p.treatment_plan_id=i.treatment_plan_id WHERE p.treatment_plan_id IS NULL; SELECT COUNT(*) AS orphan_treatment_links FROM gv1_treatment_plan_recommendations l LEFT JOIN gv1_treatment_plans p ON p.treatment_plan_id=l.treatment_plan_id LEFT JOIN gv1_recommendations r ON r.recommendation_id=l.recommendation_id WHERE p.treatment_plan_id IS NULL OR r.recommendation_id IS NULL; SELECT COUNT(*) AS orphan_outcome_evidence FROM gv1_outcome_evidence oe LEFT JOIN gv1_outcomes o ON o.outcome_id=oe.outcome_id LEFT JOIN gv1_evidence_items e ON e.evidence_id=oe.evidence_id WHERE o.outcome_id IS NULL OR e.evidence_id IS NULL;" \
            --json | tee /tmp/day8-e2e18-d1-final.json
          test "$(jq -r '.[0].results[0].fixture_bmr_count' /tmp/day8-e2e18-d1-final.json)" = "1"
          test "$(jq -r '.[1].results[0].fixture_evidence_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[2].results[0].fixture_findings_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[3].results[0].fixture_recommendations_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[4].results[0].fixture_treatment_plans_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[5].results[0].fixture_treatment_events_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[6].results[0].fixture_outcomes_count' /tmp/day8-e2e18-d1-final.json)" -ge 1
          test "$(jq -r '.[7].results[0].e2e14_outcome_count' /tmp/day8-e2e18-d1-final.json)" = "1"
          test "$(jq -r '.[8].results[0].orphan_recommendation_findings' /tmp/day8-e2e18-d1-final.json)" = "0"
          test "$(jq -r '.[9].results[0].orphan_treatment_items' /tmp/day8-e2e18-d1-final.json)" = "0"
          test "$(jq -r '.[10].results[0].orphan_treatment_links' /tmp/day8-e2e18-d1-final.json)" = "0"
          test "$(jq -r '.[11].results[0].orphan_outcome_evidence' /tmp/day8-e2e18-d1-final.json)" = "0"

      - name: E2E-19 public GalviCare QA smoke
        id: galvicare
        shell: bash
        env:
          GALVICARE_QA_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev/
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/day8-e2e19-galvicare.html -D /tmp/day8-e2e19-galvicare.headers -w '%{http_code}' "$GALVICARE_QA_URL")"
          echo "status=$status" | tee /tmp/day8-e2e19-galvicare-status.txt
          test "$status" = "200"
          grep -qi 'GalviCare' /tmp/day8-e2e19-galvicare.html
          grep -qi 'GalviTriage' /tmp/day8-e2e19-galvicare.html
          grep -qi 'GalviVitals' /tmp/day8-e2e19-galvicare.html

      - name: Render immutable Day 8 QA run evidence
        if: always()
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          portal_url="${{ steps.deploy.outputs.portal_url }}"
          jq -nc \
            --arg source_sha "$source_sha" --arg branch "qa-revamped-galvicare-0-5" \
            --arg worker "galvivault-day8-qa" --arg portal_url "$portal_url" \
            --arg auth_mode "worker_device_ecdsa_session" --arg schema_version "D6A1" \
            --arg baseline "${{ steps.baseline.outcome }}" --arg tests "${{ steps.tests.outcome }}" \
            --arg credentials "${{ steps.credentials.outcome }}" --arg migration "${{ steps.migration.outcome }}" \
            --arg deploy "${{ steps.deploy.outcome }}" --arg d1 "${{ steps.d1.outcome }}" \
            --arg preauth "${{ steps.preauth.outcome }}" --arg d1_final "${{ steps.d1final.outcome }}" \
            --arg galvicare_smoke "${{ steps.galvicare.outcome }}" --arg job_status_before_evidence "${{ job.status }}" \
            '{source_sha:$source_sha,branch:$branch,worker:$worker,portal_url:$portal_url,auth_mode:$auth_mode,schema_version:$schema_version,baseline:$baseline,tests:$tests,credentials:$credentials,migration:$migration,deploy:$deploy,d1:$d1,preauth:$preauth,d1_final:$d1_final,galvicare_smoke:$galvicare_smoke,job_status_before_evidence:$job_status_before_evidence}' \
            > /tmp/day8-qa-deployment-current.json
          {
            echo '### Day 8 QA immutable candidate evidence'
            echo "- source SHA: \`$source_sha\`"
            echo "- portal: \`${portal_url:-not-deployed}\`"
            echo "- baseline: \`${{ steps.baseline.outcome }}\`"
            echo "- tests: \`${{ steps.tests.outcome }}\`"
            echo "- deploy: \`${{ steps.deploy.outcome }}\`"
            echo "- D1 proof: \`${{ steps.d1.outcome }}\` / final: \`${{ steps.d1final.outcome }}\`"
            echo "- GalviCare smoke: \`${{ steps.galvicare.outcome }}\`"
            echo '- QA branch is not mutated by evidence capture; the deployed source SHA remains the signed candidate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture Day 8 deployment evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galvivault-day8-qa-evidence-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            /tmp/day8-migration.txt
            /tmp/day8-deploy.txt
            /tmp/day8-d1-proof.json
            /tmp/day8-preauth-status.txt
            /tmp/day8-preauth.headers
            /tmp/day8-preauth.html
            /tmp/day8-me.json
            /tmp/day8-e2e18-d1-final.json
            /tmp/day8-e2e19-galvicare-status.txt
            /tmp/day8-e2e19-galvicare.headers
            /tmp/day8-e2e19-galvicare.html
            /tmp/day8-qa-deployment-current.json
