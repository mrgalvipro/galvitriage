name: GalviCare Day 7B Readiness

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths-ignore:
      - "worker/day1.js"
      - "worker/day2.js"
      - "migrations/day1/**"
      - "tests/day1-foundation.test.mjs"
      - "tests/galvivault-day2-identity-continuity.test.mjs"
      - "scripts/galvivault-day2-e2e.mjs"
      - "scripts/verify-galvivault-day2-files.mjs"
      - "wrangler.json"
      - "wrangler.day2.json"
      - ".github/workflows/day1-qa-foundation.yml"
      - ".github/workflows/day2-qa-identity-continuity.yml"
      - "release-evidence/day1/**"
      - "release-evidence/day2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day7b-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current Day 7A branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Preserve Day 7A and prove Day 7B source isolation
        run: npm run day7b:gate

      - name: Reject QA D1 binding in Production config
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'cdf9042b-ab09-498a-ac66-010b6cce47d4' wrangler.production.jsonc; then
            echo 'FAIL: Production config contains QA D1 ID.'
            exit 1
          fi
          grep -q 'galvivault-0-5-production' wrangler.production.jsonc
          grep -q 'worker/production-entry.js' wrangler.production.jsonc
          echo 'PASS: Production runtime is independently targeted.'
