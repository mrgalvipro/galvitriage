name: GalviCare 1.0 Day 3 OpenAI Secret Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - .github/workflows/day3-openai-secret-bootstrap.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prove existing QA branch only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "qa-revamped-galvicare-0-5"
          test "$(git branch --show-current)" != "work"
      - name: Configure existing QA Worker secret if Actions secret is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'P0 BLOCKER: GitHub Actions secret OPENAI_API_KEY is not configured.'
            exit 1
          fi
          printf '%s' "${OPENAI_API_KEY}" | npx --yes wrangler@4 secret put OPENAI_API_KEY --config wrangler.galvicare-day3.json >/tmp/day3-openai-secret-put.log 2>&1
          npx --yes wrangler@4 secret list --config wrangler.galvicare-day3.json >/tmp/day3-openai-secret-list.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day3-openai-secret-list.json','utf8'));
          if(!Array.isArray(p)||!p.some(x=>x?.name==='OPENAI_API_KEY')) throw new Error('QA Worker secret verification failed');
          console.log('PASS: OPENAI_API_KEY now exists on the existing QA Worker; value was never printed.');
          NODE
