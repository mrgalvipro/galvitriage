name: "GalviVault Day 2 Critical Path — Staging Disabled"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-disabled:
    name: Await canonical Day 2 candidate
    runs-on: ubuntu-latest
    steps:
      - name: Stop until canonical candidate is committed
        run: |
          echo "The prior self-mutating Day 2 workflow has been disabled."
          echo "Run the replacement workflow only after the canonical Day 2 files are committed."
          exit 1
