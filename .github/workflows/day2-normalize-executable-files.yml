name: "GalviVault Day 2 Critical Path"

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - ".github/workflows/day2-normalize-executable-files.yml"
      - "worker/day2.js"
      - "migrations/day1/0002_day2_identity_continuity.sql"
      - "tests/galvivault-day2-identity-continuity.test.mjs"
      - "scripts/galvivault-day2-e2e.mjs"
      - "scripts/verify-galvivault-day2-files.mjs"
      - "wrangler.day2.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: galvivault-day2-critical-path
  cancel-in-progress: true

env:
  GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DAY2_ALLOWED_ORIGIN: https://galvipro.com

jobs:
  day2-critical-path:
    name: Build, migrate, deploy, and prove Day 2
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact QA candidate without Marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -B qa-revamped-galvicare-0-5 FETCH_HEAD
          test "$(git branch --show-current)" = "qa-revamped-galvicare-0-5"
          echo "Checked out $(git rev-parse HEAD)"

      - name: Normalize only the required Day 2 executable files
        shell: bash
        run: |
          set -euo pipefail
          copy_if_present() {
            local source="$1"
            local target="$2"
            if [ -f "$source" ]; then
              mkdir -p "$(dirname "$target")"
              cp "$source" "$target"
            fi
          }
          copy_if_present worker/worker_day2.js.txt worker/day2.js
          copy_if_present migrations/day1/migrations_day1_0002_day2_identity_continuity.sql.txt migrations/day1/0002_day2_identity_continuity.sql
          copy_if_present tests/tests_galvivault-day2-identity-continuity.test.mjs.txt tests/galvivault-day2-identity-continuity.test.mjs
          copy_if_present scripts/scripts_galvivault-day2-e2e.mjs.txt scripts/galvivault-day2-e2e.mjs
          copy_if_present scripts/scripts_verify-galvivault-day2-files.mjs.txt scripts/verify-galvivault-day2-files.mjs
          copy_if_present wrangler.day2.json.txt wrangler.day2.json
          copy_if_present package.json.txt package.json
          for required in \
            worker/day2.js \
            migrations/day1/0002_day2_identity_continuity.sql \
            tests/galvivault-day2-identity-continuity.test.mjs \
            scripts/galvivault-day2-e2e.mjs \
            scripts/verify-galvivault-day2-files.mjs \
            wrangler.day2.json \
            package.json; do
            test -f "$required" || { echo "Missing required Day 2 file: $required"; exit 1; }
          done

      - name: Validate source, configuration, and local blocking gates with Node 22
        shell: bash
        run: |
          set -euo pipefail
          node22() { npx --yes node@22 "$@"; }
          node22 --version
          node22 --check worker/day2.js
          node22 --check tests/galvivault-day2-identity-continuity.test.mjs
          node22 --check scripts/galvivault-day2-e2e.mjs
          node22 --check scripts/verify-galvivault-day2-files.mjs
          node22 -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('wrangler.day2.json','utf8'));"
          node22 scripts/verify-galvivault-day2-files.mjs
          node22 --test tests/day1-foundation.test.mjs
          node22 --test tests/galvivault-day2-identity-continuity.test.mjs
          node22 --check worker/production-entry.js
          node22 --check worker/day7d-engine.js
          node22 --test tests/day7b-environment-isolation.test.mjs

      - name: Commit the normalized Day 2 candidate and remove obsolete aliases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for obsolete in \
            .github/workflows/day2-normalize-upload-paths.yml \
            .github/workflows/github_workflows_day2-qa-identity.yml.txt \
            worker/worker_day2.js.txt \
            migrations/day1/migrations_day1_0002_day2_identity_continuity.sql.txt \
            tests/tests_galvivault-day2-identity-continuity.test.mjs.txt \
            scripts/scripts_galvivault-day2-e2e.mjs.txt \
            scripts/scripts_verify-galvivault-day2-files.mjs.txt \
            wrangler.day2.json.txt \
            package.json.txt; do
            [ ! -e "$obsolete" ] || git rm "$obsolete"
          done
          git add \
            worker/day2.js \
            migrations/day1/0002_day2_identity_continuity.sql \
            tests/galvivault-day2-identity-continuity.test.mjs \
            scripts/galvivault-day2-e2e.mjs \
            scripts/verify-galvivault-day2-files.mjs \
            wrangler.day2.json \
            package.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "GalviVault Day 2: finalize executable critical path [skip ci]"
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi
          echo "DAY2_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert QA authority and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes node@22 --input-type=module -e "import fs from 'node:fs'; const day1=JSON.parse(fs.readFileSync('wrangler.json','utf8')); const day2=JSON.parse(fs.readFileSync('wrangler.day2.json','utf8')); const production=fs.readFileSync('wrangler.production.jsonc','utf8'); if(day1.main!=='worker/day1.js') throw new Error('Day 1 entry changed'); if(day2.name!==day1.name||day2.main!=='worker/day2.js') throw new Error('Day 2 QA entry invalid'); if(day2.vars?.ENVIRONMENT!=='qa'||day2.vars?.MIN_SCHEMA_VERSION!=='0002') throw new Error('Day 2 QA variables invalid'); const db=day2.d1_databases?.find(x=>x.binding==='DB'); if(db?.database_name!=='galvivault-0-5-qa'||db?.migrations_dir!=='migrations/day1') throw new Error('Day 2 D1 target invalid'); if(!production.includes('worker/production-entry.js')||production.includes('worker/day2.js')||production.includes('galvivault-0-5-qa')) throw new Error('Production isolation failed'); console.log('PASS: QA authority and Production isolation');"

      - name: Apply migration 0002 only when not already applied
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="SELECT COUNT(*) AS applied FROM gv1_schema_migrations WHERE migration_id='0002';" \
            --config wrangler.day2.json \
            --json > /tmp/day2-ledger-before.json
          APPLIED="$(npx --yes node@22 --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day2-ledger-before.json','utf8')); const objects=[]; const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){objects.push(v);Object.values(v).forEach(walk)}}; walk(p); process.stdout.write(String(objects.find(x=>Object.hasOwn(x,'applied'))?.applied??''));")"
          if [ "$APPLIED" = "0" ]; then
            npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
              --remote \
              --file=migrations/day1/0002_day2_identity_continuity.sql \
              --config wrangler.day2.json
          elif [ "$APPLIED" = "1" ]; then
            echo "Migration 0002 already applied; continuing without replaying ALTER TABLE statements."
          else
            echo "Unexpected migration ledger state: ${APPLIED:-missing}"
            exit 1
          fi

      - name: Verify remote Day 2 schema and constraints
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT migration_id,name,environment FROM gv1_schema_migrations WHERE migration_id IN ('0001','0002') ORDER BY migration_id; SELECT COUNT(*) AS day2_unique_indexes FROM sqlite_master WHERE type='index' AND name IN ('ux_gv1_founders_normalized_email','ux_gv1_bmr_one_per_venture','ux_gv1_roles_one_active_primary'); SELECT COUNT(*) AS normalized_email_column FROM pragma_table_info('gv1_founders') WHERE name='normalized_email'; SELECT COUNT(*) AS response_json_column FROM pragma_table_info('gv1_idempotency_keys') WHERE name='response_json';"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.day2.json \
            --json > /tmp/day2-schema.json
          cat /tmp/day2-schema.json
          npx --yes node@22 --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day2-schema.json','utf8')); const o=[]; const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){o.push(v);Object.values(v).forEach(walk)}}; walk(p); const value=k=>o.find(x=>Object.hasOwn(x,k))?.[k]; if(!o.find(x=>x.migration_id==='0001')||!o.find(x=>x.migration_id==='0002')) throw new Error('Migration ledger incomplete'); if(Number(value('day2_unique_indexes'))!==3||Number(value('normalized_email_column'))!==1||Number(value('response_json_column'))!==1) throw new Error('Day 2 schema constraints incomplete'); console.log('PASS: remote Day 2 schema');"

      - name: Deploy the exact Day 2 candidate to the isolated QA Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.day2.json 2>&1 | tee /tmp/day2-deploy.log
          DAY2_BASE_URL="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' /tmp/day2-deploy.log | tail -n 1 || true)"
          test -n "$DAY2_BASE_URL" || { cat /tmp/day2-deploy.log; exit 1; }
          echo "DAY2_BASE_URL=$DAY2_BASE_URL" >> "$GITHUB_ENV"

      - name: Wait for Day 2 runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS="$(curl --silent --show-error --location \
              --output /tmp/day2-ready-body \
              --dump-header /tmp/day2-ready-headers \
              --write-out '%{http_code}' \
              -H "Origin: ${DAY2_ALLOWED_ORIGIN}" \
              "${DAY2_BASE_URL}/api/v1/day2/readiness?candidate=${DAY2_CANDIDATE_SHA}&attempt=${attempt}" || true)"
            if [ "$STATUS" = "200" ] && npx --yes node@22 --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day2-ready-body','utf8')); if(p?.success!==true||p?.environment!=='qa'||p?.data?.ready!==true||p?.data?.current_schema_version!=='0002') process.exit(1);"; then
              echo "PASS: runtime converged on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          cat /tmp/day2-ready-headers || true
          head -c 2000 /tmp/day2-ready-body || true
          exit 1

      - name: Run deployed Day 1 regression and Day 2 H2.1 through H2.9
        shell: bash
        run: |
          set -euo pipefail
          DAY1_REMOTE_SMOKE=1 \
          DAY1_BASE_URL="$DAY2_BASE_URL" \
          DAY1_ALLOWED_ORIGIN="$DAY2_ALLOWED_ORIGIN" \
          DAY1_RUN_SUFFIX="day2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            npx --yes node@22 --test tests/day1-foundation.test.mjs
          DAY2_BASE_URL="$DAY2_BASE_URL" \
          DAY2_RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          DAY2_EVIDENCE_PATH=/tmp/day2-e2e.json \
            npx --yes node@22 scripts/galvivault-day2-e2e.mjs

      - name: Verify remote identity, BMR, session, and no-orphan assertions
        shell: bash
        run: |
          set -euo pipefail
          RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EMAIL="founder.day2.${RUN_SUFFIX}@example.test"
          SQL="SELECT COUNT(*) AS founder_count FROM gv1_founders WHERE normalized_email=lower(trim('${EMAIL}')); SELECT venture_id,COUNT(*) AS bmr_count FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)<>1; SELECT COUNT(*) AS orphan_roles FROM gv1_founder_venture_roles r LEFT JOIN gv1_founders f ON f.founder_id=r.founder_id LEFT JOIN gv1_ventures v ON v.venture_id=r.venture_id WHERE f.founder_id IS NULL OR v.venture_id IS NULL; SELECT COUNT(*) AS mismatched_sessions FROM gv1_assessment_sessions s LEFT JOIN gv1_business_medical_records b ON b.bmr_id=s.bmr_id WHERE b.bmr_id IS NULL OR b.venture_id<>s.venture_id; SELECT COUNT(*) AS duplicate_founder_emails FROM (SELECT normalized_email FROM gv1_founders WHERE normalized_email IS NOT NULL GROUP BY normalized_email HAVING COUNT(*)>1);"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa \
            --remote \
            --command="$SQL" \
            --config wrangler.day2.json \
            --json > /tmp/day2-d1-assertions.json
          cat /tmp/day2-d1-assertions.json
          npx --yes node@22 --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/day2-d1-assertions.json','utf8')); const o=[]; const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){o.push(v);Object.values(v).forEach(walk)}}; walk(p); const value=k=>o.find(x=>Object.hasOwn(x,k))?.[k]; if(Number(value('founder_count'))!==1) throw new Error('Founder count is not 1'); for(const k of ['orphan_roles','mismatched_sessions','duplicate_founder_emails']) if(Number(value(k))!==0) throw new Error(k+' is not 0'); if(o.find(x=>Object.hasOwn(x,'bmr_count'))) throw new Error('A Venture does not have exactly one BMR'); console.log('PASS: remote identity integrity');"

      - name: Persist the Day 2 evidence package without artifact actions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="release-evidence/day2/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          cp /tmp/day2-ledger-before.json "$RUN_DIR/ledger-before.json" 2>/dev/null || true
          cp /tmp/day2-schema.json "$RUN_DIR/schema.json" 2>/dev/null || true
          cp /tmp/day2-deploy.log "$RUN_DIR/deploy.log" 2>/dev/null || true
          cp /tmp/day2-e2e.json "$RUN_DIR/h2-1-through-h2-9.json" 2>/dev/null || true
          cp /tmp/day2-d1-assertions.json "$RUN_DIR/d1-assertions.json" 2>/dev/null || true
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=qa-revamped-galvicare-0-5" \
            "candidate_sha=${DAY2_CANDIDATE_SHA:-unavailable}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            "workflow_attempt=${GITHUB_RUN_ATTEMPT}" \
            "qa_worker_url=${DAY2_BASE_URL:-unavailable}" \
            "qa_d1=galvivault-0-5-qa" \
            "schema=0002" \
            "h2_10=HUMAN_EVIDENCE_REQUIRED" > "$RUN_DIR/candidate.txt"
          git add "$RUN_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "GalviVault Day 2: persist run ${GITHUB_RUN_ID} evidence [skip ci]"
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi

      - name: Publish the downstream Human Evidence instruction
        if: success()
        shell: bash
        run: |
          {
            echo '## GALVIVAULT DAY 2 AUTOMATED + REMOTE E2E: PASS'
            echo "- Candidate SHA: ${DAY2_CANDIDATE_SHA}"
            echo "- QA Worker URL: ${DAY2_BASE_URL}"
            echo '- Migration 0002: PASS'
            echo '- Day 1 regression: PASS'
            echo '- Day 2 local blocking suite: PASS'
            echo '- H2.1-H2.9: PASS'
            echo '- Remote D1 integrity assertions: PASS'
            echo '- Production source/config changed: NO'
            echo '- Remaining gate: H2.10 non-destructive Production regression only.'
          } >> "$GITHUB_STEP_SUMMARY"
