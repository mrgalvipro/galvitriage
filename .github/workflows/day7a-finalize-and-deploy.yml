name: Validate GalviCare Day 7A Baseline

# Day 7A is an accepted historical baseline only.
# It MUST NOT deploy the shared QA Worker. Day 7D owns QA deployment authority.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-day7a-validation-only
  cancel-in-progress: true

jobs:
  validate-day7a-baseline:
    name: Validate Day 7A Baseline — No Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current QA source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify preserved Day 7A presentation and runtime foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "/* Day 7A customer presentation */" index.html
          grep -Fq "GalviTriage™" index.html
          grep -Fq "Your GalviScore™ is Ready" index.html
          grep -Fq "Chart Your GalviPath™" index.html
          node --check worker/worker.js
          npm run stabilization:gate
          echo "PASS: Day 7A baseline preserved."
          echo "NO DEPLOYMENT AUTHORITY: Day 7D is the sole QA deploy owner."

      - name: Baseline validation summary
        if: success()
        shell: bash
        run: |
          {
            echo "## GalviCare Day 7A Baseline Validation PASS"
            echo ""
            echo "- Historical Day 7A baseline: PRESERVED"
            echo "- QA deployment authority: REMOVED"
            echo "- Authoritative QA deploy owner: Day 7D workflow only"
          } >> "$GITHUB_STEP_SUMMARY"
