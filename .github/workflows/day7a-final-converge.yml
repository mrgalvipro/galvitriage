name: Day 7A Final Source Convergence

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - ".github/workflows/day7a-final-converge.yml"

permissions:
  contents: write

concurrency:
  group: galvicare-day7a-final-converge
  cancel-in-progress: false

jobs:
  converge-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply final Day 7A source convergence
        run: node scripts/day7a-final-converge.mjs

      - name: Remove one-time convergence machinery before authoritative commit
        run: |
          rm -f scripts/day7a-final-converge.mjs
          rm -f .github/workflows/day7a-final-converge.yml

      - name: Commit exact authoritative QA source
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Day 7A: converge approved clinical experience"
          git push origin HEAD:qa-revamped-galvicare-0-5
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete gate against committed source
        run: |
          node --check worker/worker.js
          node --check scripts/verify-qa-runtime.mjs
          node --test tests/day7-release-readiness.test.mjs
          node --test tests/day7a-clinical-experience.test.mjs
          npm test
          npm run stabilization:gate
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Deploy exact committed QA Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Verify live QA runtime
        env:
          GALVICARE_QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
        run: node scripts/verify-qa-runtime.mjs

      - name: Persist readiness evidence
        shell: bash
        run: |
          cat > DAY7A_READY_FOR_E2E.txt <<EOF
          READY FOR E2E TESTING
          source_commit=${{ steps.commit.outputs.sha }}
          release_readiness=PASS
          clinical_experience=PASS
          stabilization=PASS
          qa_worker_deploy=PASS
          live_runtime=PASS
          EOF
          git add DAY7A_READY_FOR_E2E.txt
          git commit -m "Day 7A: record E2E readiness"
          git push origin HEAD:qa-revamped-galvicare-0-5
