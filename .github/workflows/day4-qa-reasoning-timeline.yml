name: GalviStudio GalviCare 1.0 Day 4 GalviChart QA Critical Path

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/day4-galvicare-1-0.js
      - worker/day4-customer-projection-v2.js
      - worker/day4-session-identity-entry.js
      - day4-galvichart-browser.js
      - day4-customer-experience-hardening.js
      - scripts/day4-build-qa-frontend.mjs
      - tests/day4-galvicare-1-0.test.mjs
      - wrangler.day4.json
      - .github/workflows/day4-qa-reasoning-timeline.yml

permissions:
  contents: read

concurrency:
  group: galvicare-1-0-day4-qa
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SIGNED_DAY3_SHA: b8208da30a060aa7bc7513bb5c1fec480534cd2a
  QA_WORKER_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev
  QA_WORKER_NAME: galvivault-p0-day1-qa

jobs:
  day4-critical-path:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact existing QA ref candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: P0 branch ancestry and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          test "$(git branch --show-current)" != "work"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SIGNED_DAY3_SHA" "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "PASS: existing QA ref only; no work/new/main implementation branch."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Day 4 static contract gate
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day4-galvicare-1-0.js
          node --check worker/day4-customer-projection-v2.js
          node --check worker/day4-session-identity-entry.js
          node --check day4-galvichart-browser.js
          node --check day4-customer-experience-hardening.js
          node --check scripts/day4-build-qa-frontend.mjs
          node --test tests/day4-galvicare-1-0.test.mjs | tee /tmp/day4-contract.txt
          ! grep -E '# skipped [1-9]' /tmp/day4-contract.txt
          grep -q '"main": "worker/day4-session-identity-entry.js"' wrangler.day4.json
          grep -q 'server_session_venture_founder_link' worker/day4-session-identity-entry.js
          grep -q 'founder_session_rebinding: false' worker/day4-session-identity-entry.js
          ! grep -RniE 'api\.openai\.com|OPENAI_API_KEY' --include='day4-galvichart-browser.js' --include='day4-customer-experience-hardening.js' .

      - name: Full inherited Day 3 and Day7D regression
        shell: bash
        run: |
          set -euo pipefail
          npm run day3:gate
          npm run stabilization:gate

      - name: Verify QA secret and canonical schema 0100-0103
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config wrangler.day4.json > /tmp/day4-secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-secrets.json','utf8'));
          if(!Array.isArray(p)||!p.some(x=>x?.name==='OPENAI_API_KEY')) throw new Error('OPENAI_API_KEY missing on existing QA Worker.');
          NODE
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="SELECT migration_id,environment FROM gv1_schema_migrations WHERE migration_id IN ('0100','0101','0102','0103') ORDER BY migration_id" > /tmp/day4-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-schema.json','utf8')),rows=[];
          const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.migration_id)rows.push(v);Object.values(v).forEach(walk)}};walk(p);
          for(const id of ['0100','0101','0102','0103']) if(!rows.some(x=>x.migration_id===id&&x.environment==='qa')) throw new Error(`Missing QA migration ${id}`);
          console.log('PASS: no Day 4 migration required; canonical Day 1-3 substrate is present.');
          NODE

      - name: D1 pre-deploy integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT lower(email) AS key,COUNT(*) AS n FROM gv1_founders WHERE email IS NOT NULL AND email<>'' GROUP BY lower(email) HAVING COUNT(*)>1; SELECT venture_id,COUNT(*) AS n FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1; SELECT COUNT(*) AS invalid_projectable FROM gv1_day3_ai_generations WHERE customer_projection=1 AND validation_status<>'accepted';"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="$SQL" > /tmp/day4-integrity.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const s=fs.readFileSync('/tmp/day4-integrity.json','utf8');
          if(/"n"\s*:\s*[2-9]/.test(s)) throw new Error('Duplicate canonical identity/BMR detected.');
          if(/"invalid_projectable"\s*:\s*[1-9]/.test(s)) throw new Error('Invalid customer-projectable AI state detected.');
          NODE

      - name: Build exact-SHA runtime configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const c=JSON.parse(fs.readFileSync('wrangler.day4.json','utf8'));
          c.main=path.resolve(c.main);
          c.vars={...(c.vars||{}),COMMIT_SHA:process.env.GITHUB_SHA,AI_ENABLED:'true'};
          fs.writeFileSync('/tmp/wrangler.day4.runtime.json',JSON.stringify(c,null,2));
          NODE

      - name: Upload exact Day 4 Worker version without changing traffic
        id: day4_upload
        shell: bash
        run: |
          set -euo pipefail
          TAG="day4-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 versions upload --config /tmp/wrangler.day4.runtime.json --tag "$TAG" --message "GalviCare Day 4 exact SHA $GITHUB_SHA" 2>&1 | tee /tmp/day4-upload.log
          VERSION_ID=$(sed -n 's/.*Worker Version ID: \([0-9a-f-][0-9a-f-]*\).*/\1/p' /tmp/day4-upload.log | tail -1)
          PREVIEW_URL=$(sed -n 's#.*Version Preview URL: \(https://[^[:space:]]*\).*#\1#p' /tmp/day4-upload.log | tail -1)
          test -n "$VERSION_ID"
          echo "Exact candidate Worker Version ID: $VERSION_ID"
          echo "DAY4_WORKER_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          if test -n "$PREVIEW_URL"; then
            echo "DAY4_VERSION_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
            echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          fi

          # Cloudflare's version registry is briefly eventually consistent. Do not
          # promote until the exact uploaded ID is queryable; this permanently avoids
          # the historical 100146 race from deploying an ID before registration.
          for n in $(seq 1 20); do
            npx --yes wrangler@4 versions list --name "$QA_WORKER_NAME" --config /tmp/wrangler.day4.runtime.json --json > /tmp/day4-versions.json || true
            if grep -q "$VERSION_ID" /tmp/day4-versions.json; then
              npx --yes wrangler@4 versions view "$VERSION_ID" --name "$QA_WORKER_NAME" --config /tmp/wrangler.day4.runtime.json --json > /tmp/day4-version.json
              echo "PASS: exact version is registered and queryable on attempt $n."
              exit 0
            fi
            sleep 2
          done
          echo 'FAIL: exact uploaded Day 4 version never became queryable; no traffic changed.'; exit 1

      - name: Prove uploaded exact-SHA candidate before promotion
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${DAY4_VERSION_PREVIEW_URL:-}"; then
            echo 'INFO: Cloudflare did not expose a public version preview URL; exact version registry proof already passed.'
            exit 0
          fi
          for n in $(seq 1 20); do
            STATUS=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/day4-preview-health.json -w '%{http_code}' "${DAY4_VERSION_PREVIEW_URL}/health?sha=$GITHUB_SHA&n=$n" || true)
            if test "$STATUS" = "200" && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/day4-preview-health.json','utf8'));
          const c=h?.data?.capabilities||{};
          if(h?.success!==true||h?.data?.commit_sha!==process.env.GITHUB_SHA)process.exit(1);
          if(c.returning_session_identity_resolution!==true||c.session_identity_source!=='server_session_venture_founder_link'||c.founder_session_rebinding!==false)process.exit(1);
          NODE
            then echo "PASS: exact candidate executes at version preview ${DAY4_WORKER_VERSION_ID}."; exit 0; fi
            sleep 2
          done
          echo 'FAIL: uploaded candidate itself does not execute the expected Day 4 contract; do not promote.'; exit 1

      - name: Explicitly promote exact registered version to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          promoted=0
          for n in $(seq 1 12); do
            echo "Promotion attempt $n for version $DAY4_WORKER_VERSION_ID"
            if npx --yes wrangler@4 versions deploy \
              --name "$QA_WORKER_NAME" \
              --version-id "$DAY4_WORKER_VERSION_ID" \
              --percentage 100 \
              --message "Day 4 exact SHA $GITHUB_SHA" \
              --config /tmp/wrangler.day4.runtime.json \
              -y; then
              promoted=1
              break
            fi
            sleep 3
          done
          test "$promoted" = "1"

          # Deployment-control-plane PASS is only the first half of convergence.
          # Require the newest deployment itself to point 100% at this exact ID.
          for n in $(seq 1 20); do
            npx --yes wrangler@4 deployments list --name "$QA_WORKER_NAME" --config /tmp/wrangler.day4.runtime.json --json > /tmp/day4-deployments.json || true
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id=process.env.DAY4_WORKER_VERSION_ID;
          let d=[];try{d=JSON.parse(fs.readFileSync('/tmp/day4-deployments.json','utf8'));}catch{process.exit(1)}
          if(!Array.isArray(d)||!d.length)process.exit(1);
          const latest=[...d].sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0))[0];
          const versions=Array.isArray(latest?.versions)?latest.versions:[];
          if(versions.length!==1||versions[0]?.version_id!==id||Number(versions[0]?.percentage)!==100)process.exit(1);
          NODE
            then echo "PASS: active deployment control plane routes 100% to $DAY4_WORKER_VERSION_ID."; exit 0; fi
            sleep 2
          done
          echo 'FAIL: Cloudflare active deployment did not converge to the exact registered version.'; exit 1

      - name: Exact canonical workers.dev runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 45); do
            HEALTH_STATUS=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/day4-health.json -w '%{http_code}' "$QA_WORKER_URL/health?sha=$GITHUB_SHA&version=$DAY4_WORKER_VERSION_ID&n=$n" || true)
            READY_STATUS=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/day4-ready.json -w '%{http_code}' "$QA_WORKER_URL/api/v1/day4/readiness?sha=$GITHUB_SHA&version=$DAY4_WORKER_VERSION_ID&n=$n" || true)
            echo "Canonical attempt $n health=$HEALTH_STATUS readiness=$READY_STATUS"
            if test "$HEALTH_STATUS" = "200" && test "$READY_STATUS" = "200" && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/day4-health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/day4-ready.json','utf8'));
          const c=h?.data?.capabilities||{};
          if(h?.success!==true||h?.data?.release_version!=='galvicare_1_0_day4'||h?.data?.commit_sha!==process.env.GITHUB_SHA)process.exit(1);
          if(c.galvichart_1_0!==true||c.chart_read_side_effect_free!==true||c.day3_closed_loop_inherited!==true)process.exit(1);
          if(c.returning_session_identity_resolution!==true||c.session_identity_source!=='server_session_venture_founder_link'||c.founder_session_rebinding!==false)process.exit(1);
          if(r?.success!==true||r?.data?.ready!==true||r?.data?.chart_shadow_database!==false||r?.meta?.commit_sha!==process.env.GITHUB_SHA)process.exit(1);
          NODE
            then echo "PASS: public workers.dev serves exact SHA $GITHUB_SHA at promoted Worker version $DAY4_WORKER_VERSION_ID."; exit 0; fi
            sleep 3
          done
          echo 'FAIL: active deployment says exact version at 100%, but public workers.dev still serves a different runtime. Stop before browser/Human E2E.'; exit 1

      - name: Prove returning customer bootstrap is 200 and identity stable
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT v.session_id AS session_id,CASE WHEN COALESCE(f.session_id,'')<>v.session_id THEN 1 ELSE 0 END AS returning_identity FROM ventures v JOIN sessions s ON s.session_id=v.session_id JOIN founders f ON f.founder_id=v.founder_id WHERE v.session_id IS NOT NULL AND trim(COALESCE(f.email,''))<>'' AND lower(COALESCE(f.consent_status,'')) IN ('accepted','granted') AND EXISTS (SELECT 1 FROM product_results pr WHERE pr.session_id=v.session_id AND pr.product='GalviScore') ORDER BY returning_identity DESC,v.updated_at DESC LIMIT 1;"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="$SQL" > /tmp/day4-bootstrap-session.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-bootstrap-session.json','utf8'));const rows=[];
          const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.session_id)rows.push(v);Object.values(v).forEach(walk)}};walk(p);
          const row=rows.find(x=>x.session_id);
          if(!row)throw new Error('No consented QA GalviScore session is available for deployed customer-bootstrap proof.');
          fs.writeFileSync('/tmp/day4-bootstrap-session.txt',String(row.session_id));
          fs.writeFileSync('/tmp/day4-bootstrap-mode.txt',String(Number(row.returning_identity||0)));
          console.log(`Bootstrap probe session selected; returning_identity=${Number(row.returning_identity||0)}.`);
          NODE
          SESSION_ID=$(cat /tmp/day4-bootstrap-session.txt)
          for pass in 1 2; do
            STATUS=$(curl -sS -o "/tmp/day4-bootstrap-$pass.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Cache-Control: no-cache' \
              -H "X-Galvi-Day3-Session: $SESSION_ID" \
              -d '{}' \
              "$QA_WORKER_URL/api/v1/day3/customer-bootstrap?sha=$GITHUB_SHA&pass=$pass")
            echo "customer-bootstrap pass $pass status=$STATUS"
            test "$STATUS" = "200"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/day4-bootstrap-1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/day4-bootstrap-2.json','utf8'));
          for(const x of [a,b]){
            if(x?.success!==true||x?.status!=='ok')throw new Error('customer-bootstrap did not return success/ok.');
            if(x?.data?.identity_source!=='authoritative_galvicare_session')throw new Error('customer-bootstrap identity source is not authoritative GalviCare session.');
            for(const key of ['principal_id','bmr_id','context_id'])if(!x?.data?.[key])throw new Error(`customer-bootstrap missing ${key}.`);
          }
          for(const key of ['principal_id','bmr_id','context_id'])if(a.data[key]!==b.data[key])throw new Error(`customer-bootstrap changed ${key} across exact replay.`);
          console.log(`PASS: customer-bootstrap=200 twice with stable principal/BMR/context; returning_identity=${fs.readFileSync('/tmp/day4-bootstrap-mode.txt','utf8').trim()}.`);
          NODE

      - name: Prove same customer Chart projection when Shot is already activated
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ID=$(cat /tmp/day4-bootstrap-session.txt)
          CONTEXT_ID=$(node --input-type=module -e "const p=JSON.parse(require('fs').readFileSync('/tmp/day4-bootstrap-1.json','utf8'));process.stdout.write(p.data.context_id)")
          STATUS=$(curl -sS -o /tmp/day4-chart-probe.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache' \
            -H "X-Galvi-Day3-Session: $SESSION_ID" \
            -d "{\"context_id\":\"$CONTEXT_ID\"}" \
            "$QA_WORKER_URL/api/v1/day4/chart?sha=$GITHUB_SHA")
          if test "$STATUS" = "200"; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-chart-probe.json','utf8'));
          if(p?.success!==true)throw new Error('GalviChart 200 did not return success.');
          const sections=p?.data?.sections||{};
          for(const key of ['overview','health','timeline','care_plan','evidence','documents','galviclinic','history'])if(!(key in sections))throw new Error(`GalviChart missing ${key}.`);
          console.log('PASS: activated same-record GalviChart projection is available from the canonical BHR.');
          NODE
          elif test "$STATUS" = "402"; then
            echo 'INFO: selected bootstrap session is not Shot-activated; structured locked state is correct and bootstrap proof remains PASS.'
            grep -q 'locked' /tmp/day4-chart-probe.json
          else
            echo "FAIL: GalviChart same-record probe returned unexpected HTTP $STATUS"; cat /tmp/day4-chart-probe.json; exit 1
          fi

      - name: Deployed authorization and structured-error negatives
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/day4-noauth.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$QA_WORKER_URL/api/v1/day4/chart")
          test "$STATUS" = "401"
          grep -q 'needs_reauth' /tmp/day4-noauth.json
          STATUS=$(curl -sS -o /tmp/day4-unassigned.json -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Galvi-Day1-Actor: clinician_unassigned' -d '{"context_id":"ctx_invalid_but_safe"}' "$QA_WORKER_URL/api/v1/day4/chart")
          test "$STATUS" = "403"
          grep -q 'forbidden' /tmp/day4-unassigned.json

      - name: D1 post-deploy read-only integrity
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="SELECT COUNT(*) AS duplicate_founders FROM (SELECT lower(email) FROM gv1_founders WHERE email IS NOT NULL AND email<>'' GROUP BY lower(email) HAVING COUNT(*)>1); SELECT COUNT(*) AS duplicate_bmrs FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1); SELECT COUNT(*) AS invalid_projectable FROM gv1_day3_ai_generations WHERE customer_projection=1 AND validation_status<>'accepted';" > /tmp/day4-post.json
          grep -q '"duplicate_founders": 0' /tmp/day4-post.json
          grep -q '"duplicate_bmrs": 0' /tmp/day4-post.json
          grep -q '"invalid_projectable": 0' /tmp/day4-post.json

      - name: Day 4 automated gate summary
        run: |
          echo '## GalviCare 1.0 Day 4 Automated Critical Path' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing QA branch only: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Signed Day 3 ancestry + inherited regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Follow-up draft resilience contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Accepted governed customer projection contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact Worker version registered/promoted: $DAY4_WORKER_VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public workers.dev exact SHA: $GITHUB_SHA — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo '- Returning customer-bootstrap HTTP 200 + stable principal/BMR/context: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- No founder session rebinding / no duplicate canonical record: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- QA D1 integrity/security negatives: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '**AUTOMATED GATE PASS — run focused Human H04-H11 regression, then continue H12-H22 + rollback.**' >> "$GITHUB_STEP_SUMMARY"
