name: GalviStudio GalviCare 1.0 Day 4 GalviChart QA Critical Path

on:
  workflow_dispatch:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - worker/day4-galvicare-1-0.js
      - day4-galvichart-browser.js
      - day4-customer-experience-hardening.js
      - scripts/day4-build-qa-frontend.mjs
      - tests/day4-galvicare-1-0.test.mjs
      - wrangler.day4.json
      - .github/workflows/day4-qa-reasoning-timeline.yml

permissions:
  contents: read

concurrency:
  group: galvicare-1-0-day4-qa
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SIGNED_DAY3_SHA: b8208da30a060aa7bc7513bb5c1fec480534cd2a
  QA_WORKER_URL: https://galvivault-p0-day1-qa.mrgalvipro.workers.dev

jobs:
  day4-critical-path:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact existing QA ref candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: P0 branch ancestry and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          test "$(git branch --show-current)" != "work"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SIGNED_DAY3_SHA" "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "PASS: existing QA ref only; no work/new/main implementation branch."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Day 4 static contract gate
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day4-galvicare-1-0.js
          node --check day4-galvichart-browser.js
          node --check day4-customer-experience-hardening.js
          node --check scripts/day4-build-qa-frontend.mjs
          node --test tests/day4-galvicare-1-0.test.mjs | tee /tmp/day4-contract.txt
          ! grep -E '# skipped [1-9]' /tmp/day4-contract.txt
          ! grep -RniE 'api\.openai\.com|OPENAI_API_KEY' --include='day4-galvichart-browser.js' --include='day4-customer-experience-hardening.js' .

      - name: Full inherited Day 3 and Day7D regression
        shell: bash
        run: |
          set -euo pipefail
          npm run day3:gate
          npm run stabilization:gate

      - name: Verify QA secret and canonical schema 0100-0103
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config wrangler.day4.json > /tmp/day4-secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-secrets.json','utf8'));
          if(!Array.isArray(p)||!p.some(x=>x?.name==='OPENAI_API_KEY')) throw new Error('OPENAI_API_KEY missing on existing QA Worker.');
          NODE
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="SELECT migration_id,environment FROM gv1_schema_migrations WHERE migration_id IN ('0100','0101','0102','0103') ORDER BY migration_id" > /tmp/day4-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/day4-schema.json','utf8')),rows=[];
          const walk=v=>{if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'){if(v.migration_id)rows.push(v);Object.values(v).forEach(walk)}};walk(p);
          for(const id of ['0100','0101','0102','0103']) if(!rows.some(x=>x.migration_id===id&&x.environment==='qa')) throw new Error(`Missing QA migration ${id}`);
          console.log('PASS: no Day 4 migration required; canonical Day 1-3 substrate is present.');
          NODE

      - name: D1 pre-deploy integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT lower(email) AS key,COUNT(*) AS n FROM gv1_founders WHERE email IS NOT NULL AND email<>'' GROUP BY lower(email) HAVING COUNT(*)>1; SELECT venture_id,COUNT(*) AS n FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1; SELECT COUNT(*) AS invalid_projectable FROM gv1_day3_ai_generations WHERE customer_projection=1 AND validation_status<>'accepted';"
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="$SQL" > /tmp/day4-integrity.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const s=fs.readFileSync('/tmp/day4-integrity.json','utf8');
          if(/"n"\s*:\s*[2-9]/.test(s)) throw new Error('Duplicate canonical identity/BMR detected.');
          if(/"invalid_projectable"\s*:\s*[1-9]/.test(s)) throw new Error('Invalid customer-projectable AI state detected.');
          NODE

      - name: Build exact-SHA runtime configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const c=JSON.parse(fs.readFileSync('wrangler.day4.json','utf8'));
          c.main=path.resolve(c.main);
          c.vars={...(c.vars||{}),COMMIT_SHA:process.env.GITHUB_SHA,AI_ENABLED:'true'};
          fs.writeFileSync('/tmp/wrangler.day4.runtime.json',JSON.stringify(c,null,2));
          NODE

      - name: Deploy exact candidate to existing QA Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config /tmp/wrangler.day4.runtime.json 2>&1 | tee /tmp/day4-deploy.log

      - name: Exact runtime convergence and Day 4 readiness
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 50); do
            if curl -fsS "$QA_WORKER_URL/health?sha=$GITHUB_SHA&n=$n" > /tmp/day4-health.json \
              && curl -fsS "$QA_WORKER_URL/api/v1/day4/readiness?sha=$GITHUB_SHA&n=$n" > /tmp/day4-ready.json \
              && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('/tmp/day4-health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/day4-ready.json','utf8'));
          const c=h?.data?.capabilities||{};
          if(h?.success!==true||h?.data?.release_version!=='galvicare_1_0_day4'||h?.data?.commit_sha!==process.env.GITHUB_SHA)process.exit(1);
          if(c.galvichart_1_0!==true||c.chart_read_side_effect_free!==true||c.day3_closed_loop_inherited!==true)process.exit(1);
          if(r?.success!==true||r?.data?.ready!==true||r?.data?.chart_shadow_database!==false)process.exit(1);
          NODE
            then cat /tmp/day4-health.json; cat /tmp/day4-ready.json; exit 0; fi
            sleep 3
          done
          echo 'FAIL: exact Day 4 runtime did not converge'; exit 1

      - name: Deployed authorization and structured-error negatives
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/day4-noauth.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$QA_WORKER_URL/api/v1/day4/chart")
          test "$STATUS" = "401"
          grep -q 'needs_reauth' /tmp/day4-noauth.json
          STATUS=$(curl -sS -o /tmp/day4-unassigned.json -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Galvi-Day1-Actor: clinician_unassigned' -d '{"context_id":"ctx_invalid_but_safe"}' "$QA_WORKER_URL/api/v1/day4/chart")
          test "$STATUS" = "403"
          grep -q 'forbidden' /tmp/day4-unassigned.json

      - name: D1 post-deploy read-only integrity
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute galvivault-0-5-qa --remote --config wrangler.day4.json --json --command="SELECT COUNT(*) AS duplicate_founders FROM (SELECT lower(email) FROM gv1_founders WHERE email IS NOT NULL AND email<>'' GROUP BY lower(email) HAVING COUNT(*)>1); SELECT COUNT(*) AS duplicate_bmrs FROM (SELECT venture_id FROM gv1_business_medical_records GROUP BY venture_id HAVING COUNT(*)>1);" > /tmp/day4-post.json
          grep -q '"duplicate_founders": 0' /tmp/day4-post.json
          grep -q '"duplicate_bmrs": 0' /tmp/day4-post.json

      - name: Day 4 automated gate summary
        run: |
          echo '## GalviCare 1.0 Day 4 Automated Critical Path' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing QA branch only: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Signed Day 3 ancestry: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Inherited Day 3/Day7D regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviChart 1.0 static contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Follow-up draft resilience static contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Customer-safe governed Chart interpretation contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- QA D1 0100-0103 reuse/no shadow DB: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact-SHA existing Worker deployment: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime readiness/security negatives: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**AUTOMATED GATE PASS — HUMAN E2E H01-H22 + ROLLBACK REHEARSAL STILL REQUIRED FOR DAY 4 BUILD FINAL.**' >> "$GITHUB_STEP_SUMMARY"