name: Day 7D Human E2E Source Repair

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "scripts/day7d-human-e2e-source-repair.mjs"
      - "day7d-browser-customer-intelligence.js"
      - ".github/workflows/day7d-human-e2e-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galvicare-day7d-human-e2e-source-repair
  cancel-in-progress: true

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply authoritative Day 7D customer-path repair
        run: node scripts/day7d-human-e2e-source-repair.mjs

      - name: Prove real QA source contains visible progressive questions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'galviscore_followup_completed_' index.html
          grep -q 'DAY7D_CUSTOMER_INTELLIGENCE_ADAPTER_SOURCE' index.html
          grep -q 'galvishot-followup-questions' index.html
          grep -q 'galvisight-followup-questions' index.html
          grep -q 'galvipath-followup-questions' index.html
          grep -q 'count=Math.max(count,1)' worker/day7d-engine.js
          echo 'PASS: authoritative QA browser + engine contain Day 7D human-E2E behavior.'

      - name: Commit repaired authoritative QA source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html worker/day7d-engine.js; then
            echo 'Source already repaired.'
          else
            git config user.name 'galvicare-day7d-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add index.html worker/day7d-engine.js
            git commit -m 'Day 7D: restore visible progressive customer intelligence'
            git push origin HEAD:qa-revamped-galvicare-0-5
          fi
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Day 7D focused tests
        run: npm run test:day7d

      - name: Full Day 1-7C preserved regression
        run: npm run stabilization:gate

      - name: Day 7C integration and QA browser build
        run: npm run day7c:gate

      - name: Prove generated browser matches repaired source
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-qa/index.html
          grep -q 'galviscore_followup_completed_' dist-qa/index.html
          grep -q 'galvishot-followup-questions' dist-qa/index.html
          grep -q 'galvisight-followup-questions' dist-qa/index.html
          grep -q 'galvipath-followup-questions' dist-qa/index.html
          grep -q 'evidence_version_bumped' dist-qa/index.html

      - name: Apply existing Day 7D schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.json

      - name: Deploy repaired authoritative QA Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json --var DAY7D_DEPLOY_SHA:${{ env.REPAIR_SHA }} --var DAY7D_DEPLOY_TARGET:galvicare-triage-intake

      - name: Verify exact repaired runtime and mandatory progressive intelligence
        shell: bash
        env:
          QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url=process.env.QA_WORKER_URL;
          const expected=process.env.REPAIR_SHA;
          const deadline=Date.now()+90000;
          let last;
          while(Date.now()<deadline){
            try{
              const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:Date.now()})});
              last=await r.json();
              if(r.ok&&last?.success===true&&last?.day7d?.enabled===true&&last?.day7d?.deployment_sha===expected){
                console.log('PASS: repaired Day 7D runtime converged',expected);
                process.exit(0);
              }
            }catch(e){last={error:String(e)}}
            await new Promise(r=>setTimeout(r,3000));
          }
          throw new Error(`Runtime did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: DAY 7D HUMAN E2E CANDIDATE READY
        run: |
          echo '## DAY 7D HUMAN E2E CANDIDATE READY' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviScore clarification routing restored in authoritative QA index.html' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviShot mandatory targeted intelligence: enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviSight visible targeted-question UI: enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviPath visible targeted-question UI: enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence versioning + cumulative regeneration: preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 1-7C regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Repaired source/deployment SHA: $REPAIR_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR ONE FINAL HUMAN E2E**' >> "$GITHUB_STEP_SUMMARY"
