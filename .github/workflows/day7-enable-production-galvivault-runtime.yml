# one-time operator; deletes itself after a green bounded patch
name: Day 7 enable Production GalviVault runtime

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - '.github/workflows/day7-enable-production-galvivault-runtime.yml'

permissions:
  contents: write

concurrency:
  group: galvivault-day7-production-runtime-remediation
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative QA branch
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Apply exact bounded runtime correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('worker/day1.js',
              "if (!['qa', 'local'].includes(config.environment)) {",
              "if (!['qa', 'local', 'production'].includes(config.environment)) {")
          replace_once('worker/day2.js',
              "if (!['qa', 'local'].includes(config.environment)) {",
              "if (!['qa', 'local', 'production'].includes(config.environment)) {")
          replace_once('worker/day3.js',
              "if (!['qa','local'].includes(cfg.environment)) throw new GVError('GV_ENV_MISCONFIGURED', 'Day 3 is restricted to QA or local.', 503);",
              "if (!['qa','local','production'].includes(cfg.environment)) throw new GVError('GV_ENV_MISCONFIGURED', 'Day 3 runtime environment is not permitted.', 503);")
          replace_once('worker/day4-common.js',
              "if (!['qa','local'].includes(ctx.environment)) throw new GVError('GV_ENV_MISCONFIGURED', 'Day 4 is restricted to QA or local.', 503);",
              "if (!['qa','local','production'].includes(ctx.environment)) throw new GVError('GV_ENV_MISCONFIGURED', 'Day 4 runtime environment is not permitted.', 503);")
          replace_once('worker/day5-common.js',
              "if (!['qa','local'].includes(ctx.environment)) throw new day4.GVError('GV_ENV_MISCONFIGURED', 'Day 5 is restricted to QA or local.', 503);",
              "if (!['qa','local','production'].includes(ctx.environment)) throw new day4.GVError('GV_ENV_MISCONFIGURED', 'Day 5 runtime environment is not permitted.', 503);")

          p = Path('worker/production-entry.js')
          text = p.read_text()

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'worker/production-entry.js: expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          rep("import day7aWorker from './worker.js';",
              "import day7aWorker from './worker.js';\nimport galviVaultWorker from './day5-entry.js';")
          rep("'Access-Control-Allow-Headers': 'Content-Type',",
              "'Access-Control-Allow-Headers': 'Content-Type, Idempotency-Key, X-Correlation-Id, X-Galvi-Role, X-Galvi-Actor-Id, X-GalviVault-Actor-Id, X-GalviVault-Actor-Type',")
          rep("    HUBSPOT_ENABLED: 'true',\n    ALLOWED_ORIGIN: isAllowedOrigin(origin) && origin ? origin : PRIMARY_PRODUCTION_ORIGIN",
              "    HUBSPOT_ENABLED: 'true',\n    FIXTURE_MODE: 'false',\n    API_VERSION: 'v1',\n    MIN_SCHEMA_VERSION: '0005',\n    ALLOWED_ORIGINS: Array.from(PRODUCTION_ORIGINS).join(','),\n    ALLOWED_ORIGIN: isAllowedOrigin(origin) && origin ? origin : PRIMARY_PRODUCTION_ORIGIN")

          anchor = "async function delegate(request, env, ctx, payload = null) {"
          if text.count(anchor) != 1:
              raise SystemExit('worker/production-entry.js: delegate anchor missing/ambiguous')
          helper = """async function delegateGalviVault(request, env, ctx) {\n  const response = await galviVaultWorker.fetch(request, productionEnv(env, request), ctx);\n  const headers = new Headers(response.headers);\n  headers.delete('Access-Control-Allow-Origin');\n  headers.delete('Access-Control-Allow-Credentials');\n  headers.delete('Access-Control-Allow-Headers');\n  headers.delete('Access-Control-Allow-Methods');\n  headers.delete('Access-Control-Max-Age');\n  for (const [key, value] of Object.entries(commonHeaders(request))) headers.set(key, value);\n  return new Response(response.body, {\n    status: response.status,\n    statusText: response.statusText,\n    headers\n  });\n}\n\n"""
          text = text.replace(anchor, helper + anchor, 1)

          rep("    if (forbiddenOrigin(request)) return json(request, { success: false, status: 'forbidden_origin' }, 403);\n    if (request.method === 'GET' && (pathname === '/' || pathname === '/health')) {",
              "    if (forbiddenOrigin(request)) return json(request, { success: false, status: 'forbidden_origin' }, 403);\n    if (pathname === '/ready' || pathname.startsWith('/api/v1/')) return delegateGalviVault(request, env, ctx);\n    if (request.method === 'GET' && (pathname === '/' || pathname === '/health')) {")

          rep("        hubspot_adapter: HUBSPOT_ADAPTER_MARKER,\n        db_bound: Boolean(env?.DB)",
              "        hubspot_adapter: HUBSPOT_ADAPTER_MARKER,\n        fixture_mode: false,\n        api_version: 'v1',\n        required_schema_version: '0005',\n        db_bound: Boolean(env?.DB)")
          rep("        hubspot_adapter: HUBSPOT_ADAPTER_MARKER,\n        db_bound: Boolean(env?.DB)",
              "        hubspot_adapter: HUBSPOT_ADAPTER_MARKER,\n        fixture_mode: false,\n        api_version: 'v1',\n        required_schema_version: '0005',\n        db_bound: Boolean(env?.DB)")

          p.write_text(text)
          PY

      - name: Prove correction is bounded and preserves GalviCare
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day1.js
          node --check worker/day2.js
          node --check worker/day3.js
          node --check worker/day4-common.js
          node --check worker/day5-common.js
          node --check worker/production-entry.js
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run stabilization:gate
          npm run day7b:gate
          node --test tests/day1-foundation.test.mjs tests/galvivault-day2-identity-continuity.test.mjs tests/day3-evidence-versioning.test.mjs tests/day4-reasoning-timeline.test.mjs tests/day4-reasoning-integration.test.mjs tests/day5-care.test.mjs tests/day7b-environment-isolation.test.mjs
          git diff --check
          git diff --name-only | sort | tee /tmp/day7-runtime-files.txt
          test "$(wc -l < /tmp/day7-runtime-files.txt | tr -d ' ')" -eq 6
          for f in worker/day1.js worker/day2.js worker/day3.js worker/day4-common.js worker/day5-common.js worker/production-entry.js; do grep -qx "$f" /tmp/day7-runtime-files.txt; done

      - name: Commit correction and remove temporary operator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/day7-enable-production-galvivault-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/day1.js worker/day2.js worker/day3.js worker/day4-common.js worker/day5-common.js worker/production-entry.js
          git diff --cached --check
          git commit -m 'Day 7: enable Production GalviVault cumulative runtime'
          git push origin HEAD:qa-revamped-galvicare-0-5
