name: Day 7B Production Release

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
    paths:
      - '.github/workflows/day7b-production-release.yml'
      - 'scripts/day7b-build-production-frontend.mjs'
      - 'scripts/day7b-d1-api.mjs'
      - 'scripts/day7b-verify-production-runtime-isolation.mjs'
      - 'migrations/production/**'
      - 'worker/production-entry.js'
      - 'worker/worker.js'
      - 'wrangler.production.jsonc'
      - 'index.html'
      - 'tests/day7b-environment-isolation.test.mjs'

permissions:
  contents: write

jobs:
  release-production-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative QA release source
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Final automated regression
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run stabilization:gate
          npm run day7b:gate
          git diff --check

      - name: Production D1 GREEN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/day7b-d1-api.mjs

      - name: Production security and isolation GREEN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/day7b-verify-production-runtime-isolation.mjs

      - name: Deploy hardened Production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.jsonc

      - name: Verify Production Worker is LIVE and fail-closed
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://galvicare-0-5-production.mrgalvipro.workers.dev/health'
          with urllib.request.urlopen(url, timeout=20) as r:
              body=json.load(r)
          assert body.get('success') is True, body
          assert body.get('environment') == 'production', body
          assert body.get('runtime_marker') == 'day7b-production-isolation-v1', body
          assert body.get('galvivault') == 'galvivault-0-5-production', body
          assert body.get('db_bound') is True, body
          assert body.get('stripe_mode') == 'live', body
          print(json.dumps(body, sort_keys=True))
          PY

      - name: Generate final Production LIVE frontend
        run: |
          node scripts/day7b-build-production-frontend.mjs
          test -f index.production.html
          grep -q 'https://galvicare-0-5-production.mrgalvipro.workers.dev' index.production.html
          ! grep -q 'https://galvicare-triage-intake.mrgalvipro.workers.dev' index.production.html
          ! grep -q 'buy.stripe.com/test_' index.production.html
          grep -q 'https://buy.stripe.com/14A00kbivcypgoGfBY53000' index.production.html
          grep -q 'https://buy.stripe.com/bJe7sM5Ze9jdc8qgG253001' index.production.html
          grep -q 'https://buy.stripe.com/00w14odrG1QLdcu9dA53002' index.production.html
          grep -q 'https://buy.stripe.com/eVq3cw3R63YT6O6ahE53003' index.production.html

      - name: Preserve generated Production artifact
        run: cp index.production.html /tmp/index.production.html

      - name: Checkout Production main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Publish Production frontend to main
        run: |
          cp /tmp/index.production.html index.html
          git diff --check
          ! grep -q 'galvicare-triage-intake.mrgalvipro.workers.dev' index.html
          ! grep -q 'buy.stripe.com/test_' index.html
          grep -q 'galvicare-0-5-production.mrgalvipro.workers.dev' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production index already current; no commit required.'
          else
            git commit -m 'Day 7B: publish Production LIVE frontend'
            git push origin HEAD:main
          fi

      - name: Release summary
        run: |
          echo '## Day 7B Production Release PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 7A regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production D1: GREEN' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production security/isolation: GREEN' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production Worker: hardened and LIVE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stripe mode: LIVE' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stripe mappings: LIVE x4' >> "$GITHUB_STEP_SUMMARY"
          echo '- TEST Stripe mappings in Production: 0' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production frontend published to main' >> "$GITHUB_STEP_SUMMARY"
          echo '- Status: READY FOR HUMAN E2E after Pages deployment completes' >> "$GITHUB_STEP_SUMMARY"
