name: Deploy GalviCare QA Worker

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/**"
      - "tests/**"
      - "wrangler.json"
      - "scripts/verify-qa-runtime.mjs"
      - ".github/workflows/deploy-galvicare-qa.yml"
  pull_request:
    branches:
      - qa-revamped-galvicare-0-5
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-qa-worker
  cancel-in-progress: true

jobs:
  qa-release-gate:
    name: Test → Deploy QA Worker → Verify Live Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact authoritative QA source
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify QA source
        shell: bash
        run: |
          test "$(git branch --show-current)" = "qa-revamped-galvicare-0-5"
          grep -q "Your Digital Business Clinic" index.html
          grep -q "GalviPath Check Up" index.html
          grep -q "clinicalDimensionLanguage" worker/worker.js

      - name: Run complete Day 7A automated gate
        shell: bash
        run: |
          node --check worker/worker.js
          npm test
          npm run stabilization:gate
          git diff --check

      - name: Deploy exact QA Worker source
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Verify exact deployed QA runtime
        env:
          GALVICARE_QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
        run: node scripts/verify-qa-runtime.mjs

      - name: Day 7A deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## GalviCare Day 7A QA Deployment PASS"
            echo ""
            echo "- Authoritative source: qa-revamped-galvicare-0-5"
            echo "- Worker: galvicare-triage-intake"
            echo "- Source tests: PASS"
            echo "- Stabilization gate: PASS"
            echo "- QA Worker deploy: PASS"
            echo "- Live runtime marker: PASS"
            echo "- GalviSight alias live: PASS"
            echo "- GalviPath alias live: PASS"
            echo ""
            echo "**READY FOR FINAL DAY 7A HUMAN E2E**"
          } >> "$GITHUB_STEP_SUMMARY"
