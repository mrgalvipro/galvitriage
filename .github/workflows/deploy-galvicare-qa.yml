name: Deploy GalviCare QA Worker

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/**"
      - "tests/**"
      - "scripts/**"
      - "migrations/**"
      - "day7d-browser-customer-intelligence.js"
      - "wrangler.json"
      - "package.json"
      - ".github/workflows/deploy-galvicare-qa.yml"

permissions:
  contents: read

concurrency:
  group: galvicare-qa-single-authoritative-deployer
  cancel-in-progress: true

env:
  QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
  DAY7D_RULES_VERSION: galviengine_customer_intelligence_v0_5_3
  DAY7D_QUESTION_VERSION: clinical_followups_v0_5_3
  DAY7D_CONTENT_VERSION: galvicare_day7d_customer_intelligence_v0_5_4
  DAY7D_RELEASE_CONTRACT: day7d_progressive_customer_intelligence_v2

jobs:
  qa-release-gate:
    name: Day 7D → Progressive Intelligence → Schema → Proven QA Deploy → Stable Runtime Proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact QA commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute authoritative Day 7D E2E release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$({ sha256sum worker/worker.js worker/day7d-engine.js day7d-browser-customer-intelligence.js scripts/day7b-build-qa-frontend.mjs wrangler.json; } | sha256sum | awk '{print $1}')"
          test -n "$RELEASE_ID"
          echo "DAY7D_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Authoritative Day 7D E2E release fingerprint: $RELEASE_ID"

      - name: Verify authoritative Day 7D P0 source without infrastructure expansion
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "qa-revamped-galvicare-0-5"
          test -f worker/worker.js
          test -f worker/day7d-engine.js
          test -f day7d-browser-customer-intelligence.js
          test -f migrations/0006_day7d_customer_intelligence.sql
          test -f scripts/day7d-preflight.mjs
          test -f scripts/verify-qa-runtime.mjs
          test -f tests/day7d-customer-intelligence.test.mjs
          test -f tests/day7d-customer-path-contract.test.mjs
          grep -q '"name": "galvicare-triage-intake"' wrangler.json
          grep -q '"main": "worker/day7d-engine.js"' wrangler.json
          grep -q '"binding": "DB"' wrangler.json
          grep -q '"database_name": "galvivault-0-5-qa"' wrangler.json
          grep -q "$DAY7D_RELEASE_CONTRACT" worker/day7d-engine.js
          grep -q "$DAY7D_RULES_VERSION" worker/day7d-engine.js
          grep -q "$DAY7D_QUESTION_VERSION" worker/day7d-engine.js
          grep -q "$DAY7D_CONTENT_VERSION" worker/day7d-engine.js
          grep -q 'async function atomicSave' worker/day7d-engine.js
          grep -q 'async function storedResult' worker/day7d-engine.js
          grep -q 'generation_source:'"'"'stored'"'"'' worker/day7d-engine.js
          grep -q 'generation_source:'"'"'regenerated'"'"'' worker/day7d-engine.js
          grep -q 'const impact=skipped?0' worker/day7d-engine.js
          grep -q 'if(!isSkipped(x.answer)' worker/day7d-engine.js
          grep -q 'approved_low_confidence_question_count:3' worker/day7d-engine.js
          grep -q 'skip_does_not_inflate_confidence:true' worker/day7d-engine.js
          grep -q 'evidence_version_cache:true' worker/day7d-engine.js
          grep -q 'cumulative_clinic_brief:true' worker/day7d-engine.js
          grep -q 'clinic_brief:' worker/day7d-engine.js
          grep -q 'get_clinical_file' worker/day7d-engine.js
          grep -q 'invokeLegacyWithResponse' day7d-browser-customer-intelligence.js
          grep -q 'skipCurrentQuestion' day7d-browser-customer-intelligence.js
          grep -q 'stopImmediatePropagation' day7d-browser-customer-intelligence.js
          grep -q 'renderReadyStage(product,regenerated)' day7d-browser-customer-intelligence.js
          echo 'PASS: authoritative Day 7D P0 source contract verified.'

      - name: Day 7D runtime preflight
        run: npm run day7d:preflight

      - name: Focused Day 7D customer-intelligence tests
        run: npm run test:day7d

      - name: Full preserved Day 1-7C regression
        run: npm run stabilization:gate

      - name: Day 7C integration regression and proven QA frontend build
        run: npm run day7c:gate

      - name: Prove generated QA browser contains complete progressive intelligence adapter
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-qa/index.html
          grep -q 'GALVICARE QA / TEST ENVIRONMENT — NO LIVE PAYMENTS' dist-qa/index.html
          grep -q 'needs_followup' dist-qa/index.html
          grep -q 'galvishot-followup-questions' dist-qa/index.html
          grep -q 'galvisight-followup-questions' dist-qa/index.html
          grep -q 'galvipath-followup-questions' dist-qa/index.html
          grep -q 'save_galvishot_followup' dist-qa/index.html
          grep -q 'save_galvisight_followup' dist-qa/index.html
          grep -q 'save_galvipath_followup' dist-qa/index.html
          grep -q 'skipCurrentQuestion' dist-qa/index.html
          grep -q 'stopImmediatePropagation' dist-qa/index.html
          grep -q 'invokeLegacyWithResponse' dist-qa/index.html
          grep -q 'renderReadyStage(product,regenerated)' dist-qa/index.html
          grep -q 'https://galvicare-triage-intake.mrgalvipro.workers.dev' dist-qa/index.html
          echo 'PASS: generated QA browser contains the complete Day 7D cumulative journey adapter.'

      - name: Apply Day 7D schema to existing QA D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.json

      - name: Verify all three Day 7D tables exist in existing QA D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: d1 execute galvivault-0-5-qa --remote --command="SELECT (SELECT COUNT(*) FROM day7d_context_evidence) AS context_rows, (SELECT COUNT(*) FROM clinical_evidence_versions) AS version_rows, (SELECT COUNT(*) FROM day7d_observations) AS observation_rows;" --config wrangler.json

      - name: Deploy authoritative Day 7D API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.json --var DAY7D_DEPLOY_SHA:${{ env.DAY7D_RELEASE_ID }} --var DAY7D_DEPLOY_TARGET:galvicare-triage-intake

      - name: Confirm active Cloudflare API deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deployments list --config wrangler.json

      - name: Wait for authoritative Day 7D P0 runtime convergence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.QA_WORKER_URL;
          const expected={
            enabled:true,
            rules_version:process.env.DAY7D_RULES_VERSION,
            question_version:process.env.DAY7D_QUESTION_VERSION,
            content_version:process.env.DAY7D_CONTENT_VERSION,
            entrypoint:'worker/day7d-engine.js',
            release_contract:process.env.DAY7D_RELEASE_CONTRACT,
            progressive_followups:true,
            dynamic_question_count:true,
            approved_low_confidence_question_count:3,
            skip_does_not_inflate_confidence:true,
            evidence_version_cache:true,
            cumulative_clinic_brief:true,
            atomic_followup_save:true,
            server_selected_question_validation:true,
            save_returns_regenerated_result:true
          };
          const deadline=Date.now()+180000;
          let last=null,consecutive=0;
          while(Date.now()<deadline){
            try{
              const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:`converge-${Date.now()}-${Math.random()}`})});
              const body=await response.json();
              last=body;
              const d=body?.day7d;
              let exact=response.ok&&body?.success===true;
              for(const [key,value] of Object.entries(expected)) exact=exact&&d?.[key]===value;
              consecutive=exact?consecutive+1:0;
              console.log(`Day 7D P0 runtime convergence: exact=${exact} consecutive=${consecutive}/4 rules=${d?.rules_version||'missing'} content=${d?.content_version||'missing'}`);
              if(consecutive>=4){console.log('PASS: authoritative Day 7D P0 runtime converged.');process.exit(0);}
            }catch(error){last={error:String(error?.message||error)};consecutive=0;}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error(`Authoritative Day 7D P0 runtime did not converge within 180 seconds. Last response: ${JSON.stringify(last)}`);
          NODE

      - name: Verify preserved Day 1-7C runtime foundation
        env:
          GALVICARE_QA_WORKER_URL: ${{ env.QA_WORKER_URL }}
        run: node scripts/verify-qa-runtime.mjs

      - name: Final Day 7D cumulative E2E contract proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected={
            enabled:true,
            rules_version:process.env.DAY7D_RULES_VERSION,
            question_version:process.env.DAY7D_QUESTION_VERSION,
            content_version:process.env.DAY7D_CONTENT_VERSION,
            entrypoint:'worker/day7d-engine.js',
            release_contract:process.env.DAY7D_RELEASE_CONTRACT,
            progressive_followups:true,
            dynamic_question_count:true,
            approved_low_confidence_question_count:3,
            skip_does_not_inflate_confidence:true,
            evidence_version_cache:true,
            cumulative_clinic_brief:true,
            atomic_followup_save:true,
            server_selected_question_validation:true,
            save_returns_regenerated_result:true
          };
          let consecutive=0,last=null;
          const deadline=Date.now()+90000;
          while(Date.now()<deadline){
            try{
              const response=await fetch(process.env.QA_WORKER_URL,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:`final-${Date.now()}-${Math.random()}`})});
              const body=await response.json(),d=body?.day7d;
              last=body;
              let exact=response.ok&&body?.success===true;
              for(const [key,value] of Object.entries(expected)) exact=exact&&d?.[key]===value;
              consecutive=exact?consecutive+1:0;
              console.log(`Final Day 7D P0 proof: exact=${exact} consecutive=${consecutive}/3`);
              if(consecutive>=3){console.log('DAY 7D FINAL P0 RUNTIME PROOF PASS');process.exit(0);}
            }catch(error){last={error:String(error?.message||error)};consecutive=0;}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error(`Final Day 7D P0 runtime proof failed: ${JSON.stringify(last)}`);
          NODE

      - name: READY FOR DAY 7D HUMAN E2E
        if: success()
        run: |
          echo '## DAY 7D QA RELEASE GATE: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 1-7C regression preservation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviTriage qualitative evidence persistence: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviVitals / GalviScore deterministic scoring preservation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Dynamic Worker-selected 0–3 follow-up contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Skip advancement without confidence/evidence inflation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence-version stored replay/regeneration: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviShot enriched diagnosis contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviSight enriched interpretation contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviPath enriched 90-day treatment-plan contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviClinic cumulative Founder Health Record contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing QA D1 schema: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Authoritative source fingerprint: $DAY7D_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- Stable deployed API runtime: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR DAY 7D HUMAN E2E**' >> "$GITHUB_STEP_SUMMARY"
