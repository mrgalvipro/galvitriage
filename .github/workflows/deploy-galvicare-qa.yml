name: Deploy GalviCare QA Worker

on:
  push:
    branches: [qa-revamped-galvicare-0-5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-qa-single-authoritative-deployer
  cancel-in-progress: true

env:
  QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api

jobs:
  qa-release-gate:
    name: Day 7D → Schema → Immutable 100% Deploy → Double Runtime Proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact QA commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source contract + preflight + focused tests + full regression + Day 7C regression
        shell: bash
        run: |
          set -euo pipefail
          test -f worker/day7d-engine.js
          test -f migrations/0006_day7d_customer_intelligence.sql
          grep -q '"name": "galvicare-triage-intake"' wrangler.json
          grep -q '"main": "worker/day7d-engine.js"' wrangler.json
          grep -q '"binding": "DB"' wrangler.json
          grep -q '"database_name": "galvivault-0-5-qa"' wrangler.json
          npm run day7d:preflight
          npm run test:day7d
          npm run stabilization:gate
          npm run day7c:gate

      - name: Apply dedicated Day 7D schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.json

      - name: Verify all 3 Day 7D tables
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --command="SELECT CASE WHEN COUNT(*)=3 THEN 'PASS' ELSE 'FAIL' END AS status, COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name IN ('day7d_context_evidence','clinical_evidence_versions','day7d_observations');" --config wrangler.json

      - name: Upload exact immutable Day 7D Worker version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.json --tag day7d-${{ github.sha }} --message "Day 7D QA ${{ github.sha }}" --var DAY7D_DEPLOY_SHA:${{ github.sha }} --var DAY7D_DEPLOY_TARGET:galvicare-triage-intake

      - name: Route 100 percent traffic to exact Day 7D version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions deploy --config wrangler.json --version-tag day7d-${{ github.sha }}@100% --message "Authoritative Day 7D QA ${{ github.sha }}" -y

      - name: Verify preserved Day 1-7C runtime
        env:
          GALVICARE_QA_WORKER_URL: ${{ env.QA_WORKER_URL }}
        run: node scripts/verify-qa-runtime.mjs

      - name: Exact SHA/runtime/schema proof #1 → 10 seconds → proof #2
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.QA_WORKER_URL;
          const sha=process.env.EXPECTED_SHA;
          async function proof(n){
            const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:`${Date.now()}-${n}`})});
            if(!r.ok) throw new Error(`HTTP ${r.status}`);
            const b=await r.json(); const d=b?.day7d;
            const expected={enabled:true,rules_version:'galviengine_customer_intelligence_v0_5_1',entrypoint:'worker/day7d-engine.js',schema_adapter:'day7d_dedicated_tables_v1',release_contract:'day7d_additive_legacy_preservation_v2',legacy_paid_result_preservation:true,payment_intelligence_decoupled:true,deployment_sha:sha};
            for(const [k,v] of Object.entries(expected)) if(d?.[k]!==v) throw new Error(`Proof ${n} failed ${k}: expected ${JSON.stringify(v)}, got ${JSON.stringify(d?.[k])}; body=${JSON.stringify(b)}`);
            console.log(`DAY 7D PROOF ${n}: PASS; SHA=${sha}`);
          }
          await proof(1);
          await new Promise(r=>setTimeout(r,10000));
          await proof(2);
          NODE

      - name: READY FOR DAY 7D HUMAN E2E
        if: success()
        run: |
          echo '## DAY 7D QA RELEASE GATE: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- 3 Day 7D tables: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Preserved Day 1-7C runtime: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 7D runtime/schema/SHA proof #1: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- 10-second stability proof #2: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR DAY 7D HUMAN E2E**' >> "$GITHUB_STEP_SUMMARY"
