name: Deploy GalviCare QA Worker

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/**"
      - "tests/**"
      - "package.json"
      - "wrangler.json"
      - "migrations/**"
      - "scripts/verify-qa-runtime.mjs"
      - "scripts/day7d-preflight.mjs"
      - ".github/workflows/deploy-galvicare-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-qa-worker-day7d-authoritative
  cancel-in-progress: true

jobs:
  qa-release-gate:
    name: Day 7D Gate → QA Schema → Exact Deploy → Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout authoritative QA
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact Day 7D additive source contract
        shell: bash
        run: |
          test "$(git branch --show-current)" = "qa-revamped-galvicare-0-5"
          test -f worker/worker.js
          test -f worker/day7d-engine.js
          test -f migrations/0006_day7d_customer_intelligence.sql
          test -f tests/day7d-customer-intelligence.test.mjs
          grep -q '"main": "worker/day7d-engine.js"' wrangler.json
          grep -q '"binding": "DB"' wrangler.json
          grep -q '"database_name": "galvivault-0-5-qa"' wrangler.json
          grep -q "galviengine_customer_intelligence_v0_5_1" worker/day7d-engine.js
          grep -q "day7d_dedicated_tables_v1" worker/day7d-engine.js
          grep -q "day7d_additive_legacy_preservation_v2" worker/day7d-engine.js
          grep -q "legacy_paid_result_preservation:true" worker/day7d-engine.js
          grep -q "payment_intelligence_decoupled:true" worker/day7d-engine.js
          grep -q "day7d_context_evidence" worker/day7d-engine.js
          grep -q "day7d_observations" worker/day7d-engine.js

      - name: Run Day 7D preflight
        run: npm run day7d:preflight

      - name: Run focused Day 7D tests
        run: npm run test:day7d

      - name: Run complete preserved regression gate
        run: npm run stabilization:gate

      - name: Run Day 7C integration regression gate
        run: npm run day7c:gate

      - name: Apply dedicated Day 7D schema to QA D1 only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.json

      - name: Verify all three Day 7D tables in QA D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute galvivault-0-5-qa --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('day7d_context_evidence','clinical_evidence_versions','day7d_observations') ORDER BY name;" --config wrangler.json

      - name: Deploy exact QA source with immutable Git commit fingerprint
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json --var DAY7D_DEPLOY_SHA:${{ github.sha }} --var DAY7D_DEPLOY_TARGET:galvicare-triage-intake

      - name: Verify preserved Day 1–7C QA runtime
        env:
          GALVICARE_QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
        run: node scripts/verify-qa-runtime.mjs

      - name: Verify Day 7D runtime + schema adapter + exact commit twice
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://galvicare-triage-intake.mrgalvipro.workers.dev/api';
          const expectedSha=process.env.EXPECTED_SHA;
          async function check(attempt){
            const response=await fetch(url,{
              method:'POST',
              headers:{'content-type':'application/json','cache-control':'no-cache'},
              body:JSON.stringify({action:'health_check',nonce:`${Date.now()}-${attempt}`})
            });
            if(!response.ok) throw new Error(`health_check HTTP ${response.status}`);
            const body=await response.json();
            const d=body?.day7d;
            if(body?.success!==true) throw new Error(`preserved health_check success != true on attempt ${attempt}: ${JSON.stringify(body)}`);
            if(d?.enabled!==true) throw new Error(`Day 7D runtime not enabled on attempt ${attempt}: ${JSON.stringify(body)}`);
            if(d?.rules_version!=='galviengine_customer_intelligence_v0_5_1') throw new Error(`Wrong rules version on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.entrypoint!=='worker/day7d-engine.js') throw new Error(`Wrong entrypoint on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.schema_adapter!=='day7d_dedicated_tables_v1') throw new Error(`Wrong schema adapter on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.release_contract!=='day7d_additive_legacy_preservation_v2') throw new Error(`Wrong release contract on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.legacy_paid_result_preservation!==true) throw new Error(`Legacy paid-result preservation is not enabled on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.payment_intelligence_decoupled!==true) throw new Error(`Payment/intelligence decoupling is not enabled on attempt ${attempt}: ${JSON.stringify(d)}`);
            if(d?.deployment_sha!==expectedSha) throw new Error(`Wrong active commit on attempt ${attempt}: expected ${expectedSha}, got ${d?.deployment_sha}`);
            console.log(JSON.stringify({attempt,status:'PASS',day7d:d},null,2));
          }
          await check(1);
          await new Promise(resolve=>setTimeout(resolve,10000));
          await check(2);
          NODE

      - name: Day 7D QA deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## GalviCare Day 7D QA Deployment PASS"
            echo ""
            echo "- Authoritative source: \`qa-revamped-galvicare-0-5\`"
            echo "- Active commit fingerprint: \`${GITHUB_SHA}\`"
            echo "- Entrypoint: \`worker/day7d-engine.js\`"
            echo "- QA D1: \`DB → galvivault-0-5-qa\`"
            echo "- Day 1–7C runtime foundation: PRESERVED"
            echo "- Legacy paid-result restoration contract: PRESERVED"
            echo "- Payment / Customer Intelligence coupling: REMOVED"
            echo "- Day 7D dedicated schema (3 tables): PASS"
            echo "- Day 7D preflight: PASS"
            echo "- Day 7D focused tests: PASS"
            echo "- Full regression: PASS"
            echo "- Day 7C regression: PASS"
            echo "- Authoritative exact-SHA QA deployment: PASS"
            echo "- Preserved runtime verification: PASS"
            echo "- Exact Day 7D runtime + schema adapter + commit SHA: PASS twice"
            echo ""
            echo "**READY FOR DAY 7D HUMAN E2E**"
          } >> "$GITHUB_STEP_SUMMARY"
