name: GalviCare Day7D Legacy Regression Validator

# Day 5+ cumulative QA ownership contract:
# - galvivault-p0-day1-qa is owned by the cumulative Day 5 governed-care workflow.
# - galvicare-0-5-qa is owned by the cumulative Day 5 browser workflow.
# - This legacy Day7D workflow is intentionally manual-only. It may validate the
#   inherited Day7D clarification/governed-AI contracts but cannot automatically
#   deploy an older runtime over an active Day 5 candidate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-day7d-legacy-regression-validator
  cancel-in-progress: true

jobs:
  regression:
    name: Validate inherited Day7D contracts without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove approved QA ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mrgalvipro/galvitriage"
          test "$GITHUB_REF_NAME" = "qa-revamped-galvicare-0-5"
          test "$(git branch --show-current)" != "work"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Validate inherited clarification and governed-AI contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day7d-engine.js
          node --check worker/day7d-day3-critical-path.js
          node --check day7d-browser-customer-intelligence.js
          node --test tests/day7d-customer-intelligence.test.mjs tests/day7d-customer-path-contract.test.mjs
          node --test tests/day4-galvicare-1-0.test.mjs

      - name: Prove legacy validator has no deployment authority
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'wrangler(@[^ ]+)?[[:space:]]+(deploy|d1 execute|versions deploy)|cloudflare/wrangler-action|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID' .github/workflows/deploy-galvicare-qa.yml | grep -v 'grep -nE'; then
            echo 'FAIL: legacy Day7D validator contains deployment or D1 mutation authority.' >&2
            exit 1
          fi
          echo 'PASS: legacy Day7D workflow is validation-only; cumulative Day5 owns QA deployment.'

      - name: Summary
        run: |
          echo '## Legacy Day7D Regression Validator' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic QA deployment: RETIRED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day7D clarification/governed-AI regression: VALIDATED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cumulative deployment owner: Day 5' >> "$GITHUB_STEP_SUMMARY"
