name: Deploy GalviCare QA Worker

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/**"
      - "tests/**"
      - "scripts/**"
      - "migrations/**"
      - "index.html"
      - "day7d-browser-customer-intelligence.js"
      - "qa-frontend-worker.js"
      - "wrangler.json"
      - "wrangler.qa-frontend.jsonc"
      - "package.json"
      - ".github/workflows/deploy-galvicare-qa.yml"

permissions:
  contents: read

concurrency:
  group: galvicare-qa-single-authoritative-deployer
  cancel-in-progress: true

env:
  QA_API_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev
  DAY7D_RULES_VERSION: galviengine_customer_intelligence_v0_5_4
  DAY7D_QUESTION_VERSION: clinical_followups_v0_5_4
  DAY7D_CONTENT_VERSION: galvicare_day7d_customer_intelligence_v0_5_6
  DAY7D_RELEASE_CONTRACT: day7d_cumulative_customer_intelligence_v3

jobs:
  qa-release-gate:
    name: Day 7D → One P0 Candidate → Worker + Frontend → Runtime Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Compute matched Day 7D release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$({ sha256sum worker/worker.js worker/day7d-engine.js day7d-browser-customer-intelligence.js scripts/day7b-build-qa-frontend.mjs scripts/day7d-preflight.mjs tests/day7d-customer-intelligence.test.mjs tests/day7d-customer-path-contract.test.mjs index.html qa-frontend-worker.js wrangler.json wrangler.qa-frontend.jsonc; } | sha256sum | awk '{print $1}')"
          test -n "$RELEASE_ID"
          echo "DAY7D_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Matched Day 7D QA candidate fingerprint: $RELEASE_ID"

      - name: Run one authoritative pre-human gate
        run: npm run day7d:gate

      - name: Verify generated cumulative QA frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='dist-qa/index.html';
          if(!fs.existsSync(path)) throw new Error('dist-qa/index.html was not generated');
          const html=fs.readFileSync(path,'utf8');
          const required=[
            'GALVICARE QA / TEST ENVIRONMENT — NO LIVE PAYMENTS',
            'Day 7D cumulative customer-intelligence browser adapter.',
            'galviscore-followup','save_galviscore_followup','get_or_generate_galviscore','renderUnlockedGalviScore',
            'galvishot-followup-questions','save_galvishot_followup',
            'galvisight-followup-questions','save_galvisight_followup',
            'galvipath-followup-questions','save_galvipath_followup','galvipath-book-galviclinic',
            'skipCurrentQuestion','stopImmediatePropagation','MAX_VISIBLE_TARGETED_QUESTIONS=3',
            'https://galvicare-triage-intake.mrgalvipro.workers.dev',
            'G-V5ZPM5L19T','xswd8m446z','https://calendly.com/galvilpro/galviclinic-day7c-qa'
          ];
          const missing=required.filter(token=>!html.includes(token));
          if(missing.length) throw new Error(`Generated QA frontend missing: ${missing.join(', ')}`);
          const signature='Day 7D cumulative customer-intelligence browser adapter.';
          const count=html.split(signature).length-1;
          if(count!==1) throw new Error(`Expected exactly one authoritative Day 7D adapter; found ${count}`);
          const forbidden=[
            'galvicare-0-5-production.mrgalvipro.workers.dev',
            'https://buy.stripe.com/14A00kbjycvpgoGfBY53O00',
            'https://buy.stripe.com/bJe7sM5Ze9jdc8qgG253O01',
            'https://buy.stripe.com/00w14odrG1QLdcu9dA53O02',
            'https://buy.stripe.com/eVq3cw3R63YT6O6ahE53O03'
          ];
          const leaked=forbidden.filter(token=>html.includes(token));
          if(leaked.length) throw new Error(`Production resource leaked into QA: ${leaked.join(', ')}`);
          console.log('PASS: one cumulative Triage → Vitals → Score → Shot → Sight → Path → Clinic frontend candidate generated.');
          NODE

      - name: Apply additive Day 7D schema to existing QA D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.json

      - name: Verify cumulative intelligence schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: d1 execute galvivault-0-5-qa --remote --command="SELECT (SELECT COUNT(*) FROM day7d_context_evidence) AS context_rows, (SELECT COUNT(*) FROM clinical_evidence_versions) AS version_rows, (SELECT COUNT(*) FROM day7d_observations) AS observation_rows;" --config wrangler.json

      - name: Deploy authoritative Day 7D Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.json --var DAY7D_DEPLOY_SHA:${{ env.DAY7D_RELEASE_ID }} --var DAY7D_DEPLOY_TARGET:galvicare-triage-intake

      - name: Deploy authoritative QA frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.qa-frontend.jsonc

      - name: Verify deployed Worker P0 convergence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected={
            enabled:true,
            rules_version:process.env.DAY7D_RULES_VERSION,
            question_version:process.env.DAY7D_QUESTION_VERSION,
            content_version:process.env.DAY7D_CONTENT_VERSION,
            entrypoint:'worker/day7d-engine.js',
            release_contract:process.env.DAY7D_RELEASE_CONTRACT,
            progressive_followups:true,
            dynamic_question_count:true,
            approved_low_confidence_question_count:3,
            galviscore_clarification_server_owned:true,
            objective_score_immutable:true,
            skip_does_not_inflate_confidence:true,
            evidence_version_cache:true,
            cumulative_clinic_brief:true,
            prior_product_results_in_clinical_file:true,
            bounded_multi_question_submit:true,
            collision_safe_followup_save:true,
            legacy_generation_bypass_closed:true,
            atomic_followup_save:true,
            server_selected_question_validation:true,
            save_returns_regenerated_result:true
          };
          const deadline=Date.now()+180000;
          let consecutive=0,last=null;
          while(Date.now()<deadline){
            try{
              const response=await fetch(process.env.QA_API_URL,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:`worker-${Date.now()}-${Math.random()}`})});
              const body=await response.json();
              const d=body?.day7d;
              const mismatches=[];
              if(!response.ok||body?.success!==true)mismatches.push(`http/success=${response.status}/${body?.success}`);
              for(const [key,value] of Object.entries(expected))if(d?.[key]!==value)mismatches.push(`${key}: expected ${JSON.stringify(value)}, got ${JSON.stringify(d?.[key])}`);
              last={body,mismatches};
              consecutive=mismatches.length===0?consecutive+1:0;
              console.log(`Worker convergence ${consecutive}/3${mismatches.length?`: ${mismatches.join(' | ')}`:''}`);
              if(consecutive>=3){console.log('PASS: deployed Day 7D Worker converged to the cumulative v3 P0 contract.');process.exit(0);}
            }catch(error){last={error:String(error?.message||error)};consecutive=0;console.log(`Worker convergence error: ${last.error}`);}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error(`Worker did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: Verify deployed complete QA frontend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required=[
            'GALVICARE QA / TEST ENVIRONMENT — NO LIVE PAYMENTS',
            'Day 7D cumulative customer-intelligence browser adapter.',
            'galviscore-followup','save_galviscore_followup','get_or_generate_galviscore',
            'galvishot-followup-questions','save_galvishot_followup',
            'galvisight-followup-questions','save_galvisight_followup',
            'galvipath-followup-questions','save_galvipath_followup','galvipath-book-galviclinic',
            'MAX_VISIBLE_TARGETED_QUESTIONS=3','G-V5ZPM5L19T','xswd8m446z'
          ];
          const deadline=Date.now()+120000;
          let last=null;
          while(Date.now()<deadline){
            try{
              const response=await fetch(`${process.env.QA_FRONTEND_URL}/?release=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              const html=await response.text();
              const missing=required.filter(token=>!html.includes(token));
              const count=html.split('Day 7D cumulative customer-intelligence browser adapter.').length-1;
              last={status:response.status,missing,count};
              if(response.ok&&missing.length===0&&count===1){console.log('PASS: deployed QA frontend matches the cumulative Worker contract.');process.exit(0);}
              console.log(`Frontend pending: HTTP ${response.status}; missing=${missing.join(', ')}; adapter_count=${count}`);
            }catch(error){last={error:String(error?.message||error)};}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error(`QA frontend did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: Verify preserved Day 1–7C runtime foundation
        env:
          GALVICARE_QA_WORKER_URL: ${{ env.QA_API_URL }}
        run: node scripts/verify-qa-runtime.mjs

      - name: READY FOR FINAL DAY 7D HUMAN E2E
        if: success()
        run: |
          echo '## DAY 7D AUTHORITATIVE QA RELEASE: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviTriage → GalviVitals preservation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviScore unlock → Worker clarification → enriched immutable score: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviShot unlock → targeted questions → atomic save → enriched diagnosis: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviSight unlock → targeted interpretation questions → enriched prescription: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviPath unlock → targeted feasibility questions → enriched 90-day plan: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- GalviClinic cumulative Founder Health Record: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Dynamic Worker-selected 0–3 follow-ups: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence-version replay/regeneration and idempotency: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Matched QA Worker + frontend deployment: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 7A–7C regression and environment separation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate fingerprint: $DAY7D_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR FINAL DAY 7D HUMAN E2E**' >> "$GITHUB_STEP_SUMMARY"
