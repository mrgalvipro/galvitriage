name: Deploy GalviCare QA Worker

on:
  workflow_dispatch:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/worker.js"
      - "worker/day7d-engine.js"
      - "worker/day7d-runtime.js"
      - "day7d-browser-customer-intelligence.js"
      - "day3-governed-ai-customer-bridge.mjs"
      - "scripts/day7b-build-qa-frontend.mjs"
      - "scripts/day7d-preflight.mjs"
      - "migrations/0006_day7d_customer_intelligence.sql"
      - "tests/day7c-integration.test.mjs"
      - "tests/day7d-customer-intelligence.test.mjs"
      - "tests/day7d-customer-path-contract.test.mjs"
      - "index.html"
      - "qa-frontend-worker.js"
      - "wrangler.day7d.json"
      - "wrangler.qa-frontend.jsonc"
      - "package.json"
      - ".github/workflows/deploy-galvicare-qa.yml"

permissions:
  contents: read

concurrency:
  group: galvicare-qa-single-authoritative-deployer
  cancel-in-progress: true

env:
  QA_API_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
  QA_FRONTEND_URL: https://galvicare-0-5-qa.mrgalvipro.workers.dev
  DAY7D_RULES_VERSION: galviengine_customer_intelligence_v0_5_4
  DAY7D_QUESTION_VERSION: clinical_followups_v0_5_4
  DAY7D_CONTENT_VERSION: galvicare_day7d_customer_intelligence_v0_5_6
  DAY7D_RELEASE_CONTRACT: day7d_cumulative_customer_intelligence_v3

jobs:
  qa-release-gate:
    name: Day 3 customer path → deterministic Worker + governed AI frontend → runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Compute matched customer-path release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$({ sha256sum worker/worker.js worker/day7d-engine.js day7d-browser-customer-intelligence.js day3-governed-ai-customer-bridge.mjs scripts/day7b-build-qa-frontend.mjs scripts/day7d-preflight.mjs tests/day7c-integration.test.mjs tests/day7d-customer-intelligence.test.mjs tests/day7d-customer-path-contract.test.mjs index.html qa-frontend-worker.js wrangler.day7d.json wrangler.qa-frontend.jsonc; } | sha256sum | awk '{print $1}')"
          test -n "$RELEASE_ID"
          echo "DAY7D_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Matched GalviCare QA customer-path candidate fingerprint: $RELEASE_ID"

      - name: Run authoritative pre-human gate
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/day7d-engine.js
          npm run day7d:gate
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bridge=fs.readFileSync('day3-governed-ai-customer-bridge.mjs','utf8');
          const required=[
            "OLD_SCORE_ACTION='get_or_generate_galviscore'",
            'assertLegacyScoreContract',
            'GV_DAY3_LEGACY_SCORE_CONTRACT',
            'GOVERNED BUSINESS HEALTH INTELLIGENCE',
            '/api/v1/day3/shot',
            '/api/v1/day3/sight',
            '/api/v1/day3/path'
          ];
          const missing=required.filter(token=>!bridge.includes(token));
          if(missing.length) throw new Error(`Day 3 customer bridge missing: ${missing.join(', ')}`);
          const forbidden="if(request&&request.action===OLD_SCORE_ACTION)request={...request,action:CANONICAL_SCORE_ACTION};";
          if(bridge.includes(forbidden)) throw new Error('P0 regression: Day 3 bridge remaps the authoritative GalviScore action to an incompatible Day 2 response contract.');
          if(/api\.openai\.com|OPENAI_API_KEY/.test(bridge)) throw new Error('P0 regression: browser bridge references OpenAI provider access or a secret binding.');
          console.log('PASS: deterministic GalviScore projection contract is preserved and governed AI remains server-side.');
          NODE

      - name: Verify generated cumulative QA frontend
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-qa/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist-qa/index.html','utf8');
          const required=[
            'GALVICARE QA / TEST ENVIRONMENT — NO LIVE PAYMENTS',
            'Day 7D cumulative customer-intelligence browser adapter.',
            'GalviCare Day 3 governed AI customer bridge v1',
            'GOVERNED BUSINESS HEALTH INTELLIGENCE',
            'GV_DAY3_LEGACY_SCORE_CONTRACT',
            'get_or_generate_galviscore',
            'galvishot-followup-questions',
            'galvisight-followup-questions',
            'galvipath-followup-questions'
          ];
          const missing=required.filter(token=>!html.includes(token));
          if(missing.length) throw new Error(`Generated QA frontend missing: ${missing.join(', ')}`);
          if(html.split('Day 7D cumulative customer-intelligence browser adapter.').length-1!==1) throw new Error('Expected one authoritative Day 7D adapter.');
          if(html.split('GalviCare Day 3 governed AI customer bridge v1').length-1!==1) throw new Error('Expected one Day 3 governed-AI customer bridge.');
          const forbidden="if(request&&request.action===OLD_SCORE_ACTION)request={...request,action:CANONICAL_SCORE_ACTION};";
          if(html.includes(forbidden)) throw new Error('Generated QA frontend contains the incompatible GalviScore action translation.');
          console.log('PASS: generated customer path preserves deterministic score rendering and contains governed-AI projection.');
          NODE

      - name: Apply additive Day 7D schema to existing QA D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: d1 execute galvivault-0-5-qa --remote --file=migrations/0006_day7d_customer_intelligence.sql --config wrangler.day7d.json

      - name: Build exact-candidate Day 7D runtime config
        shell: bash
        run: |
          set -euo pipefail
          jq '.main="worker/day7d-engine.js" | .vars.DAY7D_DEPLOY_SHA=env.DAY7D_RELEASE_ID | .vars.DAY7D_DEPLOY_TARGET="galvicare-triage-intake"' \
            wrangler.day7d.json > wrangler.day7d-runtime.generated.json
          test "$(jq -r '.name' wrangler.day7d-runtime.generated.json)" = "galvicare-triage-intake"
          test "$(jq -r '.main' wrangler.day7d-runtime.generated.json)" = "worker/day7d-engine.js"
          test "$(jq -r '.vars.ENVIRONMENT' wrangler.day7d-runtime.generated.json)" = "qa"
          test "$(jq -r '.d1_databases[] | select(.binding=="DB") | .database_name' wrangler.day7d-runtime.generated.json)" = "galvivault-0-5-qa"

      - name: Deploy authoritative deterministic QA Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.day7d-runtime.generated.json

      - name: Remove generated runtime config
        if: always()
        shell: bash
        run: rm -f wrangler.day7d-runtime.generated.json

      - name: Deploy authoritative QA frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: npm
          command: deploy --config wrangler.qa-frontend.jsonc --var DAY7D_FRONTEND_RELEASE_ID:${{ env.DAY7D_RELEASE_ID }}

      - name: Verify deployed deterministic Worker P0 convergence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected={
            enabled:true,
            rules_version:process.env.DAY7D_RULES_VERSION,
            question_version:process.env.DAY7D_QUESTION_VERSION,
            content_version:process.env.DAY7D_CONTENT_VERSION,
            entrypoint:'worker/day7d-engine.js',
            release_contract:process.env.DAY7D_RELEASE_CONTRACT,
            galviscore_clarification_server_owned:true,
            objective_score_immutable:true,
            progressive_followups:true,
            dynamic_question_count:true,
            approved_low_confidence_question_count:3,
            evidence_version_cache:true,
            cumulative_clinic_brief:true,
            prior_product_results_in_clinical_file:true,
            bounded_multi_question_submit:true,
            collision_safe_followup_save:true,
            legacy_generation_bypass_closed:true,
            atomic_followup_save:true,
            server_selected_question_validation:true,
            save_returns_regenerated_result:true
          };
          const deadline=Date.now()+120000;
          let consecutive=0,last=null;
          while(Date.now()<deadline){
            try{
              const response=await fetch(process.env.QA_API_URL,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'health_check',nonce:`worker-${Date.now()}`})});
              const body=await response.json();
              const mismatches=[];
              if(!response.ok||body?.success!==true)mismatches.push(`http/success=${response.status}/${body?.success}`);
              for(const [key,value] of Object.entries(expected)) if(body?.day7d?.[key]!==value) mismatches.push(`${key}: ${JSON.stringify(body?.day7d?.[key])}`);
              last={mismatches,body};
              consecutive=mismatches.length===0?consecutive+1:0;
              if(consecutive>=3){ console.log('PASS: deployed authoritative Day 7D deterministic Worker converged.'); process.exit(0); }
            } catch(error) { last={error:String(error)}; consecutive=0; }
            await new Promise(resolve=>setTimeout(resolve,2500));
          }
          throw new Error(`Deterministic Worker did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: Verify deployed complete QA frontend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const deadline=Date.now()+120000;
          let consecutive=0,last=null;
          while(Date.now()<deadline){
            try{
              const healthResponse=await fetch(`${process.env.QA_FRONTEND_URL}/health?release=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              const health=await healthResponse.json();
              const response=await fetch(`${process.env.QA_FRONTEND_URL}/?release=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              const html=await response.text();
              const required=['Day 7D cumulative customer-intelligence browser adapter.','GalviCare Day 3 governed AI customer bridge v1','GOVERNED BUSINESS HEALTH INTELLIGENCE','GV_DAY3_LEGACY_SCORE_CONTRACT'];
              const valid=response.ok&&healthResponse.ok&&health?.release_id===process.env.DAY7D_RELEASE_ID&&required.every(token=>html.includes(token));
              last={status:response.status,health_status:healthResponse.status,release_id:health?.release_id,missing:required.filter(token=>!html.includes(token))};
              consecutive=valid?consecutive+1:0;
              if(consecutive>=3){ console.log('PASS: deployed QA frontend matches candidate and contains governed-AI customer projection.'); process.exit(0); }
            } catch(error) { last={error:String(error)}; consecutive=0; }
            await new Promise(resolve=>setTimeout(resolve,2500));
          }
          throw new Error(`QA frontend did not converge: ${JSON.stringify(last)}`);
          NODE

      - name: READY FOR FINAL DAY 3 HUMAN E2E
        if: success()
        run: |
          echo '## GALVICARE DAY 3 CUSTOMER PATH QA RELEASE: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate fingerprint: $DAY7D_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- Deterministic GalviScore response contract preserved: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authoritative Day 7D deterministic Worker deployed: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Day 3 governed-AI customer projection bridge deployed: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production touched: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '**READY FOR FINAL DAY 3 HUMAN E2E**' >> "$GITHUB_STEP_SUMMARY"
