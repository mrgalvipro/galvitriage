name: Deploy GalviCare QA Worker

on:
  push:
    branches:
      - qa-revamped-galvicare-0-5
    paths:
      - "worker/**"
      - "tests/**"
      - "package.json"
      - "wrangler.json"
      - "migrations/**"
      - "scripts/verify-qa-runtime.mjs"
      - "scripts/day7d-preflight.mjs"
      - "scripts/day7b-apply-production-schema.sh"
      - ".github/workflows/deploy-galvicare-qa.yml"
  pull_request:
    branches:
      - qa-revamped-galvicare-0-5
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galvicare-qa-worker
  cancel-in-progress: true

jobs:
  qa-release-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[day7b-prod-schema]') }}
    name: Test → Day 7D QA Migration → Deploy QA Worker → Verify Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact authoritative QA source
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify QA source
        shell: bash
        run: |
          test "$(git branch --show-current)" = "qa-revamped-galvicare-0-5"
          grep -q "Your Digital Business Clinic" index.html
          grep -q "GalviPath Check Up" index.html
          grep -q "clinicalDimensionLanguage" worker/worker.js
          grep -q '"binding": "DB"' wrangler.json
          grep -q '"database_name": "galvivault-0-5-qa"' wrangler.json

      - name: Detect complete Day 7D candidate
        id: day7d
        shell: bash
        run: |
          if test -f worker/day7d-engine.js \
            && test -f migrations/0006_day7d_customer_intelligence.sql \
            && test -f tests/day7d-customer-intelligence.test.mjs \
            && node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:day7d'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Complete Day 7D source candidate detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Day 7D source candidate not yet complete; running preserved Day 7A-7C QA gate only."
          fi

      - name: Run preserved Day 7A-7C automated gate
        shell: bash
        run: |
          node --check worker/worker.js
          npm test
          npm run stabilization:gate
          npm run day7c:gate
          git diff --check

      - name: Run Day 7D critical-path preflight
        if: steps.day7d.outputs.present == 'true'
        shell: bash
        run: node scripts/day7d-preflight.mjs

      - name: Run focused Day 7D customer-intelligence gate
        if: steps.day7d.outputs.present == 'true'
        shell: bash
        run: |
          node --check worker/day7d-engine.js
          npm run test:day7d
          git diff --check

      - name: Apply Day 7D migration to QA D1 only
        if: steps.day7d.outputs.present == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply galvivault-0-5-qa --remote --config wrangler.json

      - name: Deploy exact QA Worker source
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Verify exact deployed QA runtime
        if: github.event_name != 'pull_request'
        env:
          GALVICARE_QA_WORKER_URL: https://galvicare-triage-intake.mrgalvipro.workers.dev/api
        run: node scripts/verify-qa-runtime.mjs

      - name: QA deployment summary
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            if [ "${{ steps.day7d.outputs.present }}" = "true" ]; then
              echo "## GalviCare Day 7D QA Deployment PASS"
              echo ""
              echo "- Authoritative source: \`qa-revamped-galvicare-0-5\`"
              echo "- Commit: \`${GITHUB_SHA}\`"
              echo "- Worker: \`galvicare-triage-intake\`"
              echo "- QA D1 binding: \`DB → galvivault-0-5-qa\`"
              echo "- Day 7A-7C regression gate: PASS"
              echo "- Day 7D preflight: PASS"
              echo "- Day 7D focused tests: PASS"
              echo "- Migration 0006 / QA D1 migrations: PASS"
              echo "- QA Worker deploy: PASS"
              echo "- Live runtime verification: PASS"
              echo ""
              echo "**READY FOR DAY 7D HUMAN E2E**"
            else
              echo "## GalviCare QA Deployment PASS — Day 7D Source Not Yet Published"
              echo ""
              echo "- Authoritative source: \`qa-revamped-galvicare-0-5\`"
              echo "- Commit: \`${GITHUB_SHA}\`"
              echo "- Day 7A-7C regression gate: PASS"
              echo "- QA Worker deploy: PASS"
              echo "- Live runtime verification: PASS"
              echo "- Day 7D source candidate: NOT YET COMPLETE"
              echo ""
              echo "**DO NOT START DAY 7D HUMAN E2E**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  day7b-production-schema:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message || '', '[day7b-prod-schema]') }}
    name: Day 7B → Initialize Production D1 → Verify Empty Customer Data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact QA hardening source
        uses: actions/checkout@v4
        with:
          ref: qa-revamped-galvicare-0-5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute guarded Production schema initializer
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/day7b-apply-production-schema.sh

      - name: Day 7B Production schema summary
        if: success()
        shell: bash
        run: |
          {
            echo "## GalviCare Day 7B Production Schema PASS"
            echo ""
            echo "- Production D1: galvivault-0-5-production"
            echo "- Production D1 ID: 2fc954b7-00ca-405b-8313-f91e706845a2"
            echo "- Guarded Day 7A + Day 7B gate: PASS"
            echo "- Production schema initialized: PASS"
            echo "- QA customer/payment rows copied: NO"
            echo ""
            echo "**NEXT: RUNTIME ISOLATION + STRIPE/PUBLIC FRONTEND EVIDENCE**"
          } >> "$GITHUB_STEP_SUMMARY"
